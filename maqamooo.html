.mq-original-logo{display:inline-block;aspect-ratio:1564/2680;flex-shrink:0;position:relative;min-height:36px;max-height:88px;width:auto;mask:url('/assets/brand/maqam.png') center/contain no-repeat;background:var(--text-1);-webkit-mask:url('/assets/brand/maqam.png') center/contain no-repeat}
.mq-original-logo img{display:block;height:100%;width:auto;visibility:hidden;object-fit:contain}
html[data-theme=dark] .mq-original-logo{background:#fff}
.r3-live{width:100%;text-align:start}.r3-live-frame{width:100%;aspect-ratio:16/9;border:0}
.fb-button[aria-pressed=true]{border-color:var(--accent)!important;color:var(--accent)!important;background:var(--surface-2)!important}
.mq-lecture-list>div,.mq-institute-lessons>div{border:1px solid var(--border)!important;border-radius:10px!important;background:var(--surface-1)!important;overflow:hidden}
.mq-lecture-list{gap:16px!important}.fb-page-body details summary{cursor:pointer;min-height:44px}.fb-page-body details[open] summary{margin-block-end:12px}

.r3-playlist-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px}.r3-playlist-add .fb-field{min-width:0;max-width:140px}.r3-playlist-add select{width:100%}.r3-playlist-add small{flex-basis:100%}.mq-lecture-list>div{padding:12px!important}.mq-lecture-list .fb-button{font-size:11px;padding:8px;min-height:44px}.mq-lecture-list img{object-fit:cover}.mq-lecture-list>div>button{min-width:100px}
/* D.2 timetable: the shared document owns palette, fonts and controls. */
.r3-timetable{color:var(--text-1);min-width:0}
.r3-tt-header{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}
.r3-tt-header h2{margin:0 0 12px}.r3-tt-header p{font-size:13px;line-height:1.9;margin:4px 0}
.r3-tt-desktop{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface-1)}
.r3-tt-table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:880px;font-size:12px}
.r3-tt-table th,.r3-tt-table td{border-block-end:1px solid var(--border);border-inline-end:1px solid var(--border);padding:10px 8px;vertical-align:top;text-align:start;overflow-wrap:anywhere}
.r3-tt-table th{background:var(--surface-2);font-weight:600;line-height:1.9}
.r3-tt-table th:first-child{width:90px}.r3-tt-table th small{display:block;color:var(--text-2);font-size:10px;font-weight:400}
.r3-tt-table tr:last-child>*{border-block-end:0}.r3-tt-table tr>*:last-child{border-inline-end:0}
.r3-tt-table .r3-tt-today{box-shadow:inset 0 3px 0 var(--accent);background:var(--surface-2)}
.r3-tt-course{border:1px solid var(--border);border-inline-start:3px solid var(--accent);border-radius:4px;background:var(--surface-2);margin:0 0 10px}
.r3-tt-course:last-child{margin-bottom:0}.r3-tt-tone-1{background:var(--surface-3);border-inline-start-color:var(--text-2)}.r3-tt-tone-2{background:var(--surface-1);border-inline-start-color:var(--accent)}
.r3-tt-course summary{cursor:pointer;padding:10px 8px;line-height:1.85;list-style-position:inside}
.r3-tt-course summary:hover{background:var(--surface-3)}.r3-tt-course summary strong,.r3-tt-course summary span,.r3-tt-course summary small{display:block}
.r3-tt-course summary strong{font-size:12px;font-weight:600}.r3-tt-course summary span{color:var(--text-2);margin-top:6px}.r3-tt-course summary small{color:var(--text-2);margin-top:6px;font-size:10px}.r3-tt-course summary .r3-tt-details-label{font-size:10px;color:var(--accent)}
.r3-tt-details{padding:10px;border-block-start:1px solid var(--border);font-size:12px;line-height:1.9}.r3-tt-details p{margin:0 0 10px}.r3-tt-details ul{padding-inline-start:18px}.r3-tt-details .fb-button{white-space:normal;max-width:100%}
.r3-tt-empty{display:block;color:var(--text-3);font-size:11px;min-height:40px;line-height:1.8}
.r3-tt-tasks{border-block-start:1px solid var(--border);padding-block:16px}.r3-tt-tasks ul{list-style:none;margin:0;padding:0}.r3-tt-tasks li{display:flex;align-items:center;flex-wrap:wrap;gap:12px;border-block-end:1px solid var(--border);padding-block:10px;font-size:12px}.r3-tt-tasks time{color:var(--text-2);margin-inline-start:auto}
.r3-tt-mobile{display:none}.r3-timetable :is(button,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:767px){.r3-tt-desktop{display:none}.r3-tt-mobile{display:block}.r3-tt-header nav{display:flex;gap:8px}.r3-tt-header nav .fb-button{font-size:11px;padding-inline:10px;min-height:44px}.r3-tt-days{display:flex;overflow-x:auto;border-block-end:1px solid var(--border);gap:4px;padding:4px 0 10px;margin-bottom:16px}.r3-tt-days button{background:var(--surface-1);border:1px solid var(--border);border-radius:4px;color:var(--text-2);padding:10px 12px;min-height:44px;flex-shrink:0;font:inherit;font-size:12px;cursor:pointer}.r3-tt-days button:hover{background:var(--surface-3)}.r3-tt-days button[aria-selected=true]{border-color:var(--accent);color:var(--text-1);background:var(--surface-2)}.r3-tt-days small{display:block;color:var(--accent)}.r3-tt-mobile-slot{padding-block:14px;border-block-end:1px solid var(--border)}.r3-tt-mobile-slot h4{font-size:13px;margin:0 0 12px;color:var(--text-2)}.r3-tt-course summary strong{font-size:14px}.r3-tt-course summary small{font-size:12px}.r3-tt-course summary{padding:12px}.r3-tt-tasks time{margin:0;width:100%}}
@media(prefers-reduced-motion:reduce){.r3-timetable *{scroll-behavior:auto!important;transition:none!important}}

:"unverified","sourceSha256":"b48cf5a840e27b871c35d6129cb75520175d98221005a8669a62e4d75d00f554"}];window.MAQAM_SUBTITLE_SOURCE={"videoId":null,"status":"unverified-source-identity","sourceFile":"اللغات والترجمة الفورية.txt","sourceSha256":"b48cf5a840e27b871c35d6129cb75520175d98221005a8669a62e4d75d00f554","alignmentVerified":false,"segments":[{"id":0,"ar":"بسم الله الرحمن الرحيم ان الحمدلله نحمده ونستعينه ونستغفره ونتوب اليه","en":"In the name of God, the Most Gracious, the Most Merciful. Indeed, praise be to God, we praise Him, seek His help, seek His forgiveness, and repent to Him.","ur":"خدا کے نام سے جو بڑا مہربان نہایت رحم والا ہے۔ بے شک، حمد اللہ کے لیے ہے، ہم اس کی حمد کرتے ہیں، اس سے مدد مانگتے ہیں، اس سے بخشش چاہتے ہیں، اور اس سے توبہ کرتے ہیں۔","tr":"Rahman ve Rahim olan Allah'ın adıyla. Şüphesiz hamd Allah'a mahsustur, O'na hamdederiz, O'ndan yardım dileriz, O'ndan bağışlanma dileriz ve O'na tövbe ederiz.","duration":10},{"id":1,"ar":"ونعوذ بالله من شرور انفسنا ومن سيئات اعمالنا","en":"We seek refuge in God from the evils of ourselves and the bad deeds of our deeds","ur":"ہم اپنی ذات کی برائیوں اور اپنے اعمال کی برائیوں سے خدا کی پناہ مانگتے ہیں۔","tr":"Nefsimizin kötülüklerinden ve amellerimizin kötülüğünden Allah'a sığınırız.","duration":4},{"id":2,"ar":"من يهده الله فلا مضل له","en":"Whoever God guides, there is no one who can lead him astray","ur":"جسے اللہ ہدایت دے اسے کوئی گمراہ نہیں کر سکتا","tr":"Allah kime hidayet ederse onu saptıracak yoktur","duration":4},{"id":3,"ar":"ومن يضلل فلا هادي له","en":"And whoever leads astray, there is no guide for him","ur":"اور جو گمراہ ہو اس کے لیے کوئی ہدایت کرنے والا نہیں۔","tr":"Kim de sapıklığa düşerse artık onun için bir yol gösterici yoktur.","duration":3},{"id":4,"ar":"واشهد ان لا اله الا الله واشهد ان محمد عبده ورسوله","en":"I bear witness that there is no god but Allah, and I bear witness that Muhammad is His servant and Messenger","ur":"میں گواہی دیتا ہوں کہ اللہ کے سوا کوئی معبود نہیں اور میں گواہی دیتا ہوں کہ محمد اس کے بندے اور رسول ہیں","tr":"Şehadet ederim ki Allah'tan başka ilah yoktur ve Muhammed'in O'nun kulu ve elçisi olduğuna şahitlik ederim","duration":6},{"id":5,"ar":"صلى الله وسلم وبارك عليه وعلى اله واصحابه","en":"May God’s blessings and peace be upon him and his family and companions","ur":"خدا کی رحمتیں اور سلامتی ہوں ان پر اور ان کے اہل و عیال پر","tr":"Allah'ın salât ve selamı kendisine, ailesine ve ashabına olsun","duration":7},{"id":6,"ar":"ومن تبعهم باحسان الى يوم الدين","en":"And whoever follows them in goodness until the Day of Judgment","ur":"اور جو قیامت تک ان کی اچھائی کے ساتھ پیروی کرے","tr":"Ve Kıyamet Günü'ne kadar onların peşinden iyilikle gidenler","duration":5},{"id":7,"ar":"اللهم علمنا ما ينفعنا وانفعنا بما علمتنا وزدنا علما","en":"O God, teach us what benefits us, benefit us with what You have taught us, and increase our knowledge","ur":"اے اللہ ہمیں وہ علم سکھا جو ہمیں فائدہ پہنچائے، جو تو نے ہمیں سکھایا ہے اس سے ہمیں فائدہ پہنچا اور ہمارے علم میں اضافہ فرما","tr":"Allah'ım, bize fayda sağlayacak olanı öğret, bize öğrettiklerinden faydalandır ve ilmimizi artır.","duration":7},{"id":8,"ar":"سبحانك لا علم لنا الا ما علمتنا انك انت العليم الحكيم","en":"Glory be to You! We have no knowledge except what You have taught us. Indeed, You are the Knowing, the Wise.","ur":"آپ کی ذات پاک ہے! ہمیں کوئی علم نہیں سوائے اس کے جو آپ نے ہمیں سکھایا ہے۔ بے شک تو جاننے والا اور حکمت والا ہے۔","tr":"Sen Yücesin! Bize öğrettiğin dışında hiçbir bilgimiz yoktur. Şüphesiz Sen, Bilen'sin, Hüküm ve Hikmet Sahibi'sin.","duration":8},{"id":9,"ar":"نرحب بطلاب العلم وقاصدي المسجد الحرام","en":"We welcome seekers of knowledge and those visiting the Grand Mosque","ur":"ہم علم کے متلاشیوں اور مسجد حرام میں آنے والوں کا خیرمقدم کرتے ہیں۔","tr":"İlim talebelerini ve Mescid-i Haram'ı ziyaret edenleri memnuniyetle karşılıyoruz.","duration":6},{"id":10,"ar":"مع استئناف الدروس العلمية في تفسير القران العظيم","en":"With the resumption of scientific lessons in the interpretation of the Great Qur’an","ur":"عظیم قرآن کی تفسیر میں سائنسی اسباق کی بحالی کے ساتھ","tr":"Büyük Kuran'ın tefsirinde ilmi derslerin yeniden başlamasıyla birlikte","duration":7},{"id":11,"ar":"وشرح حديث رسول الله صلى الله عليه وسلم","en":"And explaining the hadith of the Messenger of God, may God bless him and grant him peace","ur":"اور رسول اللہ صلی اللہ علیہ وسلم کی حدیث کی وضاحت کرتے ہوئے","tr":"Ve Allah Resulü'nün (s.a.v.) hadislerini açıklamak","duration":6},{"id":12,"ar":"ونحن اليوم في اليوم الثامن من الشهر الأول شهر الله المحرم","en":"Today we are on the eighth day of the first month, the sacred month of God, Muharram","ur":"آج ہم پہلے مہینے کے آٹھویں دن ہیں، خدا کا مقدس مہینہ، محرم","tr":"Bugün ilk ayın, yani Allah'ın mübarek ayı Muharrem'in sekizinci günündeyiz.","duration":7},{"id":13,"ar":"شهر واحد من عام ثمانية وأربعين واربع مئة والف من الهجرة النبوية","en":"Month 1 of the year one thousand four hundred and forty-eight of the Prophet’s migration","ur":"ہجرت نبوی کا سال ایک ہزار چار سو اڑتالیس کا مہینہ 1","tr":"Peygamber Efendimiz'in hicretinin bin dört yüz kırk sekizinci yılının 1. ayı","duration":10},{"id":14,"ar":"على صاحبها افضل صلاة وازكى تحية","en":"Best prayers and purest greetings to its companion","ur":"اس کے ساتھی کے لیے بہترین دعائیں اور خالص ترین سلام","tr":"Yoldaşına en güzel dualar ve en içten selamlar","duration":4},{"id":15,"ar":"ونحن في بداية العام ينبغي ان نقف وقفات مع دروس وعبر","en":"At the beginning of the year, we should pause with lessons and reflections","ur":"سال کے آغاز میں، ہمیں اسباق اور عکاسی کے ساتھ توقف کرنا چاہئے","tr":"Yılın başında dersler ve düşüncelerle duraklamalıyız","duration":10},{"id":16,"ar":"في بداية العام حدث عظيم ليس بالامر الهين","en":"At the beginning of the year, a great event is not an easy matter","ur":"سال کے آغاز میں ایک عظیم واقعہ کوئی آسان بات نہیں ہے۔","tr":"Yılın başında büyük bir olay kolay bir mesele değildir","duration":10},{"id":17,"ar":"وهو من انصرام الاعمار ومن انقضاء الاجال فمرور الأيام وا         className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.reduceMotion
        ? 'mq-surface-2 mq-success mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.reduceMotion ? '✓ مفعل (الحركات متوقفة)' : 'تعطيل'}
        </button>
        </div>

        {/* 3. دوار المركبة / دوار الحركة (نقاط الأفق البصري المتحركة) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">مساعد دوار المركبة والحركة (Motion Sickness)</h4>
        <p className="text-xs mq-muted">إظهار نقاط بصرية ديناميكية بأطراف الشاشة لتثبيت توازن الأذن الداخلية أثناء التنقل</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.motionSicknessDots;
        setAccessSettings({ ...accessSettings, motionSicknessDots: newVal });
        showToast(newVal ? 'تم إظهار نقاط تثبيت الأفق البصري' : 'تم إخفاء نقاط الدوار');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.motionSicknessDots
        ? 'mq-surface-2 mq-ink mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.motionSicknessDots ? '✓ مفعل (النقاط ظاهرة)' : 'تعطيل'}
        </button>
        </div>

        {/* 4. عسر القراءة (Dyslexia-friendly) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">نمط تيسير القراءة (عسر القراءة / Dyslexia)</h4>
        <p className="text-xs mq-muted">تباعد إضافي ومريح بين الأسطر والكلمات مع خط واضح وسهل التمييز</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.dyslexiaFont;
        setAccessSettings({ ...accessSettings, dyslexiaFont: newVal });
        showToast(newVal ? 'تم تفعيل نمط القراءة الميسرة' : 'تم تعطيل نمط عسر القراءة');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.dyslexiaFont
        ? 'mq-surface-2 mq-accent mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.dyslexiaFont ? '✓ مفعل' : 'تعطيل'}
        </button>
        </div>

        {/* 5. مترجم لغة الإشارة (Sign Language) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">مترجم لغة الإشارة الذكي (Sign Language PIP)</h4>
        <p className="text-xs mq-muted">نافذة قابلة للتحريك لبث مترجم الإشارة عند توفر رابط معتمد. يظهر تنبيه واضح عند عدم ربط بث.</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.signLanguageActive;
        setAccessSettings({ ...accessSettings, signLanguageActive: newVal });
        showToast(newVal ? 'تم إظهار نافذة لغة الإشارة في الزاوية' : 'تم إخفاء لغة الإشارة');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.signLanguageActive
        ? 'mq-surface-2 mq-accent mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.signLanguageActive ? '✓ ظاهرة الآن' : 'إظهار نافذة الإشارة'}
        </button>
        </div>

        <section className="p-4 border mq-border rounded-lg mq-surface-2">
        <div className="flex items-center justify-between gap-4">
        <div><h4>تقليل الضوضاء البصرية</h4><p className="text-xs mq-muted">تبسيط الخلفيات والظلال وزيادة التباعد والتباين.</p></div>
        <button type="button" role="switch" aria-label="تقليل الضوضاء البصرية" aria-checked={accessSettings.visualNoise === true} onClick={() => setAccessSettings(previous => ({...previous, visualNoise: !previous.visualNoise}))} className="px-4 py-2 border mq-border rounded mq-ink">{accessSettings.visualNoise ? 'مفعل' : 'تفعيل'}</button>
        </div></section>
        {/* 6. الأوامر الصوتية (Voice Commands) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border space-y-3">
        <div className="flex items-center justify-between">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">التحكم بالأوامر الصوتية (Voice Navigation)</h4>
        <p className="text-xs mq-muted">للتنقل بالصوت دون الحاجة للفأرة أو لوحة المفاتيح</p>
        </div>
        </div>

        <button
        onClick={handleToggleVoiceCommands}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border ${
        isListeningVoice
        ? 'mq-surface-2 mq-danger mq-border'
        : 'mq-surface-2 mq-ink mq-border mq-hover'
        }  `}
        >
        <Icons.Mic />
        <span>{isListeningVoice ? 'جاري الاستماع...' : 'تحدث بأمر صوتي'}</span>
        </button>
        </div>

        {voiceOutput && (
        <div className="p-3 rounded-xl mq-surface-2 border mq-border text-xs mq-ink">
        {voiceOutput}
        </div>
        )}

        <div className="flex flex-wrap items-center gap-2 pt-1 text-[11px]">
        <span className="mq-muted">أوامر سريعة:</span>
        {[
        { cmd: 'افتح الزائر', act: () => { onNavigate('visitor_login'); onClose(); } },
        { cmd: 'بوابة المعلم', act: () => { onNavigate('teacher_login'); onClose(); } },
        { cmd: 'رواق الطالب', act: () => { onNavigate('student_login'); onClose(); } },
        { cmd: 'الصفحة الرئيسية', act: () => { onNavigate('main'); onClose(); } }
        ].filter(item=>item.cmd!=='بوابة المعلم'||(!matchMedia('(max-width:767px)').matches&&!matchMedia('(pointer:coarse)').matches)).map((c, i) => (
        <button
        key={i}
        onClick={c.act}
        className="px-2.5 py-1 rounded-lg mq-surface-2 mq-hover mq-muted border mq-border"
        >
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> "{c.cmd}"
        </button>
        ))}
        </div>
        </div>

        </div>

        {/* ذيل النافذة مع خيار استعادة الافتراضي */}
        <div className="p-4 border-t mq-border mq-surface-2 flex items-center justify-between text-xs">
        <button
        onClick={() => {
        setAccessSettings({
        dyslexiaFont: false,
        reduceMotion: false,
        motionSicknessDots: false,
        colorBlindness: 'normal',
        signLanguageActive: false,
        visualNoise: false
        });
        showToast('تمت استعادة الإعدادات القياسية');
        }}
        className="mq-muted transition-colors"
        >
        ↺ إعادة ضبط الكل للافتراضي
        </button>

        <button data-ui-close="true" aria-label="إغلاق"
        onClick={onClose}
        className="px-6 py-2 rounded-xl mq-ink font-bold transition-all"
        >
        اعتماد الإعدادات
        </button>
        </div>
        </div>
        </MaqamDialogFrame>
            );
        };


        
        // =======================================================
        // 1. نافذة إعداد ونشر المقطع المطابقة للصورة المرفوعة بالملي (ClipShareModal)
        // =======================================================
        const ClipShareModal = ({ isOpen, onClose, lectureTitle = "منهج السالكين وتوضيح الفقه في الدين", sheikhName = "الشيخ أ.د. سامي الصقير", videoThumb }) => {
            const [selectedPlatform, setSelectedPlatform] = useState('TikTok');
            const [selectedLang, setSelectedLang] = useState('اردو (Translation)');
            const [showSubtitles, setShowSubtitles] = useState(true);
            const [clipDuration, setClipDuration] = useState(24);
            const [startPos, setStartPos] = useState(20);
            const [isSharing, setIsSharing] = useState(false);
            const [shareSuccess, setShareSuccess] = useState(false);

            if (!isOpen) return null;

            const handlePublish = () => {
                setIsSharing(true);
                setTimeout(() => {
                    setIsSharing(false);
                    setShareSuccess(true);
                    setTimeout(() => {
                        setShareSuccess(false);
                        onClose();
                    }, 2200);
                }, 1200);
            };

            return (
                <MaqamDialogFrame data-ui-owner="ClipShareModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-3 sm:p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-surface border mq-border rounded-[28px] max-w-[390px] w-full p-5 space-y-4 relative mq-ink select-none"
        onClick={(e) => e.stopPropagation()}
        >
        {/* ترويسة النافذة مع زر الإغلاق الدائري الأحمر في الزاوية */}
        <div className="relative flex items-center justify-center pb-1">
        <button data-ui-close="true" aria-label="إغلاق" 
        onClick={onClose}
        className="absolute right-0 top-0 w-8 h-8 rounded-full mq-surface mq-hover mq-ink flex items-center justify-center font-bold text-sm transition-transform"
        >
        ✕
        </button>
        <h3 className="font-extrabold text-base sm:text-lg mq-ink mq-owner tracking-wide">
        إعداد ونشر المقطع
        </h3>
        </div>

        {/* شاشة المعاينة الطولية للمقطع (Vertical Reels 9:16) */}
        <div className="flex justify-center my-1">
        <div className="relative w-44 h-64 rounded-lg border-2 mq-border overflow-hidden flex flex-col items-center justify-center group">
        {videoThumb ? (
        <img src={videoThumb} alt="المعاينة" className="w-full h-full object-cover opacity-60" />
        ) : (
        <div className="absolute inset-0 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:12px_12px] opacity-30"></div>
        )}
        
        {/* خطوط التدرج المائلة المستوحاة من الصورة */}
        <div className="absolute inset-0 bg-[linear-gradient(135deg,transparent_25%,rgba(59,130,246,0.15)_25%,rgba(59,130,246,0.15)_50%,transparent_50%,transparent_75%,rgba(59,130,246,0.15)_75%)] bg-[length:24px_24px] pointer-events-none"></div>

        {/* علامة المعاينة المركزية */}
        <div className="relative z-10 px-4 py-1.5 rounded-xl mq-surface-2 border mq-border flex items-center gap-1.5 text-xs font-bold mq-ink">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        <span>المعاينة</span>
        </div>

        {/* النص المترجم التفاعلي فوق المقطع */}
        {showSubtitles && (
        <div className="absolute bottom-4 inset-x-3 mq-surface-2 border mq-border rounded-lg p-2 text-center text-[10px] mq-accent font-bold leading-tight">
        {selectedLang.includes('اردو') ? 'توحید اور شریعت کے عظیم مقاصد کا فہم' : 
        selectedLang.includes('انجليزي') ? 'Understanding divine monotheism and legal objectives' : 
        selectedLang.includes('عرب') ? 'من أعظم القواعد الكلية إفراد الله بالتوحيد' :
        'Memahami tauhid dan tujuan mulia syariat'}
        </div>
        )}
        </div>
        </div>

        {/* صف التحكم بالنص واللغة */}
        <div className="mq-surface border mq-border rounded-lg p-2.5 flex items-center justify-between gap-2 text-xs">
        <button
        type="button"
        onClick={() => setShowSubtitles(!showSubtitles)}
        className={` px-3.5 py-1.5 rounded-xl font-bold transition-all flex items-center gap-1.5 ${
        showSubtitles 
        ? 'mq-surface mq-ink' 
        : 'mq-surface-2 mq-muted'
        }  `}
        >
        <span>{showSubtitles ? '✓' : '✕'}</span>
        <span>إظهار النص</span>
        </button>

        {/* القائمة المنسدلة لاختيار لغة النص المترجم */}
        <div className="relative flex-1">
        <select
        value={selectedLang}
        onChange={(e) => setSelectedLang(e.target.value)}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-1.5 text-xs mq-ink font-medium outline-none cursor-pointer"
        >
        <option value="اردو (Translation)">اردو (Translation)</option>
        <option value="عربي (الأصل)">عربي (الأصل)</option>
        <option value="انجليزي (English)">انجليزي (English)</option>
        <option value="اندونيسي (Bahasa)">اندونيسي (Bahasa)</option>
        <option value="تركي (Türkçe)">تركي (Türkçe)</option>
        <option value="فرنسي (Français)">فرنسي (Français)</option>
        </select>
        </div>
        </div>

        {/* قسم اقتطاع المقطع السلايدر المتطور */}
        <div className="mq-surface border mq-border rounded-lg p-3 space-y-2 text-right">
        <p className="text-[11px] mq-muted font-medium">
        اقتطاع المقطع (اسحب المربع للتنقل، أو الأطراف لتحديد المدة):
        </p>

        {/* مسار السلايدر التفاعلي */}
        <div className="relative h-12 rounded-xl mq-surface border mq-border overflow-hidden flex items-center px-1">
        {/* المقطع المظلل بالاقتطاع */}
        <div 
        className="absolute h-10 rounded-lg mq-surface border-2 mq-border flex items-center justify-between px-1 cursor-grab"
        style={{ right: `${startPos}%`, width: `${Math.min(75, clipDuration * 2.2)}%` }}
        >
        {/* المقبض الأيمن */}
        <div className="w-2.5 h-7 rounded-sm mq-surface text-[8px] flex items-center justify-center font-mono mq-ink select-none">
        |
        </div>

        <div className="text-[9px] font-bold mq-ink tracking-widest opacity-70">••••</div>

        {/* المقبض الأيسر */}
        <div className="w-2.5 h-7 rounded-sm mq-surface text-[8px] flex items-center justify-center font-mono mq-ink select-none">
        |
        </div>
        </div>
        </div>

        {/* توقيت الاقتطاع مع وسم المدة بالوسط */}
        <div className="flex items-center justify-between text-[11px] mq-muted px-1 pt-0.5">
        <span className="font-mono mq-muted">45:20</span>
        
        <div className="px-3 py-0.5 rounded-full mq-surface mq-ink border mq-border text-[10px] font-black tracking-wide">
        المدة: {clipDuration} ثانية
        </div>

        <span className="font-mono mq-muted">00:00</span>
        </div>

        {/* أزرار سريعة لتغيير مدة الاقتطاع */}
        <div className="flex items-center justify-center gap-2 pt-1">
        {[15, 24, 30, 45, 60].map(sec => (
        <button
        key={sec}
        type="button"
        onClick={() => setClipDuration(sec)}
        className={` px-2 py-0.5 rounded-md text-[10px] font-bold transition-all ${
        clipDuration === sec ? 'mq-selected mq-ink' : 'mq-surface-2 mq-muted'
        }  `}
        >
        {sec}ث
        </button>
        ))}
        </div>
        </div>

        {/* دوائر منصات التواصل الاجتماعي (TikTok, Insta, FB, WA) */}
        <div className="flex items-center justify-center gap-3 py-1">
        {/* زر TikTok دائري أسود */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('TikTok')}
        className={` w-12 h-12 rounded-full mq-bg mq-ink font-bold text-[11px] flex items-center justify-center transition-transform border ${
        selectedPlatform === 'TikTok' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على TikTok"
        >
        TikTok
        </button>

        {/* زر Insta دائري تدرج إنستغرام */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('Insta')}
        className={` w-12 h-12 rounded-full mq-ink font-bold text-[11px] flex items-center justify-center transition-transform border ${
        selectedPlatform === 'Insta' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على Instagram Reels"
        >
        Insta
        </button>

        {/* زر FB دائري أزرق فيسبوك */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('FB')}
        className={` w-12 h-12 rounded-full mq-surface mq-ink font-bold text-xs flex items-center justify-center transition-transform border ${
        selectedPlatform === 'FB' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على Facebook"
        >
        FB
        </button>

        {/* زر WA دائري أخضر واتساب */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('WA')}
        className={` w-12 h-12 rounded-full mq-surface mq-ink font-black text-xs flex items-center justify-center transition-transform border ${
        selectedPlatform === 'WA' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="مشاركة عبر WhatsApp"
        >
        WA
        </button>
        </div>

        {/* زر نشر المقطع العريض الأخضر الزمردي */}
        <button
        type="button"
        onClick={handlePublish}
        disabled={isSharing}
        className="w-full py-3.5 rounded-lg mq-bg mq-hover active:scale-[0.98] mq-ink font-extrabold text-sm sm:text-base transition-all flex items-center justify-center gap-2"
        >
        {isSharing ? (
        <>
        <span className="w-4 h-4 border-2 mq-border border-t-transparent rounded-full"></span>
        <span>جاري تجهيز المقطع واقتطاعه...</span>
        </>
        ) : shareSuccess ? (
        <>
        <span>✓</span>
        <span>تم النشر بنجاح على {selectedPlatform}!</span>
        </>
        ) : (
        <span>نشر المقطع</span>
        )}
        </button>
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // 2. نافذة "اختبرني" الفقهية التفاعلية للمحاضرة (LectureQuizModal)
        // =======================================================
        const LectureQuizModal = ({ isOpen, onClose, lectureTitle }) => {
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            if (!isOpen) return null;

            const questions = [
                {
                    id: 1,
                    q: "ما هو الأصل في باب التوحيد والعبادة في الشريعة الإسلامية؟",
                    options: [
                        "إفراد الله وحده لا شريك له بالعبادة واستشعار عظمته",
                        "جواز الاستغاثة بغير الله في الأمور الغيبية",
                        "صرف جزء من العبادات تعظيماً للصالحين"
                    ],
                    correct: 0,
                    explanation: "الأصل الأصيل إفراد الله جل وعلا بالتوحيد والعبادة دون شريك."
                },
                {
                    id: 2,
                    q: "ما المقصود بمصطلح 'الصنعة العلمية' عند علماء الحرمين؟",
                    options: [
                        "الصناعات اليدوية في عمارة المسجد الحرام",
                        "المَلَكة والمهارة الراسخة في توظيف القواعد الأصولية واستنباط الأحكام",
                        "قراءة الكتب العلمية دون تحقيق أو تأصيل"
                    ],
                    correct: 1,
                    explanation: "الصنعة العلمية هي الملكة والمهارة الفقهية الرصينة في تخريج الفروع على الأصول."
                },
                {
                    id: 3,
                    q: "إذا شك الطائف في عدد الأشواط أثناء الطواف، فعلى ماذا يبني؟",
                    options: [
                        "يبني على الأكثر تحوطاً",
                        "يبني على اليقين وهو الأقل",
                        "يقطع طوافه ويعيد من جديد وجوباً"
                    ],
                    correct: 1,
                    explanation: "القاعدة الأصولية المعتمدة: 'اليقين لا يزول بالشك' فيبني على الأقل."
                }
            ];

            const handleSelect = (qId, optionIdx) => {
                if (submitted) return;
                setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const calculateScore = () => {
                let score = 0;
                questions.forEach(q => {
                    if (selectedAnswers[q.id] === q.correct) score += 1;
                });
                return score;
            };

            return (

        </div>

function FeedbackProvider({children}){
    const [data,setData]=useState(()=>{try{return feedbackDomain.read(localStorage.getItem(feedbackDomain.KEY));}catch(e){return feedbackDomain.initial();}});
    const ref=useRef(data);const [clock,setClock]=useState(Date.now());const [viewState,setViewState]=useState({view:'',payload:{}});const routePayloads=useRef(new Map());const [storageError,setStorageError]=useState('');
    const update=React.useCallback(fn=>{const next=typeof fn==='function'?fn(ref.current):fn;if(!next||next===ref.current)return ref.current;feedbackDomain.write(localStorage,next);ref.current=next;setData(next);return next;},[]);
    const open=React.useCallback((view,payload={})=>{const base=location.hash.split('?')[0]||'#student_dash';const id=payload?.id??payload?.lecture?.id??'';const key=feedbackDomain.pageKey(base,view,id);routePayloads.current.set(key,payload);try{update(d=>({...d,pageCache:Object.fromEntries([...Object.entries(d.pageCache||{}).filter(([k])=>k!==key),[key,payload]].slice(-30))}));}catch(e){setStorageError('تعذر حفظ حالة الصفحة محلياً؛ ستبقى متاحة حتى إغلاقها.');}const params=new URLSearchParams({view});if(id!=='')params.set('id',id);history.pushState({feedback:true},'',base+'?'+params);setViewState({view,payload});},[update]);
    const close=React.useCallback(()=>{if(history.state?.feedback){history.back();return;}const base=location.hash.split('?')[0]||'#student_dash';history.replaceState({},'',base);setViewState({view:'',payload:{}});},[]);
    const notify=React.useCallback((type,title,target)=>update(d=>feedbackDomain.notification(d,{id:crypto.randomUUID(),type,title,target,at:new Date().toISOString()})),[update]);
    const recordActivity=React.useCallback((kind,id,points)=>update(d=>feedbackDomain.award(d,kind,id,points)),[update]);
    useEffect(()=>{const restore=()=>{const p=new URLSearchParams(location.hash.split('?')[1]||'');const view=p.get('view')==='calendar'?'timetable':p.get('view')||'';const id=p.get('id')||'';setViewState({view,payload:routePayloads.current.get(feedbackDomain.pageKey(location.hash,view,id))||ref.current.pageCache?.[feedbackDomain.pageKey(location.hash,view,id)]||{id}});};const event=e=>open(e.detail?.view||'',e.detail?.payload||{});window.addEventListener('popstate',restore);window.addEventListener('hashchange',restore);window.addEventListener('fb:open',event);restore();return()=>{window.removeEventListener('popstate',restore);window.removeEventListener('hashchange',restore);window.removeEventListener('fb:open',event);};},[open]);
    useEffect(()=>{const check=()=>{if(document.hidden)return;setClock(Date.now());try{const n=feedbackDomain.reconcile(ref.current);if(n!==ref.current)update(n);setStorageError('');}catch(e){setStorageError('تعذر حفظ التنبيهات محلياً. راجع مساحة المتصفح.');}};check();const timer=setInterval(check,15000);window.addEventListener('focus',check);document.addEventListener('visibilitychange',check);return()=>{clearInterval(timer);window.removeEventListener('focus',check);document.removeEventListener('visibilitychange',check);};},[update]);
    useEffect(()=>{let cancelled=false;Promise.all(['lectures','summaries','quizzes'].map(name=>fetch('/data/'+name+'.json').then(r=>{if(!r.ok)throw Error('asset');return r.json();}))).then(([catalog,summaries,quizzes])=>{if(cancelled)return;if(!Array.isArray(catalog)||!Array.isArray(summaries)||!Array.isArray(quizzes))throw Error('asset');update(d=>({...d,lectures:round3Domain.mergeCatalog(d.lectures,catalog,summaries,quizzes)}));}).catch(()=>{if(!cancelled)setStorageError('تعذر تحميل بيانات المحاضرات المرفقة. حاول إعادة فتح الصفحة.');});return()=>{cancelled=true;};},[update]);
    useEffect(()=>{const check=()=>{const due=round3Domain.dueReminders(ref.current.reminders);if(!due.length)return;try{update(d=>{let n={...d,reminders:{...d.reminders}};for(const r of due){n.reminders[r.id]={...r,delivered:true};n=feedbackDomain.notification(n,{id:'reminder:'+r.id+':'+r.at,type:'live',title:'تذكير: '+r.title,at:new Date().toISOString(),target:{view:r.id==='live-stream'?'live':'lecture',payload:{id:r.id}}});}return n;});for(const r of due)if('Notification'in window&&Notification.permission==='granted')new Notification('مَقَام',{body:r.title,tag:'maqam:'+r.id});}catch(e){setStorageError('تعذر حفظ التذكيرات محلياً.');}};check();const timer=setInterval(check,15000);return()=>clearInterval(timer);},[update]);
    const api={data,update,notify,recordActivity,open,close,view:viewState.view,payload:viewState.payload,storageError,visible:type=>feedbackDomain.visible(data,type,Math.max(clock,Date.now())),play:(lecture,queue=[],autoPlay=false)=>window.dispatchEvent(new CustomEvent('fb:play',{detail:{lecture,queue,autoPlay}})),language:name=>window.dispatchEvent(new CustomEvent('fb:language',{detail:{name}})),access:()=>window.dispatchEvent(new CustomEvent('fb:access')),profile:()=>open('profile')};
    return <FeedbackContext.Provider value={api}><style>{FeedbackStudentStyles}</style>{children}</FeedbackContext.Provider>;
}

function FeedbackPageFrame({title,children,onBack}){const f=useFeedback();const root=useRef(null);useEffect(()=>{const previous=document.activeElement;const siblings=[...root.current.parentElement.children].filter(x=>x!==root.current&&!x.contains(root.current));const inertBefore=siblings.map(x=>[x,x.inert]);siblings.forEach(x=>x.inert=true);root.current?.focus();const close=onBack||f.close;const key=e=>{if(e.key==='Escape'){e.preventDefault();close();}else if(e.key==='Tab'){const list=[...root.current.querySelectorAll('button,a[href],input,textarea,select,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=list[0],last=list[list.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===root.current)){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}};root.current.addEventListener('keydown',key);const current=root.current;return()=>{current.removeEventListener('keydown',key);inertBefore.forEach(([x,value])=>x.inert=value);previous?.isConnected&&previous.focus?.();};},[title]);return <section className="fb-page mq-owner" data-feedback-page={f.view} dir={document.documentElement.dir||'rtl'} ref={root} tabIndex={-1} role="dialog" aria-modal="true" aria-label={title}><header className="fb-page-header"><FeedbackButton onClick={onBack||f.close}><FeedbackIcon name="back"/>رجوع</FeedbackButton><h1>{title}</h1><FeedbackNotificationsButton/><span className="mq-language-theme"><FeedbackButton aria-label="اللغة" onClick={()=>f.language()}><Icons.Globe/></FeedbackButton><AppearanceControls/></span></header><main className="fb-page-body">{f.storageError&&<FeedbackNotice error>{f.storageError}</FeedbackNotice>}{children}</main></section>;}
function FeedbackPages(){const f=useFeedback();if(!f.view||!['homework','notifications','timetable','lecture','leaderboard','quiz','profile','playlists','live'].includes(f.view))return null;const titles={homework:'صفحة حل الواجب',notifications:'التنبيهات',timetable:'الجدول الدراسي الأسبوعي',lecture:'مشاهدة المحاضرة',leaderboard:'لوحة المتصدرين',quiz:'الاختبار',profile:'الملف الشخصي',playlists:'قوائم التشغيل',live:'البث المباشر'};return <FeedbackPageFrame title={titles[f.view]}>{f.view==='playlists'?<Round3Playlists/>:f.view==='live'?<Round3Live/>:f.view==='homework'?<FeedbackHomework key={f.payload.id||'list'}/>:f.view==='notifications'?<FeedbackNotifications/>:f.view==='timetable'?<Round3Timetable/>:f.view==='lecture'?<FeedbackLecture key={f.payload.id||f.payload.lecture?.id||'lecture'}/>:f.view==='leaderboard'?<FeedbackLeaderboard/>:f.view==='quiz'?<FeedbackQuiz key={f.payload.id||'quiz'}/>:<FeedbackProfile/>}</FeedbackPageFrame>;}

function FeedbackHomework(){
    const f=useFeedback();const list=f.visible('assignments');const selected=list.find(a=>String(a.id)===String(f.payload.id));const existing=selected?f.data.submissions[selected.id]:null;
    const [answer,setAnswer]=useState(existing?.answer||'');const [attachment,setAttachment]=useState(existing?.fileId?{id:existing.fileId,name:existing.fileName||'مرفق محفوظ'}:null);const [busy,setBusy]=useState(false);const [progress,setProgress]=useState(0);const [confirm,setConfirm]=useState(false);const [message,setMessage]=useState('');const [error,setError]=useState('');const [now,setNow]=useState(Date.now());
    const pendingFiles=useRef(new Set());const committedFile=useRef(existing?.fileId||'');const attachmentMounted=useRef(true);
    const retireFile=id=>fbDeleteFile(id).catch(()=>setError('تعذر تنظيف مرفق محلي قديم. إجابتك المحفوظة لم تتغير.'));
    useEffect(()=>{attachmentMounted.current=true;return()=>{attachmentMounted.current=false;pendingFiles.current.forEach(id=>fbDeleteFile(id).catch(()=>{}));pendingFiles.current.clear();};},[]);
    const commitAttachment=()=>{const current=attachment?.id||'';fbAttachmentRetire(committedFile.current,current,true,[...pendingFiles.current]).forEach(retireFile);pendingFiles.current.delete(current);committedFile.current=current;};
    useEffect(()=>{const id=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(id);},[]);
    const attach=async file=>{if(!file)return;setError('');setBusy(true);try{if(!/^(application\/pdf|text\/plain|image\/(png|jpeg|webp)|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document)$/.test(file.type))throw Error('المرفقات المسموحة: PDF أو نص أو صورة أو DOCX.');if(file.size>10*1024*1024)throw Error('الحد الأقصى لمرفق الواجب 10 ميجابايت.');const saved=await fbPutFile(file,setProgress);if(!attachmentMounted.current){await fbDeleteFile(saved.id);return;}pendingFiles.current.forEach(id=>{if(id!==saved.id)retireFile(id);});pendingFiles.current.clear();pendingFiles.current.add(saved.id);setAttachment(saved);setMessage('تم حفظ المرفق محلياً. احفظ المسودة لربطه بإجابتك.');}catch(e){setError(e.message);}finally{setBusy(false);}};
    const save=()=>{setError('');try{if(answer.length>50000)throw Error('الإجابة أطول من الحد المسموح.');f.update(d=>({...d,submissions:{...d.submissions,[selected.id]:{...(d.submissions[selected.id]||{}),answer,fileId:attachment?.id||'',fileName:attachment?.name||'',savedAt:new Date().toISOString()}}}));commitAttachment();setMessage('تم حفظ المسودة على هذا المتصفح.');}catch(e){setError('تعذر حفظ المسودة. '+e.message);}};
    const submit=()=>{setError('');try{f.update(d=>{const next=feedbackDomain.submit(d,selected.id,answer,attachment?.id||'');next.submissions[selected.id].fileName=attachment?.name||'';return next;});commitAttachment();setMessage('تم تثبيت التسليم محلياً على هذا المتصفح فقط. لم يُرسل إلى خادم أو معلم.');setConfirm(false);}catch(e){setError(e.message);}};
    if(!selected)return <><FeedbackNotice>تُحفظ المسودات والتسليمات في هذا المتصفح فقط. لا توجد مزامنة مع المعهد أو الأجهزة الأخرى.</FeedbackNotice><div className="fb-list">{list.map(a=>{const s=f.data.submissions[a.id];return <article key={a.id} className="fb-row"><div><h2>{a.title}</h2><p>{a.subject} {a.sheikh&&' • '+a.sheikh}</p><p>الموعد: {fbDate(a.dueAt)} — بتوقيت الرياض</p><span className="fb-chip">{fbStatusText[feedbackDomain.status(a,s,now)]}</span></div><FeedbackButton onClick={()=>f.open('homework',{id:a.id})}>{s?.submittedAt?'عرض التسليم':'فتح الواجب'}</FeedbackButton></article>;})}{!list.length&&<FeedbackNotice>لا توجد واجبات متاحة في هذا المتصفح.</FeedbackNotice>}</div></>;
    const submitted=!!existing?.submittedAt;const remain=feedbackDomain.validTime(selected.dueAt)?Date.parse(selected.dueAt)-now:null;
    return <div className="fb-stack"><FeedbackButton onClick={()=>f.open('homework')}>قائمة الواجبات</FeedbackButton><article className="fb-panel"><span className="fb-chip">{fbStatusText[feedbackDomain.status(selected,existing,now)]}</span><h2>{selected.title}</h2><p>{selected.sheikh}</p><p className="fb-prose">{selected.instructions||selected.details||'لم تُضف تعليمات لهذا الواجب.'}</p><p>الموعد النهائي: {fbDate(selected.dueAt)} — بتوقيت الرياض</p>{remain!==null&&<p role="timer">{remain>0?'المتبقي: '+Math.floor(remain/86400000)+' يوم و'+Math.floor(remain%86400000/3600000)+' ساعة و'+Math.floor(remain%3600000/60000)+' دقيقة':'انتهى الموعد؛ سيُحفظ التسليم كتسليم متأخر محلياً.'}</p>}{selected.fileId&&<FeedbackStoredFile fileId={selected.fileId} label={selected.fileName||'مرفق التعليمات'}/>}</article>{submitted?<article className="fb-panel"><h3>نسخة التسليم</h3><p className="fb-prose">{existing.answer||'إجابة بمرفق'}</p>{existing.fileId&&<FeedbackStoredFile fileId={existing.fileId} label={existing.fileName||'مرفق الإجابة'}/>}<p>وقت التسليم: {fbDate(existing.submittedAt)}</p><h3>الملاحظات والتقييم</h3><p>{existing.feedback||'لم تُضف ملاحظات من المعلم. هذا التسليم محفوظ محلياً فقط.'}</p>{existing.grade!==undefined&&<p>التقييم: {String(existing.grade)}</p>}</article>:<article className="fb-panel fb-stack"><label className="fb-field">الإجابة<textarea rows={10} maxLength={50000} value={answer} onChange={e=>{setAnswer(e.target.value);setMessage('');}}/></label><label className="fb-field">مرفق اختياري — حتى 10 ميجابايت<input type="file" accept=".pdf,.txt,.png,.jpg,.jpeg,.webp,.docx" disabled={busy} onChange={e=>attach(e.target.files?.[0])}/></label>{busy&&<progress aria-label="حفظ المرفق على الجهاز" max="100" value={progress}/>} {attachment&&<div className="fb-actions"><span>{attachment.name}</span><FeedbackButton onClick={()=>{if(attachment&&pendingFiles.current.has(attachment.id)){pendingFiles.current.delete(attachment.id);retireFile(attachment.id);}setAttachment(null);}}>إزالة المرفق من الإجابة</FeedbackButton></div>}<div className="fb-actions"><FeedbackButton disabled={busy} onClick={save}>حفظ المسودة</FeedbackButton><FeedbackButton primary disabled={busy||(!answer.trim()&&!attachment)} onClick={()=>setConfirm(true)}>تسليم الواجب</FeedbackButton></div>{confirm&&<div className="fb-notice" role="group" aria-label="تأكيد التسليم"><p>هل تريد تثبيت الإجابة كتسليم محلي؟ لن يمكنك تعديل النسخة المسلّمة، ولن تُرسل إلى المعلم.</p><div className="fb-actions"><FeedbackButton primary onClick={submit}>تأكيد التسليم المحلي</FeedbackButton><FeedbackButton onClick={()=>setConfirm(false)}>العودة للتعديل</FeedbackButton></div></div>}</article>}{message&&<FeedbackNotice>{message}</FeedbackNotice>}{error&&<FeedbackNotice error>{error}</FeedbackNotice>}</div>;
}
function FeedbackStoredFile({fileId,label}){const [url,setUrl]=useState('');const [error,setError]=useState('');useEffect(()=>{let dead=false,created='';fbGetFile(fileId).then(x=>{if(!x)throw Error('الملف غير موجود على هذا الجهاز.');if(!dead){created=URL.createObjectURL(x.blob);setUrl(created);}}).catch(e=>!dead&&setError(e.message));return()=>{dead=true;if(created)URL.revokeObjectURL(created);};},[fileId]);return error?<FeedbackNotice error>{error}</FeedbackNotice>:url?<a className="fb-button mq-surface-2" href={url} download={label} target="_blank" rel="noopener noreferrer">تنزيل {label}</a>:<p role="status">جارٍ قراءة المرفق المحلي...</p>;}
function Round3ReminderList(){const f=useFeedback();const reminders=Object.values(f.data.reminders||{}).filter(r=>r.enabled);return reminders.length?<section className="fb-panel fb-stack"><h2>التذكيرات المحفوظة</h2>{reminders.map(r=><div className="fb-row" key={r.id}><div><h3>{r.title}</h3><p>{r.at?fbDate(r.at):'لم يحدد موعد لإرسال التنبيه.'}</p></div><Round3Reminder lecture={{id:r.id,title:r.title,startAt:r.at}}/></div>)}</section>:null;}
function FeedbackNotifications(){const f=useFeedback();const [error,setError]=useState('');const mark=id=>{try{f.update(d=>({...d,notifications:d.notifications.map(n=>id==='all'||n.id===id?{...n,read:true}:n)}));setError('');return true;}catch(e){setError('تعذر حفظ حالة القراءة على الجهاز.');return false;}};return <div className="fb-stack"><Round3ReminderList/><div className="fb-actions"><FeedbackButton disabled={!f.data.notifications.some(n=>!n.read)} onClick={()=>mark('all')}>تحديد الكل كمقروء</FeedbackButton><p>{f.data.notifications.filter(n=>!n.read).length} غير مقروء</p></div>{error&&<FeedbackNotice error>{error}</FeedbackNotice>}<div className="fb-list">{f.data.notifications.map(n=><article key={n.id} className={'fb-row '+(!n.read?'fb-unread':'')}><div><span className="fb-chip">{n.read?'مقروء':'جديد'}</span><h2>{n.title}</h2><time>{fbDate(n.at)}</time></div><div className="fb-actions">{!n.read&&<FeedbackButton onClick={()=>mark(n.id)}>تحديد كمقروء</FeedbackButton>}<FeedbackButton onClick={()=>{if(mark(n.id)&&n.target?.view)f.open(n.target.view,n.target.payload||{});}}>فتح</FeedbackButton></div></article>)}</div>{!f.data.notifications.length&&<FeedbackNotice>لا توجد تنبيهات حتى الآن. تظهر هنا المواعيد والنتائج والمحتويات التي تُضاف فعلياً في هذا المتصفح.</FeedbackNotice>}</div>;}
const round3TimetableDomain=(()=>{
 const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 const slots=['بعد الفجر','بعد الظهر','بعد العصر','بعد المغرب','بعد العشاء'];
 const dayKey=value=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
 const add=(day,n)=>new Date(Date.parse(day+'T12:00:00Z')+n*86400000).toISOString().slice(0,10);
 const weekStart=day=>add(day,-new Date(day+'T12:00:00Z').getUTCDay());

function FeedbackQuiz(){

    const complete=()=>{setBusy(true);try{if(qs.some(q=>answers[q.id]===undefined))throw Error('أجب عن جميع الأسئلة أولاً.');f.update(d=>{if(d.quizResults[id])return d;let n={...d,quizResults:{...d.quizResults,[id]:{answers,questions:qs,title:quiz.title||'الاختبار',score:count,total:qs.length,at:new Date().toISOString()}}};n=feedbackDomain.award(n,'quiz',id,count);return feedbackDomain.notification(n,{id:'quiz-result:'+id,type:'quiz',title:'نتيجة '+(quiz.title||'الاختبار')+': '+count+' / '+qs.length,at:new Date().toISOString(),target:{view:'quiz',payload:{id}}});});setFinished(true);setError('');}catch(e){setError('تعذر تثبيت النتيجة محلياً. '+e.message);}finally{setBusy(false);}};

}

const FeedbackAudioPlayer = () => {
    const [player,setPlayer]=useState(()=>fbAudioTrackState(null));
    const [queue,setQueue]=useState([]), [url,setUrl]=useState('');
    const media=useRef(null), frame=useRef(null), current=useRef(player), currentQueue=useRef(queue), sourceRef=useRef(null), playRequested=useRef(false), endedId=useRef(null);
    current.current=player;currentQueue.current=queue;
    const {item,playing,position,duration,rate,error}=player;
    const source=fbMediaSource({...item,...(url?{blobUrl:url}:{})});sourceRef.current=source;
    const patch=value=>setPlayer(previous=>({...previous,...value}));
    const post=(func,args=[])=>frame.current?.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'https://www.youtube-nocookie.com');
    const select=(lecture,autoPlay=false)=>{
        const previous=current.current.item;const same=String(previous?.id)===String(lecture?.id)&&previous?.fileId===lecture?.fileId;
        media.current?.pause();playRequested.current=autoPlay;endedId.current=null;if(!same)setUrl('');
        const state=fbAudioTrackState(lecture);current.current=state;setPlayer(state);
        if(same){if(media.current){media.current.currentTime=0;media.current.playbackRate=1;if(autoPlay)media.current.play().catch(()=>patch({error:'تعذر بدء الصوت. استخدم زر التشغيل.'}));}else if(sourceRef.current.kind==='youtube'){post('seekTo',[0,true]);post('setPlaybackRate',[1]);if(autoPlay)post('playVideo');}}
    };
    const next=(autoPlay=true)=>{
        const selected=current.current.item;const target=fbNextQueue(currentQueue.current,selected?.id);
        if(target)select(target,autoPlay);else{playRequested.current=false;patch({playing:false});}
    };
    const toggle=force=>{
        fbChoosePlaybackOwner('mini');
        const value=typeof force==='boolean'?force:!current.current.playing;playRequested.current=value;
        if(sourceRef.current.kind==='youtube')post(value?'playVideo':'pauseVideo');
        else if(media.current){if(value)media.current.play().catch(()=>patch({error:'تعذر بدء الصوت. أعد المحاولة من زر التشغيل.'}));else media.current.pause();}
    };
    const controls=useRef({select,next,toggle});controls.current={select,next,toggle};
    useEffect(()=>{const owner=e=>{if(e.detail==='lecture'){media.current?.pause();frame.current?.contentWindow?.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'https://www.youtube-nocookie.com');playRequested.current=false;}};window.addEventListener('fb:playback-owner',owner);return()=>window.removeEventListener('fb:playback-owner',owner);},[]);
    useEffect(()=>{const start=e=>{fbChoosePlaybackOwner('mini');setQueue(e.detail.queue||[]);controls.current.select(e.detail.lecture,e.detail.autoPlay===true);};window.addEventListener('fb:play',start);return()=>window.removeEventListener('fb:play',start);},[]);
    useEffect(()=>{
        let alive=true,objectUrl='';setUrl('');
        if(item?.fileId)fbGetFile(item.fileId).then(file=>{
            if(!alive)return;if(file){objectUrl=URL.createObjectURL(file.blob||file);setUrl(objectUrl);}else patch({error:'ملف التسجيل لم يعد موجوداً في هذا المتصفح.'});
        }).catch(()=>alive&&patch({error:'تعذر قراءة ملف التسجيل المحلي.'}));
        return()=>{alive=false;if(objectUrl)URL.revokeObjectURL(objectUrl);};
    },[item?.id,item?.fileId]);
    useEffect(()=>{const command=e=>{if(document.querySelector('[data-feedback-lecture]')&&!fbOwnsPlayback('mini'))return;const action=typeof e.detail==='string'?e.detail:e.detail?.action||e.detail?.media;if(action==='pause')controls.current.toggle(false);if(action==='play')controls.current.toggle(true);};window.addEventListener('fb:media',command);window.addEventListener('fb:command',command);return()=>{window.removeEventListener('fb:media',command);window.removeEventListener('fb:command',command);};},[]);
    useEffect(()=>{
        if(source.kind!=='youtube')return;
        const finish=()=>{const id=String(current.current.item?.id);if(endedId.current===id)return;endedId.current=id;controls.current.next(true);};
        const receive=e=>{
            if(e.origin!=='https://www.youtube-nocookie.com'||e.source!==frame.current?.contentWindow)return;
            let data;try{data=typeof e.data==='string'?JSON.parse(e.data):e.data;}catch{return;}
            if(data.event==='onReady'){post('setPlaybackRate',[current.current.rate]);if(playRequested.current)post('playVideo');}
            if(data.event==='onError')patch({playing:false,error:'تعذر تشغيل تسجيل YouTube. جرّب تشغيله من الفيديو مباشرة أو تحقق من الاتصال.'});
            if(data.event==='infoDelivery'||data.event==='initialDelivery'){
                const info=data.info||{};const change={};
                if(Number.isFinite(info.currentTime))change.position=info.currentTime;
                if(Number.isFinite(info.duration))change.duration=info.duration;
                if(Number.isFinite(info.playbackRate))change.rate=info.playbackRate;
                if(info.playerState===1)change.playing=true;if(info.playerState===2)change.playing=false;
                if(Object.keys(change).length)patch(change);if(info.playerState===0)finish();
            }
            if(data.event==='onStateChange'){if(data.info===1){fbChoosePlaybackOwner('mini');patch({playing:true});}if(data.info===2)patch({playing:false});if(data.info===0)finish();}

    return <section data-ui-owner="MiniFloatingAudioPlayer" className="fb-audio-player mq-surface border mq-border rounded-lg p-4 notranslate" translate="no" aria-label="مشغل الاستماع">
        <header className="flex items-center justify-between gap-3"><div className="min-w-0"><h3 className="text-base">{recording.title}</h3><p className="mq-muted text-xs">{recording.sheikh}</p></div><button aria-label="إغلاق مشغل الاستماع" onClick={()=>{media.current?.pause();post('pauseVideo');playRequested.current=false;setPlayer(fbAudioTrackState(null));setQueue([]);setUrl('');fbReleasePlaybackOwner('mini');}}><Icons.Close/></button></header>

        source.kind==='audio'||source.kind==='video'?React.createElement(source.kind,{key:String(item.id)+source.url,ref:media,src:source.url,controls:true,preload:'metadata',onPlay:()=>{fbChoosePlaybackOwner('mini');patch({playing:true,error:''});},onPause:()=>patch({playing:false}),onTimeUpdate:e=>patch({position:e.currentTarget.currentTime}),onLoadedMetadata:e=>{e.currentTarget.playbackRate=current.current.rate;patch({duration:Number.isFinite(e.currentTarget.duration)?e.currentTarget.duration:0});if(playRequested.current)e.currentTarget.play().catch(()=>patch({error:'تعذر بدء الصوت. استخدم زر التشغيل.'}));},onEnded:()=>controls.current.next(true),onError:()=>patch({playing:false,error:'تعذر تحميل التسجيل. تحقق من الملف أو الاتصال وأعد المحاولة.'})}):
        source.kind==='document'?<div className="py-3 space-y-2"><p role="status" className="mq-muted text-xs">هذا مرفق PDF؛ لا يحتوي على تسجيل للاستماع.</p>{item.fileId?<FeedbackStoredFile fileId={item.fileId} label={item.fileName||item.title}/>:source.url?<a href={source.url} target="_blank" rel="noopener noreferrer" className="fb-button">فتح مستند PDF</a>:null}</div>:<p role="status" className="mq-muted text-xs py-3">{item.fileId&&!url&&!error?'جارٍ قراءة التسجيل المحلي…':'لم يُرفق ملف صوتي أو مرئي لهذه المحاضرة بعد.'}</p>}
        {canPlay&&<><label className="text-xs block py-2">موضع الاستماع <input aria-label="موضع الاستماع" type="range" min="0" max={duration||0} step="1" value={Math.min(position,duration||0)} disabled={!duration} onChange={e=>{const n=Number(e.target.value);patch({position:n});if(source.kind==='youtube')post('seekTo',[n,true]);else if(media.current)media.current.currentTime=n;}}/></label><div className="flex gap-3 flex-wrap items-center"><button className="fb-button" onClick={()=>toggle()}>{playing?'إيقاف مؤقت':'تشغيل'}</button><label className="text-xs">السرعة <select value={rate} onChange={e=>{const n=Number(e.target.value);patch({rate:n});if(source.kind==='youtube')post('setPlaybackRate',[n]);else if(media.current)media.current.playbackRate=n;}}>{[0.75,1,1.25,1.5,2].map(x=><option key={x} value={x}>{x}×</option>)}</select></label><span className="text-xs" dir="ltr">{Math.floor(position/60)}:{String(Math.floor(position%60)).padStart(2,'0')} / {Math.floor(duration/60)}:{String(Math.floor(duration%60)).padStart(2,'0')}</span></div></>}
        <button className="fb-button mt-2" disabled={!fbNextQueue(queue,item.id)} onClick={()=>next(true)}>التالي</button>

        // =======================================================
        // 7. منصة الزوار التفاعلية الشاملة (Visitor Dashboard)
        // =======================================================
        // =======================================================
        // 7. منصة الزوار التفاعلية الشاملة (Visitor Dashboard)
        // معززة بنموذج معاجم الذكي (Dify AI Agent) وبوب أب عائم في الزاوية
        // =======================================================
        // MAQAM_SAFE_MARKDOWN_START
        // Untrusted answers become allowlisted React elements. HTML is always text.
        const markdownText = value => String(value == null ? '' : value).replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, (whole, entity) => {
            const named = {amp:'&', lt:'<', gt:'>', quot:'"', apos:"'"};
            if (entity[0] !== '#') return named[entity.toLowerCase()] || whole;
            const number = entity[1].toLowerCase() === 'x' ? parseInt(entity.slice(2), 16) : parseInt(entity.slice(1), 10);
            return number > 0 && number <= 0x10ffff && !(number >= 0xd800 && number <= 0xdfff) ? String.fromCodePoint(number) : '\uFFFD';
        });
        const safeMarkdownUrl = href => {
            if (typeof href !== 'string') return null;
            const value = markdownText(href).trim();
            if (!value || /[\u0000-\u0020\u007f-\u009f\\]/.test(value)) return null;
            if (/^https?:\/\//i.test(value)) {
                try {
                    const url = new URL(value);
                    return ['https:', 'http:'].includes(url.protocol) && url.hostname && !url.username && !url.password ? value : null;
                } catch (error) { return null; }
            }
            if (/^(?:\/(?!\/)|\.{1,2}\/|#|\?)/.test(value)) return value;
            return /^[A-Za-z0-9._~-]+(?:\/[A-Za-z0-9._~%/-]*)?(?:[?#][^\s\\]*)?$/.test(value) ? value : null;
        };
        const renderMarkdownTokens = (tokens, depth = 0) => {
            if (!Array.isArray(tokens) || depth > 24) return null;
            return tokens.map((token, key) => {
                if (!token || typeof token !== 'object') return '';
                const children = () => renderMarkdownTokens(token.tokens, depth + 1);
                const element = (type, content, extra = {}) => React.createElement(type, {key, ...extra}, content);
                switch (token.type) {
                    case 'space': case 'def': return null;
                    case 'heading': return element('h' + Math.max(1, Math.min(6, Number(token.depth) || 1)), children());
                    case 'paragraph': return element('p', children());
                    case 'text': return Array.isArray(token.tokens) ? children() : markdownText(token.text);
                    case 'escape': return markdownText(token.text);
                    case 'strong': return element('strong', children());
                    case 'em': return element('em', children());
                    case 'del': return element('del', children());
                    case 'codespan': return element('code', String(token.text || ''));
                    case 'code': return element('pre', React.createElement('code', null, String(token.text || '')));
                    case 'blockquote': return element('blockquote', children());
                    case 'br': return element('br');
                    case 'hr': return element('hr');
                    case 'link': {
                        const href = safeMarkdownUrl(token.href);
                        return href ? element('a', children(), {href, target:'_blank', rel:'noopener noreferrer'}) : element('span', children());
                    }
                    case 'image': return markdownText(token.text || '');
                    case 'html': return String(token.text || token.raw || '');
                    case 'list': {
                        const items = Array.isArray(token.items) ? token.items : [];
                        const list = items.map((item, index) => React.createElement('li', {key:index}, renderMarkdownTokens(item.tokens, depth + 1)));
                        const start = Number.isInteger(token.start) && token.start > 0 && token.start <= 100000 ? token.start : 1;
                        return element(token.ordered ? 'ol' : 'ul', list, token.ordered ? {start} : {});
                    }
                    case 'table': {
                        const cells = (row, tag) => (Array.isArray(row) ? row : []).map((cell, index) => React.createElement(tag, {key:index}, renderMarkdownTokens(cell.tokens, depth + 1)));
                        const rows = (Array.isArray(token.rows) ? token.rows : []).map((row, index) => React.createElement('tr', {key:index}, cells(row, 'td')));
                        return element('table', [React.createElement('thead', {key:'head'}, React.createElement('tr', null, cells(token.header, 'th'))), React.createElement('tbody', {key:'body'}, rows)]);
                    }
                    default: return String(token.text || token.raw || '');
                }
            });
        };
        const renderSafeMarkdown = rawText => {
            const text = String(rawText == null ? '' : rawText);
            if (!window.marked || typeof window.marked.lexer !== 'function') return text;
            try { return renderMarkdownTokens(window.marked.lexer(text)); }
            catch (error) { return text; }
        };
        // MAQAM_SAFE_MARKDOWN_END

        // MAQAM_ANONYMOUS_ID_START
        let maqamAnonymousId = '';
        const maqamConversationIds = new Map();
        const isMaqamUuid = value => typeof value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(value);
        const createAnonymousUuid = () => {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
            if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
                const bytes = crypto.getRandomValues(new Uint8Array(16));
                bytes[6] = (bytes[6] & 15) | 64;
                bytes[8] = (bytes[8] & 63) | 128;
                const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
                return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
            }
            throw new Error('Secure anonymous identity is unavailable.');
        };
        const getAnonymousUserId = role => {
            if (role !== 'visitor' && role !== 'student') throw new Error('Unknown anonymous identity namespace.');

                try { localStorage.setItem('maqam_uid', maqamAnonymousId); } catch (error) {}
                // Legacy shared-guest context cannot be assigned to this browser identity.
                try { localStorage.removeItem('maqam_dify_conv_id'); } catch (error) {}
            }
            return `${role}_${maqamAnonymousId}`;
        };
        const readConversationId = role => {

            try {
                key = 'maqam_dify_conv_id:' + getAnonymousUserId(role);

                const stored = localStorage.getItem(key);
                if (isMaqamUuid(stored)) {
                    maqamConversationIds.set(key, stored);
                    return stored;
                }
            } catch (error) {}
            return maqamConversationIds.get(key) || '';
        };
        const setStoredConversationId = (role, value) => {
            try {
                const key = 'maqam_dify_conv_id:' + getAnonymousUserId(role);
                const id = isMaqamUuid(value) ? value : '';
                maqamConversationIds.set(key, id);
                try {
                    if (id) localStorage.setItem(key, id);
                    else localStorage.removeItem(key);
                } catch (error) {}
            } catch (error) {}
        };
        // MAQAM_ANONYMOUS_ID_END

        const VisitorDashboard = ({ onNavigate, onOpenLanguage, onOpenAccessibility, currentLanguage, onMinimizeAudio }) => {
const [visitorScholar,setVisitorScholar]=useState(null);

            const [showQuizModal, setShowQuizModal] = useState(false);
            const [isAiDrawerOpen, setIsAiDrawerOpen] = useState(false);
            const [isLiveAudioPlaying, setIsLiveAudioPlaying] = useState(false);

            const [scheduleAlerts, setScheduleAlerts] = useState({});
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            // ===================================================

            // ===================================================

            const [isFloatingMinimized, setIsFloatingMinimized] = useState(false);
            const [currentConversationId, setCurrentConversationId] = useState(() => readConversationId('visitor'));
            const [isBotThinking, setIsBotThinking] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [feedbackToast, setFeedbackToast] = useState('');
            const [showHistoryDrawer, setShowHistoryDrawer] = useState(false);
            const [copiedMsgId, setCopiedMsgId] = useState(null);

            // سجل الدردشات السابقة (Previous Conversations)
            const [savedConversations, setSavedConversations] = useState(() => {

                    return saved ? JSON.parse(saved) : [
                        { id: 'conv-101', title: 'شرح أركان الحج والعمرة والواجبات', date: 'اليوم، 10:15 ص', lastQuery: 'ما هي أركان الحج الأربعة؟' },
                        { id: 'conv-102', title: 'فقه الطواف وأحكام الشك في الأشواط', date: 'أمس، 04:30 م', lastQuery: 'شككت هل طفت 6 أو 7 أشواط؟' },
                        { id: 'conv-103', title: 'مواقيت الإحرام لمن قدم جواً أو براً', date: 'منذ يومين', lastQuery: 'أين يحرم القادم من المدينة المنورة؟' }

            ]);

            const lectures = feedback.visible('lectures');

            const wamadatList = [
                { id: 101, title: "فتوى: حكم صلاة الجنازة بالحرم لمن لم يكمل ركعات الفريضة", sheikh: "الشيخ أ.د. ياسر الدوسري", duration: "1:05", fatwaTopic: "فقه الصلاة" },
                { id: 102, title: "فتوى: هل يجوز تكرار العمرة في سفرة واحدة؟", sheikh: "الشيخ أ.د. سامي الصقير", duration: "1:40", fatwaTopic: "أحكام العمرة" },
                { id: 103, title: "فتوى: من شك في عدد أشواط الطواف في الحرم", sheikh: "الشيخ د. الوليد الشمسان", duration: "0:55", fatwaTopic: "الطواف" },
                { id: 104, title: "فتوى: حكم حمل الأطفال في الطواف والسعي", sheikh: "الشيخ د. حسن بخاري", duration: "1:10", fatwaTopic: "المناسك" },
                { id: 105, title: "فتوى: فضل الصلاة في الروضة الشريفة وآداب الزيارة", sheikh: "الشيخ بدر التركي", duration: "0:50", fatwaTopic: "الزيارة" },
                { id: 106, title: "فتوى: هل تشترط الطهارة للسعي بين الصفا والمروة؟", sheikh: "الشيخ أ.د. حمزة الفعر", duration: "1:15", fatwaTopic: "المناسك" },
                { id: 107, title: "فتوى: حكم التوكيل في رمي الجمار لأصحاب الأعذار", sheikh: "الشيخ أ.د. ياسر الدوسري", duration: "1:20", fatwaTopic: "أحكام الحج" },
                { id: 108, title: "فتوى: شروط وجوب صلاة الجمعة على المعتمر والزائر", sheikh: "الشيخ د. الوليد الشمسان", duration: "0:48", fatwaTopic: "فقه الجمعة" }
            ];

            const handleNewChat = () => {

                        date: 'الآن',

                    setSavedConversations(prev => {
                        const updated = [newHistItem, ...prev.slice(0, 9)];
                        try { localStorage.setItem('maqam_dify_history', JSON.stringify(updated)); } catch(e) {}
                        return updated;

                setCurrentConversationId('');
                setStoredConversationId('visitor', '');

                        sources: ['الإدارة العلمية والتوجيهية بالحرم', 'أرشيف فتاوى الحرمين'],
                        reported: false,
                        isDify: true
                    }
                ]);
                setChatInput('');
                setShowHistoryDrawer(false);
            };

            // إرسال رسالة إلى الوسيط الآمن لعميل Dify AI (/api/chat)
            const handleSendChatMessage = async (textToSend) => {
                const query = (textToSend || chatInput).trim();
                if (!query || isBotThinking) return;

                const userMsgId = 'u-' + Date.now();
                const userMsg = { id: userMsgId, sender: 'user', text: query };
                
                setChatMessages(prev => [...prev, userMsg]);
                if (!textToSend) setChatInput('');
                setIsBotThinking(true);

                // حفظ أو تحديث سجل الدردشة
                setSavedConversations(prev => {
                    const titleText = query.length > 35 ? query.substring(0, 35) + '...' : query;
                    const exists = prev.find(c => c.id === currentConversationId);
                    let updated;
                    if (exists) {
                        updated = prev.map(c => c.id === currentConversationId ? { ...c, lastQuery: query, date: 'الآن' } : c);
                    } else {
                        updated = [{ id: currentConversationId || ('c-' + Date.now()), title: titleText, date: 'الآن', lastQuery: query }, ...prev.slice(0, 8)];
                    }
                    try { localStorage.setItem('maqam_dify_history', JSON.stringify(updated)); } catch(e) {}
                    return updated;
                });

                    // تحديد المسار الآمن (محلي أو عبر المنفذ 5000)
                    let endpoint = '/api/chat';
                    if (window.location.protocol === 'file:') {
                        endpoint = 'http://localhost:5000/api/chat';
                    }

                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: query,
                            conversation_id: currentConversationId || '',
                            user: getAnonymousUserId('visitor')
                        })
                    });

                            setCurrentConversationId(data.conversation_id);
                            setStoredConversationId('visitor', data.conversation_id);
                        }

                            ...prev,
                            {
                                id: data.message_id || ('b-' + Date.now()),
                                sender: 'bot',
                                text: data.answer,
                                sources: ['عميل Dify AI المباشر', 'مكتبة ومناهج معهد المسجد الحرام'],
                                reported: false,
                                isDify: true
                            }
                        ]);
                    } else {
                        // إذا رجع خطأ من Dify (مثل خطأ اسم النموذج gemini-3.1-flash-lite-preview) أو تعذر الخادم
                        console.warn("Dify API returned notice:", data);
                        let fallbackReply = "";
                        let sources = ["الإدارة العلمية والتوجيهية بالحرم", "فتاوى كبار العلماء"];

                        // توليد استدلال فقهي شرعي ذكي احتياطي
                        if (query.includes('لخص') || query.includes('تلخيص')) {

                            sources = ["شرح منهج السالكين - باب الحج", "فتاوى اللجنة الدائمة"];
                        } else if (query.includes('اختبار') || query.includes('اسوي اختبار') || query.includes('امتحان')) {
                            fallbackReply = `### 🎯 اختبار فقهي تفاعلي سريع في أحكام الطواف:\n\n**السؤال:** رجل طاف حول الكعبة المشرفة، وفي أثناء الشوط الخامس شك هل طاف أربعة أشواط أم خمسة، فما الواجب عليه شرعاً؟\n\n- **الجواب الصحيح:** يبني على اليقين وهو الأقل (أربعة أشواط) ثم يكمل سبعة أشواط ويسجد للسهو، ما لم يكن ذلك مجرد وسواس عارض بعد الفراغ من العبادة فلا يلتفت إليه.`;
                            sources = ["أحكام الطواف - معهد المسجد الحرام", "المغني لابن قدامة"];
                        } else if (query.includes('محاضر') || query.includes('دروس') || query.includes('جدول') || query.includes('أحدث')) {
                            fallbackReply = `### 🕌 أحدث المحاضرات والدروس المباشرة بالمسجد الحرام اليوم:\n\n1. **شرح سنن أبي داود** - الشيخ د. حسن بخاري (الرواق العثماني - بعد المغرب).\n2. **منهج السالكين وتوضيح الفقه** - الشيخ أ.د. سامي الصقير (باب أجياد - بعد العشاء).\n3. **تفسير سورة الحج** - الشيخ بدر التركي (توسعة الملك فهد - بعد العصر).\n\nجميع الدروس منقولة ببث مباشر عبر هذه المنصة مع ترجمة فورية معتمدة.`;
                            sources = ["جدول الإدارة العامة للتوجيه والإرشاد 1447هـ"];
                        } else if (query.includes('طواف') || query.includes('أشواط') || query.includes('سعي')) {
                            fallbackReply = `### 🕋 أحكام الطواف والسعي بالمسجد الحرام:\n\n- **الشروط:** الطهارة من الحدثين، وستر العورة، وموالاة الأشواط السبعة، وجعل الكعبة عن يساره.\n- **السنن:** الاضطباع في طواف القدوم، والرمل في الأشواط الثلاثة الأولى، واستلام الركن اليماني وتقبيل الحجر الأسود عند الاستطاعة دون مزاحمة.`;

                        }

                        setChatMessages(prev => [
                            ...prev,
                            {
                                id: 'b-fallback-' + Date.now(),
                                sender: 'bot',
                                text: fallbackReply + noticeText,
                                sources: sources,
                                reported: false,
                                isDify: false
                            }
                        ]);

                } catch (fetchErr) {

        onChange={() => setQuizAnswers({...quizAnswers, q2: i})}
        />
        <span>{opt}</span>

        ))}

        <p className="text-xs mq-muted">تم تسجيل نقاط إنجازك في ملف الزائر المتعلم بنجاح.</p>
        </div>
        )}
        </div>

        <span key={idx} className="mq-surface-2 px-2 py-0.5 rounded-full">{s}</span>
        ))}
        </div>
        )}
        </div>
        </div>
        )}
        </div>
        ))}

        {isBotThinking && (
        <div className="flex items-center gap-2 p-3 mq-surface-2 rounded-xl border mq-border text-xs mq-ink">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        <span>جاري الاستدعاء من Dify Agent...</span>
        </div>
        )}

        {["هل تلخص لي درس اليوم؟", "سوي لي اختبار فقهي", "أحدث الدروس"].map((chip, idx) => (
        <button
        key={idx}
        onClick={() => handleSendChatMessage(chip)}
        className="px-2.5 py-1 rounded-full mq-surface-2 mq-hover mq-muted border mq-border whitespace-nowrap transition-all"
        >
        {chip}
        </button>
        ))}
        </div>

        </button>
        </div>
        </div>
        </>
        )}
        </div>

        <span className="relative inline-flex rounded-full h-3 w-3 mq-surface"></span>
        </span>
        <div className="flex items-center gap-2">
        <Icons.Sparkles />
        <span className="text-xs sm:text-sm font-['Amiri'] tracking-wide">نموذج معاجم الذكي (Dify AI)</span>
        </div>
        {isFloatingChatOpen ? (
        <span className="w-5 h-5 rounded-full mq-surface-2 flex items-center justify-center text-[11px]">✕</span>
        ) : (
        <span className="px-2 py-0.5 rounded-full mq-surface-2 text-[10px] mq-ink border mq-border">تحدث الآن</span>
        )}
        </button>
        </div>
        </MaqamShell></div>
