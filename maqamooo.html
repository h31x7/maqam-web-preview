                queries.forEach(q => q.addEventListener('change', update));

        const ViewportAnchorManager = () => {

                    }

                    raf = 0;
                    for (const [element, saved] of records) {
                        restore(element, saved);
                        if (!element.isConnected) records.delete(element);

                    if (getComputedStyle(app).filter === 'none') {records.clear(); return;}
                    const bounds = app.getBoundingClientRect();
                    const placements = [];
                    for (const element of app.querySelectorAll('.fixed,.mq-rail,.mq-rail-controls,.mq-navigation,[data-maqam-dialog],.mq-drawer-scrim')) {
                        const style = getComputedStyle(element);

                        const top = style.top === 'auto' ? null : parseFloat(style.top);
                        const bottom = style.bottom === 'auto' ? null : parseFloat(style.bottom);
                        if (!records.has(element)) {
                            const saved = {};
                            for (const key of ['top', 'bottom', 'height']) saved[key] = {value:element.style.getPropertyValue(key), priority:element.style.getPropertyPriority(key)};

        // دالة تسوية النص العربي لتصفية البحث الذكي
        const normalizeArabicSearch = (txt) => {
            if (!txt) return '';
            return txt
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/[\u064B-\u065F]/g, '')
                .toLowerCase()
                .trim();
        };

                        recognition.onresult = (event) => {

                            setVoiceOutput(`تم التقاط الأمر: "${spoken}"`);
                            if (spoken.includes('زائر') || spoken.includes('الزائر')) {

                            } else if (spoken.includes('معلم') || spoken.includes('المعلم') || spoken.includes('مدرس')) {

                        };

                        recognition.onerror = (e) => {

                        recognition.onend = () => {

                        };

        {/* المحتوى التفاعلي للتخصيص */}
        <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">
        
        {/* 1. عمى الألوان وعكس الألوان التام */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border space-y-4">
        <div className="flex items-center justify-between">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">تخصيص عمى الألوان وعكس التباين</h4>
        <p className="text-xs mq-muted">تطبيق مرشحات بصرية طبية فورية على الشاشة بالكامل</p>
        </div>
        </div>
        <span className="text-[10px] mq-surface-2 px-2 py-0.5 rounded-full mq-ink font-mono">
        {accessSettings.colorBlindness}
        </span>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-1">
        {[
        { id: 'normal', label: 'الألوان الطبيعية', icon: '🎨' },
        { id: 'invert', label: 'عكس الألوان التام (أسود/أبيض)', icon: '🔄' },
        { id: 'protanopia', label: 'عمى الأحمر (Protanopia)', icon: '🔴' },
        { id: 'deuteranopia', label: 'عمى الأخضر (Deuteranopia)', icon: '🟢' },
        { id: 'tritanopia', label: 'عمى الأزرق (Tritanopia)', icon: '🔵' },
        { id: 'grayscale', label: 'أحادي اللون (Achromatopsia)', icon: '⚪' }
        ].map((opt) => (
        <button
        key={opt.id}
        onClick={() => {
        setAccessSettings({ ...accessSettings, colorBlindness: opt.id });
        showToast(`تم تطبيق فلتر: ${opt.label}`);
        }}
        className={` p-3 rounded-xl border text-xs font-bold transition-all text-right flex items-center justify-between ${
        accessSettings.colorBlindness === opt.id
        ? 'mq-border mq-ink'
        : 'mq-surface-2 mq-hover mq-border mq-muted'
        }  `}
        >
        <span className="truncate">{MaqamDisplayText(opt.label)}</span>
        <span>{MaqamDisplayText(opt.icon)}</span>
        </button>
        ))}
        </div>
        </div>

        {/* 2. تشتت الحركة والانتباه (ADHD / تثبيت أنيميشنات الصفحة) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">تثبيت حركة وأنيميشنات الصفحة (ADHD)</h4>
        <p className="text-xs mq-muted">إيقاف كافة الحركات والتوهجات والنبضات لمنع التشتت والانزعاج البصري</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.reduceMotion;
        setAccessSettings({ ...accessSettings, reduceMotion: newVal });
        showToast(newVal ? 'تم تثبيت كافة الحركات والأنيميشنات' : 'تم استئناف تأثيرات الحركة');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.reduceMotion
        ? 'mq-surface-2 mq-success mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.reduceMotion ? '✓ مفعل (الحركات متوقفة)' : 'تعطيل'}
        </button>
        </div>

        {/* 3. دوار المركبة / دوار الحركة (نقاط الأفق البصري المتحركة) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">مساعد دوار المركبة والحركة (Motion Sickness)</h4>
        <p className="text-xs mq-muted">إظهار نقاط بصرية ديناميكية بأطراف الشاشة لتثبيت توازن الأذن الداخلية أثناء التنقل</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.motionSicknessDots;
        setAccessSettings({ ...accessSettings, motionSicknessDots: newVal });
        showToast(newVal ? 'تم إظهار نقاط تثبيت الأفق البصري' : 'تم إخفاء نقاط الدوار');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.motionSicknessDots
        ? 'mq-surface-2 mq-ink mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.motionSicknessDots ? '✓ مفعل (النقاط ظاهرة)' : 'تعطيل'}
        </button>
        </div>

        {/* 4. عسر القراءة (Dyslexia-friendly) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">نمط تيسير القراءة (عسر القراءة / Dyslexia)</h4>
        <p className="text-xs mq-muted">تباعد إضافي ومريح بين الأسطر والكلمات مع خط واضح وسهل التمييز</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.dyslexiaFont;
        setAccessSettings({ ...accessSettings, dyslexiaFont: newVal });
        showToast(newVal ? 'تم تفعيل نمط القراءة الميسرة' : 'تم تعطيل نمط عسر القراءة');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.dyslexiaFont
        ? 'mq-surface-2 mq-accent mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.dyslexiaFont ? '✓ مفعل' : 'تعطيل'}
        </button>
        </div>

        {/* 5. مترجم لغة الإشارة (Sign Language) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border flex items-center justify-between gap-4">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">مترجم لغة الإشارة الذكي (Sign Language PIP)</h4>
        <p className="text-xs mq-muted">نافذة عائمة في الزاوية تعرض إيماءات لغة الإشارة الفورية للدروس</p>
        </div>
        </div>

        <button
        onClick={() => {
        const newVal = !accessSettings.signLanguageActive;
        setAccessSettings({ ...accessSettings, signLanguageActive: newVal });
        showToast(newVal ? 'تم إظهار نافذة لغة الإشارة في الزاوية' : 'تم إخفاء لغة الإشارة');
        }}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all border shrink-0 ${
        accessSettings.signLanguageActive
        ? 'mq-surface-2 mq-accent mq-border'
        : 'mq-surface-2 mq-muted mq-border'
        }  `}
        >
        {accessSettings.signLanguageActive ? '✓ ظاهرة الآن' : 'إظهار نافذة الإشارة'}
        </button>
        </div>

        {/* 6. الأوامر الصوتية (Voice Commands) */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border space-y-3">
        <div className="flex items-center justify-between">
        <div className="flex items-center gap-2.5">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <div>
        <h4 className="font-bold text-sm mq-ink">التحكم بالأوامر الصوتية (Voice Navigation)</h4>
        <p className="text-xs mq-muted">للتنقل بالصوت دون الحاجة للفأرة أو لوحة المفاتيح</p>
        </div>
        </div>

        <button
        onClick={handleToggleVoiceCommands}
        className={` px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border ${
        isListeningVoice
        ? 'mq-surface-2 mq-danger mq-border'
        : 'mq-surface-2 mq-ink mq-border mq-hover'
        }  `}
        >
        <Icons.Mic />
        <span>{isListeningVoice ? 'جاري الاستماع...' : 'تحدث بأمر صوتي'}</span>
        </button>
        </div>

        {voiceOutput && (
        <div className="p-3 rounded-xl mq-surface-2 border mq-border text-xs mq-ink">
        {voiceOutput}
        </div>
        )}

        <div className="flex flex-wrap items-center gap-2 pt-1 text-[11px]">
        <span className="mq-muted">أوامر سريعة:</span>
        {[
        { cmd: 'افتح الزائر', act: () => { onNavigate('visitor_login'); onClose(); } },
        { cmd: 'بوابة المعلم', act: () => { onNavigate('teacher_login'); onClose(); } },
        { cmd: 'رواق الطالب', act: () => { onNavigate('student_login'); onClose(); } },
        { cmd: 'الصفحة الرئيسية', act: () => { onNavigate('main'); onClose(); } }
        ].map((c, i) => (
        <button
        key={i}
        onClick={c.act}
        className="px-2.5 py-1 rounded-lg mq-surface-2 mq-hover mq-muted border mq-border"
        >
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> "{c.cmd}"
        </button>
        ))}
        </div>
        </div>

        </div>

        {/* ذيل النافذة مع خيار استعادة الافتراضي */}
        <div className="p-4 border-t mq-border mq-surface-2 flex items-center justify-between text-xs">
        <button
        onClick={() => {
        setAccessSettings({
        dyslexiaFont: false,
        reduceMotion: false,
        motionSicknessDots: false,
        colorBlindness: 'normal',
        signLanguageActive: false
        });
        showToast('تمت استعادة الإعدادات القياسية');
        }}
        className="mq-muted transition-colors"
        >
        ↺ إعادة ضبط الكل للافتراضي
        </button>

        <button data-ui-close="true" aria-label="إغلاق"
        onClick={onClose}
        className="px-6 py-2 rounded-xl mq-ink font-bold transition-all"
        >
        اعتماد الإعدادات
        </button>
        </div>
        </div>
        </MaqamDialogFrame>
            );
        };


        
        // =======================================================
        // 1. نافذة إعداد ونشر المقطع المطابقة للصورة المرفوعة بالملي (ClipShareModal)
        // =======================================================
        const ClipShareModal = ({ isOpen, onClose, lectureTitle = "منهج السالكين وتوضيح الفقه في الدين", sheikhName = "الشيخ أ.د. سامي الصقير", videoThumb }) => {
            const [selectedPlatform, setSelectedPlatform] = useState('TikTok');
            const [selectedLang, setSelectedLang] = useState('اردو (Translation)');
            const [showSubtitles, setShowSubtitles] = useState(true);
            const [clipDuration, setClipDuration] = useState(24);
            const [startPos, setStartPos] = useState(20);
            const [isSharing, setIsSharing] = useState(false);
            const [shareSuccess, setShareSuccess] = useState(false);

            if (!isOpen) return null;

            const handlePublish = () => {
                setIsSharing(true);
                setTimeout(() => {
                    setIsSharing(false);
                    setShareSuccess(true);
                    setTimeout(() => {
                        setShareSuccess(false);
                        onClose();
                    }, 2200);
                }, 1200);
            };

            return (
                <MaqamDialogFrame data-ui-owner="ClipShareModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-3 sm:p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-surface border mq-border rounded-[28px] max-w-[390px] w-full p-5 space-y-4 relative mq-ink select-none"
        onClick={(e) => e.stopPropagation()}
        >
        {/* ترويسة النافذة مع زر الإغلاق الدائري الأحمر في الزاوية */}
        <div className="relative flex items-center justify-center pb-1">
        <button data-ui-close="true" aria-label="إغلاق" 
        onClick={onClose}
        className="absolute right-0 top-0 w-8 h-8 rounded-full mq-surface mq-hover mq-ink flex items-center justify-center font-bold text-sm transition-transform"
        >
        ✕
        </button>
        <h3 className="font-extrabold text-base sm:text-lg mq-ink mq-owner tracking-wide">
        إعداد ونشر المقطع
        </h3>
        </div>

        {/* شاشة المعاينة الطولية للمقطع (Vertical Reels 9:16) */}
        <div className="flex justify-center my-1">
        <div className="relative w-44 h-64 rounded-lg border-2 mq-border overflow-hidden flex flex-col items-center justify-center group">
        {videoThumb ? (
        <img src={videoThumb} alt="المعاينة" className="w-full h-full object-cover opacity-60" />
        ) : (
        <div className="absolute inset-0 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:12px_12px] opacity-30"></div>
        )}
        
        {/* خطوط التدرج المائلة المستوحاة من الصورة */}
        <div className="absolute inset-0 bg-[linear-gradient(135deg,transparent_25%,rgba(59,130,246,0.15)_25%,rgba(59,130,246,0.15)_50%,transparent_50%,transparent_75%,rgba(59,130,246,0.15)_75%)] bg-[length:24px_24px] pointer-events-none"></div>

        {/* علامة المعاينة المركزية */}
        <div className="relative z-10 px-4 py-1.5 rounded-xl mq-surface-2 border mq-border flex items-center gap-1.5 text-xs font-bold mq-ink">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        <span>المعاينة</span>
        </div>

        {/* النص المترجم التفاعلي فوق المقطع */}
        {showSubtitles && (
        <div className="absolute bottom-4 inset-x-3 mq-surface-2 border mq-border rounded-lg p-2 text-center text-[10px] mq-accent font-bold leading-tight">
        {selectedLang.includes('اردو') ? 'توحید اور شریعت کے عظیم مقاصد کا فہم' : 
        selectedLang.includes('انجليزي') ? 'Understanding divine monotheism and legal objectives' : 
        selectedLang.includes('عرب') ? 'من أعظم القواعد الكلية إفراد الله بالتوحيد' :
        'Memahami tauhid dan tujuan mulia syariat'}
        </div>
        )}
        </div>
        </div>

        {/* صف التحكم بالنص واللغة */}
        <div className="mq-surface border mq-border rounded-lg p-2.5 flex items-center justify-between gap-2 text-xs">
        <button
        type="button"
        onClick={() => setShowSubtitles(!showSubtitles)}
        className={` px-3.5 py-1.5 rounded-xl font-bold transition-all flex items-center gap-1.5 ${
        showSubtitles 
        ? 'mq-surface mq-ink' 
        : 'mq-surface-2 mq-muted'
        }  `}
        >
        <span>{showSubtitles ? '✓' : '✕'}</span>
        <span>إظهار النص</span>
        </button>

        {/* القائمة المنسدلة لاختيار لغة النص المترجم */}
        <div className="relative flex-1">
        <select
        value={selectedLang}
        onChange={(e) => setSelectedLang(e.target.value)}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-1.5 text-xs mq-ink font-medium outline-none cursor-pointer"
        >
        <option value="اردو (Translation)">اردو (Translation)</option>
        <option value="عربي (الأصل)">عربي (الأصل)</option>
        <option value="انجليزي (English)">انجليزي (English)</option>
        <option value="اندونيسي (Bahasa)">اندونيسي (Bahasa)</option>
        <option value="تركي (Türkçe)">تركي (Türkçe)</option>
        <option value="فرنسي (Français)">فرنسي (Français)</option>
        </select>
        </div>
        </div>

        {/* قسم اقتطاع المقطع السلايدر المتطور */}
        <div className="mq-surface border mq-border rounded-lg p-3 space-y-2 text-right">
        <p className="text-[11px] mq-muted font-medium">
        اقتطاع المقطع (اسحب المربع للتنقل، أو الأطراف لتحديد المدة):
        </p>

        {/* مسار السلايدر التفاعلي */}
        <div className="relative h-12 rounded-xl mq-surface border mq-border overflow-hidden flex items-center px-1">
        {/* المقطع المظلل بالاقتطاع */}
        <div 
        className="absolute h-10 rounded-lg mq-surface border-2 mq-border flex items-center justify-between px-1 cursor-grab"
        style={{ right: `${startPos}%`, width: `${Math.min(75, clipDuration * 2.2)}%` }}
        >
        {/* المقبض الأيمن */}
        <div className="w-2.5 h-7 rounded-sm mq-surface text-[8px] flex items-center justify-center font-mono mq-ink select-none">
        |
        </div>

        <div className="text-[9px] font-bold mq-ink tracking-widest opacity-70">••••</div>

        {/* المقبض الأيسر */}
        <div className="w-2.5 h-7 rounded-sm mq-surface text-[8px] flex items-center justify-center font-mono mq-ink select-none">
        |
        </div>
        </div>
        </div>

        {/* توقيت الاقتطاع مع وسم المدة بالوسط */}
        <div className="flex items-center justify-between text-[11px] mq-muted px-1 pt-0.5">
        <span className="font-mono mq-muted">45:20</span>
        
        <div className="px-3 py-0.5 rounded-full mq-surface mq-ink border mq-border text-[10px] font-black tracking-wide">
        المدة: {clipDuration} ثانية
        </div>

        <span className="font-mono mq-muted">00:00</span>
        </div>

        {/* أزرار سريعة لتغيير مدة الاقتطاع */}
        <div className="flex items-center justify-center gap-2 pt-1">
        {[15, 24, 30, 45, 60].map(sec => (
        <button
        key={sec}
        type="button"
        onClick={() => setClipDuration(sec)}
        className={` px-2 py-0.5 rounded-md text-[10px] font-bold transition-all ${
        clipDuration === sec ? 'mq-selected mq-ink' : 'mq-surface-2 mq-muted'
        }  `}
        >
        {sec}ث
        </button>
        ))}
        </div>
        </div>

        {/* دوائر منصات التواصل الاجتماعي (TikTok, Insta, FB, WA) */}
        <div className="flex items-center justify-center gap-3 py-1">
        {/* زر TikTok دائري أسود */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('TikTok')}
        className={` w-12 h-12 rounded-full mq-bg mq-ink font-bold text-[11px] flex items-center justify-center transition-transform border ${
        selectedPlatform === 'TikTok' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على TikTok"
        >
        TikTok
        </button>

        {/* زر Insta دائري تدرج إنستغرام */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('Insta')}
        className={` w-12 h-12 rounded-full mq-ink font-bold text-[11px] flex items-center justify-center transition-transform border ${
        selectedPlatform === 'Insta' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على Instagram Reels"
        >
        Insta
        </button>

        {/* زر FB دائري أزرق فيسبوك */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('FB')}
        className={` w-12 h-12 rounded-full mq-surface mq-ink font-bold text-xs flex items-center justify-center transition-transform border ${
        selectedPlatform === 'FB' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="نشر على Facebook"
        >
        FB
        </button>

        {/* زر WA دائري أخضر واتساب */}
        <button
        type="button"
        onClick={() => setSelectedPlatform('WA')}
        className={` w-12 h-12 rounded-full mq-surface mq-ink font-black text-xs flex items-center justify-center transition-transform border ${
        selectedPlatform === 'WA' ? 'scale-110 mq-border' : 'mq-border'
        }  `}
        title="مشاركة عبر WhatsApp"
        >
        WA
        </button>
        </div>

        {/* زر نشر المقطع العريض الأخضر الزمردي */}
        <button
        type="button"
        onClick={handlePublish}
        disabled={isSharing}
        className="w-full py-3.5 rounded-lg mq-bg mq-hover active:scale-[0.98] mq-ink font-extrabold text-sm sm:text-base transition-all flex items-center justify-center gap-2"
        >
        {isSharing ? (
        <>
        <span className="w-4 h-4 border-2 mq-border border-t-transparent rounded-full"></span>
        <span>جاري تجهيز المقطع واقتطاعه...</span>
        </>
        ) : shareSuccess ? (
        <>
        <span>✓</span>
        <span>تم النشر بنجاح على {selectedPlatform}!</span>
        </>
        ) : (
        <span>نشر المقطع</span>
        )}
        </button>
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // 2. نافذة "اختبرني" الفقهية التفاعلية للمحاضرة (LectureQuizModal)
        // =======================================================
        const LectureQuizModal = ({ isOpen, onClose, lectureTitle }) => {
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);

            if (!isOpen) return null;

            const questions = [
                {
                    id: 1,
                    q: "ما هو الأصل في باب التوحيد والعبادة في الشريعة الإسلامية؟",
                    options: [
                        "إفراد الله وحده لا شريك له بالعبادة واستشعار عظمته",
                        "جواز الاستغاثة بغير الله في الأمور الغيبية",
                        "صرف جزء من العبادات تعظيماً للصالحين"
                    ],
                    correct: 0,
                    explanation: "الأصل الأصيل إفراد الله جل وعلا بالتوحيد والعبادة دون شريك."
                },
                {
                    id: 2,
                    q: "ما المقصود بمصطلح 'الصنعة العلمية' عند علماء الحرمين؟",
                    options: [
                        "الصناعات اليدوية في عمارة المسجد الحرام",
                        "المَلَكة والمهارة الراسخة في توظيف القواعد الأصولية واستنباط الأحكام",
                        "قراءة الكتب العلمية دون تحقيق أو تأصيل"
                    ],
                    correct: 1,
                    explanation: "الصنعة العلمية هي الملكة والمهارة الفقهية الرصينة في تخريج الفروع على الأصول."
                },
                {
                    id: 3,
                    q: "إذا شك الطائف في عدد الأشواط أثناء الطواف، فعلى ماذا يبني؟",
                    options: [
                        "يبني على الأكثر تحوطاً",
                        "يبني على اليقين وهو الأقل",
                        "يقطع طوافه ويعيد من جديد وجوباً"
                    ],
                    correct: 1,
                    explanation: "القاعدة الأصولية المعتمدة: 'اليقين لا يزول بالشك' فيبني على الأقل."
                }
            ];

            const handleSelect = (qId, optionIdx) => {
                if (submitted) return;
                setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const calculateScore = () => {
                let score = 0;
                questions.forEach(q => {
                    if (selectedAnswers[q.id] === q.correct) score += 1;
                });
                return score;
            };

            return (
                <MaqamDialogFrame data-ui-owner="LectureQuizModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-bg border mq-border rounded-lg max-w-lg w-full p-6 space-y-5 text-right max-h-[90vh] overflow-y-auto custom-scrollbar"
        onClick={(e) => e.stopPropagation()}
        >
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center">✕</button>
        <div className="flex items-center gap-2">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <h3 className="text-lg font-bold mq-ink font-['Amiri']">اختبر فهمك الفقهي للدرس</h3>
        </div>
        </div>

        <p className="text-xs mq-muted">محاضرة: <strong className="mq-accent">{lectureTitle}</strong></p>

        <div className="space-y-4">
        {questions.map((q, idx) => {
        const selected = selectedAnswers[q.id];
        const isCorrect = selected === q.correct;
        return (
        <div data-ui-owner="LectureQuizModal" key={q.id} className="mq-surface-2 border mq-border rounded-lg p-4 space-y-2.5 mq-owner">
        <h4 className="text-xs sm:text-sm font-bold mq-ink">
        {idx + 1}. {q.q}
        </h4>
        <div className="space-y-1.5">
        {q.options.map((opt, oIdx) => {
        let btnClass = "bg-white/5 border-white/10 text-gray-300 hover:bg-white/10";
        if (selected === oIdx) {
        btnClass = "bg-blue-600/30 border-blue-400 text-cyan-300 font-bold";
        }
        if (submitted) {
        if (oIdx === q.correct) {
        btnClass = "bg-emerald-600/40 border-emerald-400 text-emerald-300 font-bold";
        } else if (selected === oIdx) {
        btnClass = "bg-rose-600/40 border-rose-400 text-rose-300";
        }
        }
        return (
        <button data-ui-owner="LectureQuizModal"
        key={oIdx}
        type="button"
        onClick={() => handleSelect(q.id, oIdx)}
        className={` mq-owner  w-full p-2.5 rounded-xl border text-right text-xs transition-all flex items-center justify-between ${btnClass}  `}
        >
        <span>{opt}</span>
        {submitted && oIdx === q.correct && <span className="mq-success font-bold">✓</span>}
        </button>
        );
        })}
        </div>
        {submitted && (
        <p className="text-[11px] mq-muted mq-surface-2 p-2 rounded-lg border mq-border">
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> {q.explanation}
        </p>
        )}
        </div>
        );
        })}
        </div>

        {!submitted ? (
        <button
        type="button"
        onClick={() => setSubmitted(true)}
        disabled={Object.keys(selectedAnswers).length < questions.length}
        className="w-full py-3 rounded-xl mq-ink font-bold text-xs sm:text-sm disabled:opacity-50"
        >
        اعتماد الإجابات وتصحيح الاختبار
        </button>
        ) : (
        <div className="mq-surface-2 border mq-border rounded-lg p-4 text-center space-y-2">
        <div className="text-2xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        <h4 className="text-sm font-bold mq-success">
        النتيجة: {calculateScore()} من {questions.length} أسئلة صحيحة!
        </h4>
        <p className="text-xs mq-muted">بارك الله في حرصك على طلب العلم واستيعاب مسائل الحرمين الشريفين.</p>
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="px-6 py-2 rounded-xl mq-surface-2 mq-hover mq-ink text-xs font-bold mt-2">
        إغلاق
        </button>
        </div>
        )}
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // 3. نافذة "ملخص المحاضرة" بالذكاء الاصطناعي (LectureSummaryModal)
        // =======================================================
        const LectureSummaryModal = ({ isOpen, onClose, lectureTitle, sheikhName }) => {
            const [copied, setCopied] = useState(false);

            if (!isOpen) return null;

            const summaryPoints = [
                "المسألة الأولى: التوحيد هو الغاية العظمى التي لأجلها خُلقت الخليقة وأُرسلت الرسل عليهم السلام.",
                "المسألة الثانية: الصنعة العلمية المعتمدة بالحرمين الشريفين تقوم على رد المتشابه إلى المحكم والأخذ بصريح الكتاب والسنة.",
                "المسألة الثالثة: وجوب التثبت في الفتوى وتحري أقوال كبار علماء الحرمين وعدم الاعتماد على الشواذ الفقهية.",
                "المسألة الرابعة: القواعد الأصولية الخمس الكبرى (الأمور بمقاصدها، اليقين لا يزول بالشك، المشقة تجلب التيسير، الضرر يزال، العادة محكمة).",
                "التوجيه العملي: اغتنام مجالس الحرمين الشريفين والحرص على تقييد الفوائد وحفظ الأصول."
            ];

            const handleCopy = () => {
                const textToCopy = `ملخص درس: ${lectureTitle}\nإلقاء: ${sheikhName}\n\n` + summaryPoints.join('\n');
                try {
                    navigator.clipboard.writeText(textToCopy);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2500);
                } catch(e) {}
            };

            return (
                <MaqamDialogFrame data-ui-owner="LectureSummaryModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-bg border mq-border rounded-lg max-w-lg w-full p-6 space-y-4 text-right max-h-[88vh] overflow-y-auto custom-scrollbar"
        onClick={(e) => e.stopPropagation()}
        >
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center">✕</button>
        <div className="flex items-center gap-2">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <h3 className="text-lg font-bold mq-ink font-['Amiri']">ملخص المحاضرة الذكي</h3>
        </div>
        </div>

        <div className="mq-surface-2 border mq-border rounded-lg p-3.5 space-y-1 text-xs mq-muted">
        <div><strong className="mq-accent">الدرس:</strong> {lectureTitle}</div>
        <div><strong className="mq-accent">الشيخ المدرس:</strong> {sheikhName}</div>
        <div><strong className="mq-accent">التلخيص:</strong> معجم معاجم الذكي بالذكاء الاصطناعي <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        </div>

        <div className="space-y-2.5 text-xs mq-ink">
        <h4 className="font-bold mq-ink text-sm">النقاط والفوائد الجوهرية:</h4>
        {summaryPoints.map((point, idx) => (
        <div key={idx} className="p-3 rounded-xl mq-surface-2 border mq-border leading-relaxed flex items-start gap-2">
        <span className="mq-accent font-bold text-sm">✦</span>
        <span>{point}</span>
        </div>
        ))}
        </div>

        <div className="flex items-center gap-2 pt-2">
        <button
        type="button"
        onClick={handleCopy}
        className="flex-1 py-2.5 rounded-xl mq-surface-2 mq-hover mq-ink font-bold text-xs transition-all flex items-center justify-center gap-1.5"
        >
        <span>{MaqamDisplayText(copied ? '✓ تم النسخ إلى الحافظة' : '📋 نسخ الملخص')}</span>
        </button>
        <button data-ui-close="true" aria-label="إغلاق"
        type="button"
        onClick={onClose}
        className="px-6 py-2.5 rounded-xl mq-primary mq-ink font-bold text-xs mq-hover transition-all"
        >
        إغلاق
        </button>
        </div>
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // 4. المشغل الصوتي المصغر العائم في الأسفل (MiniFloatingAudioPlayer)
        // =======================================================
        const MiniFloatingAudioPlayer = ({ isPlaying, onTogglePlay, onExpand, onClose, lectureTitle, sheikhName, videoThumb }) => {
            return (
                <div data-ui-owner="MiniFloatingAudioPlayer" className="fixed bottom-6 left-6 sm:left-8 z-[90000] notranslate mq-bg border mq-border rounded-lg p-3 flex items-center gap-3 text-right max-w-sm w-full mq-owner" translate="no" dir="rtl">
        {/* الصورة المصغرة مع التوهج */}
        <div className="relative w-12 h-12 rounded-xl overflow-hidden border mq-border shrink-0 mq-bg">
        <img src={videoThumb || "./assets/images/media_1788731211476.png"} alt="صورة الدرس" className="w-full h-full object-cover" />
        {isPlaying && (
        <div className="absolute inset-0 mq-surface-2 flex items-center justify-center gap-0.5">
        <span className="w-1 h-3 mq-primary"></span>
        <span className="w-1 h-5 mq-selected delay-75"></span>
        <span className="w-1 h-2 mq-primary delay-150"></span>
        </div>
        )}
        </div>

        {/* عنوان الدرس واسم الشيخ */}
        <div className="flex-1 min-w-0">
        <p className="text-xs font-bold mq-ink truncate">{lectureTitle || "بث مباشر - دروس المسجد الحرام"}</p>
        <p className="text-[11px] mq-muted truncate">{sheikhName || "كبار علماء الحرمين"}</p>
        </div>

        {/* أزرار التحكم */}
        <div className="flex items-center gap-1.5 shrink-0">
        {/* تشغيل / إيقاف مؤقت */}
        <button
        type="button"
        onClick={onTogglePlay}
        className="w-8 h-8 rounded-full mq-primary mq-hover mq-ink flex items-center justify-center font-bold text-xs transition-all"
        title={isPlaying ? "إيقاف مؤقت" : "تشغيل"}
        >
        {MaqamDisplayText(isPlaying ? '⏸' : '▶')}
        </button>

        {/* تكبير إلى المشغل الكامل */}
        <button
        type="button"
        onClick={onExpand}
        className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center font-bold text-xs transition-all"
        title="تكبير المشغل"
        >
        ⤢
        </button>

        {/* إغلاق */}
        <button data-ui-close="true" aria-label="إغلاق"
        type="button"
        onClick={onClose}
        className="w-7 h-7 rounded-full mq-surface-2 mq-hover mq-muted flex items-center justify-center text-xs transition-all"
        title="إغلاق المشغل"
        >
        ✕
        </button>
        </div>
        </div>
            );
        };

        // =======================================================
        // 5. نافذة الخريطة التفاعلية لمواقع كراسي ومحاضرات الحرم (HaramInteractiveMapModal)
        // =======================================================
        const HaramInteractiveMapModal = ({ isOpen, onClose, targetLocation = "كرسي باب أجياد - الدور الأول", sheikhName = "الشيخ أ.د. سامي الصقير" }) => {
            if (!isOpen) return null;

            return (
                <MaqamDialogFrame data-ui-owner="HaramInteractiveMapModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-bg border mq-border rounded-lg max-w-2xl w-full p-6 space-y-4 text-right relative"
        onClick={(e) => e.stopPropagation()}
        >
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center">✕</button>
        <div className="flex items-center gap-2">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <h3 className="text-lg font-bold mq-ink font-['Amiri']">خريطة كراسي دروس المسجد الحرام التفاعلية</h3>
        </div>
        </div>

        <div className="mq-surface-2 border mq-border rounded-lg p-3 flex items-center justify-between text-xs">
        <span>الموقع المحدد: <strong className="mq-ink">{targetLocation}</strong></span>
        <span className="mq-accent font-bold">الشيخ: {sheikhName}</span>
        </div>

        {/* مخطط تفاعلي للمسجد الحرام والكعبة وكراسي التدريس */}
        <div className="relative aspect-[16/9] w-full rounded-lg border mq-border overflow-hidden flex items-center justify-center p-4">
        {/* دوائر الطواف حول الكعبة */}
        <div className="w-64 h-64 rounded-full border mq-border flex items-center justify-center">
        <div className="w-48 h-48 rounded-full border mq-border flex items-center justify-center">
        <div className="w-32 h-32 rounded-full border mq-border flex items-center justify-center">
        {/* مجسم الكعبة المشرفة في المنتصف */}
        <div className="w-14 h-14 mq-bg border-2 mq-border rounded-lg flex items-center justify-center mq-accent font-bold text-[10px] text-center leading-tight">
        الكعبة المشرفة
        </div>
        </div>
        </div>
        </div>

        {/* نقطة كرسي باب أجياد المحدد */}
        <div className="absolute top-10 right-16 p-2 rounded-xl mq-surface border mq-border mq-ink text-[11px] font-bold flex items-center gap-1.5">
        <span className="w-2.5 h-2.5 rounded-full mq-surface"></span>
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> {targetLocation}</span>
        </div>

        {/* كراسي أخرى بالحرم */}
        <div className="absolute bottom-10 right-20 text-[10px] mq-muted mq-surface-2 px-2 py-1 rounded-lg border mq-border">
        كرسي الرواق العثماني
        </div>
        <div className="absolute top-12 left-16 text-[10px] mq-muted mq-surface-2 px-2 py-1 rounded-lg border mq-border">
        كرسي باب الملك عبدالعزيز
        </div>
        <div className="absolute bottom-12 left-20 text-[10px] mq-muted mq-surface-2 px-2 py-1 rounded-lg border mq-border">
        كرسي باب الفتح
        </div>
        </div>

        {/* إرشادات وتوجيهات المسار */}
        <div className="mq-surface-2 border mq-border rounded-lg p-3 text-xs mq-muted space-y-1.5">
        <div className="font-bold mq-ink flex items-center gap-1.5">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>مسار الوصول الأسرع:</span>
        </div>
        <p className="text-[11px] mq-muted">
        ادخل عبر باب أجياد (باب رقم 5)، اصعد الدرج الكهربائي للدور الأول، ستجد منصة التدريس أمام الرواق الجنوبي مباشرة مع توفر أجهزة الترجمة الفورية وسماعات التيسير.
        </p>
        </div>

        <div className="flex justify-end">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="px-6 py-2 rounded-xl mq-primary mq-ink font-bold text-xs mq-hover transition-all">
        تم، شكراً لك
        </button>
        </div>
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // 6. منظومة الأوامر الصوتية التفاعلية وهالة الذبذبات (VoiceHUD)
        // =======================================================
        const VoiceHUD = ({ isOpen, onClose, isListening, transcript, onExecuteCommand }) => {
            if (!isOpen) return null;

            const commandTips = [
                { cmd: "معاجم / Maajem", desc: "فتح شات بوت معجم الحرمين الذكي" },
                { cmd: "المحاضرات / Lectures", desc: "الانتقال لدروس ومحاضرات الحرم المعتمدة" },
                { cmd: "الدروس / Lessons", desc: "الانتقال لتبويب البث المباشر" },
                { cmd: "قسم الطالب / Student", desc: "الدخول المباشر لبوابة الطالب" },
                { cmd: "بوابة الطلاب / Student", desc: "بوابة الطلاب (عربي وأعجمي) والتسميع الصوتي" },
                { cmd: "بوابة الشيوخ / Sheikhs", desc: "بوابة أصحاب الفضيلة الشيوخ وكادر التدريس" },
                { cmd: "المنظمين / Organizers", desc: "لوحة تحكم منظمي الداشبوردات والإدارة" },
                { cmd: "المحاضرة المباشرة / Live", desc: "تشغيل مشغل المحاضرة المباشرة فوراً" },
                { cmd: "الاختبار اليومي / Quiz", desc: "فتح نافذة اختبر فهمك الفقهي" }
            ];

            return (
                <MaqamDialogFrame data-ui-owner="VoiceHUD" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop mq-owner" translate="no" dir="rtl" onClick={onClose}>
        <div 
        className="mq-bg border mq-border rounded-lg max-w-md w-full p-6 space-y-5 text-right relative overflow-hidden"
        onClick={(e) => e.stopPropagation()}
        >
        {/* خلفية الوهج الصوتي */}
        <div className="absolute -top-20 inset-x-0 h-40 rounded-full pointer-events-none"></div>

        {/* رأس النافذة */}
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center">✕</button>
        <div className="flex items-center gap-2">
        <span className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <h3 className="text-lg font-bold mq-ink mq-owner">المساعد الصوتي الذكي لمنصة مقام</h3>
        </div>
        </div>

        {/* هالة الذبذبات الصوتية الحية المتفاعلة (Audio Waves) */}
        <div className="flex flex-col items-center justify-center py-4 space-y-3">
        <div className="relative w-24 h-24 rounded-full flex items-center justify-center">
        <span className="text-4xl mq-ink"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        {isListening && (
        <div className="absolute inset-0 rounded-full border-4 mq-border opacity-60"></div>
        )}
        </div>

        {/* أعمدة التموج الصوتي (Sound Waves Animation) */}
        <div className="flex items-center gap-1.5 h-8">

        "ar": "ولا سيما وهو يعيش شرف الزمان في الأشهر الحرم",
        "en": "Especially as he lives the honor of time during the sacred months",
        "ur": "خاص طور پر جب وہ مقدس مہینوں میں وقت کا احترام کرتا ہے۔",
        "tr": "Hele ki kutsal aylarda zamanın şerefini yaşarken",
        "duration": 4
    },
    {
        "id": 26,
        "ar": "ومنها شهر الله المحرم",
        "en": "Including the month of God, Muharram",
        "ur": "خدا کا مہینہ محرم سمیت",
        "tr": "Allah'ın ayı Muharrem de dahil",
        "duration": 4
    }
];

        const LiveTranslationModal = ({ sheikhName = "معالي الشيخ د. عبدالرحمن السديس", onClose }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentSentenceIndex, setCurrentSentenceIndex] = useState(0);
            const [visibleWordsCount, setVisibleWordsCount] = useState(0);
            const [currentLanguage, setCurrentLanguage] = useState('العربية');
            const [show173Modal, setShow173Modal] = useState(false);
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);

            // رابط يوتيوب والتحكم به
            const [youtubeUrlInput, setYoutubeUrlInput] = useState('');
            const [youtubeId, setYoutubeId] = useState('');

            // التخزين المؤقت للترجمات الديناميكية (لغات الـ 173)
            const [dynamicTranslations, setDynamicTranslations] = useState({});
            const [isFetchingTranslation, setIsFetchingTranslation] = useState(false);

            // استخراج معرف اليوتيوب من أي رابط
            const extractYoutubeId = (url) => {
                if (!url) return '';
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : url.trim();
            };

            const applyYoutubeUrl = () => {
                const id = extractYoutubeId(youtubeUrlInput);
                if (id) {
                    setYoutubeId(id);
                    setIsDrawerOpen(false);
                    // إعادة التعيين
                    setIsPlaying(false);
                    setCurrentSentenceIndex(0);
                    setVisibleWordsCount(0);
                    // إيقاف الفيديو مؤقتاً
                    const iframe = document.getElementById('cinema-youtube-iframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    }
                }
            };

            // ترجمة الجمل الـ 27 عند اختيار لغة من الـ 173 لغة (إذا لم تكن مخزنة مسبقاً)
            useEffect(() => {
                if (currentLanguage === 'العربية' || currentLanguage === 'الإنجليزية' || currentLanguage === 'الأردية' || currentLanguage === 'التركية') {
                    return; // هذه اللغات مسبقة الترجمة بدقة عالية في الكاش
                }

                if (dynamicTranslations[currentLanguage]) {
                    return; // تم جلبها مسبقاً
                }

                const fetchLanguageSubtitles = async () => {
                    setIsFetchingTranslation(true);
                    try {
                        const langCode = (typeof PLATFORM_LANG_CODES !== 'undefined' && PLATFORM_LANG_CODES[currentLanguage]) ? PLATFORM_LANG_CODES[currentLanguage] : 'en';
                        const translatedList = [];

                        for (const seg of LECTURE_SUBTITLES_27) {
                            try {
                                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=${langCode}&dt=t&q=${encodeURIComponent(seg.ar)}`);
                                const data = await res.json();
                                let fullTrans = '';
                                if (data && data[0]) {
                                    data[0].forEach(chunk => {
                                        if (chunk[0]) fullTrans += chunk[0];
                                    });
                                }
                                translatedList.push(fullTrans || seg.en || seg.ar);
                            } catch (err) {
                                translatedList.push(seg.en || seg.ar);
                            }
                        }

                        setDynamicTranslations(prev => ({
                            ...prev,
                            [currentLanguage]: translatedList
                        }));
                    } catch (e) {
                        console.error('Translation error:', e);
                    } finally {
                        setIsFetchingTranslation(false);
                    }
                };

                fetchLanguageSubtitles();
            }, [currentLanguage]);

            // الحصول على نص الجملة الحالية باللغة المختارة
            const getCurrentSentenceText = () => {
                const seg = LECTURE_SUBTITLES_27[currentSentenceIndex] || LECTURE_SUBTITLES_27[0];
                if (currentLanguage === 'العربية') return seg.ar;
                if (currentLanguage === 'الإنجليزية') return seg.en;
                if (currentLanguage === 'الأردية') return seg.ur;
                if (currentLanguage === 'التركية') return seg.tr;

                if (dynamicTranslations[currentLanguage] && dynamicTranslations[currentLanguage][currentSentenceIndex]) {
                    return dynamicTranslations[currentLanguage][currentSentenceIndex];
                }
                return seg.en || seg.ar;
            };

            const currentText = getCurrentSentenceText();
            const wordsList = currentText.split(/\s+/).filter(Boolean);
            const totalWords = wordsList.length || 1;
            const currentDuration = (LECTURE_SUBTITLES_27[currentSentenceIndex] || { duration: 5 }).duration;

            // مؤقت توزيع ظهور الكلمات حبة حبة في الفترة المحددة لكل جملة
            useEffect(() => {
                if (!isPlaying) return;

                const stepIntervalMs = Math.max(100, Math.floor((currentDuration * 1000) / totalWords));

                const timer = setInterval(() => {
                    setVisibleWordsCount(prev => {
                        if (prev < totalWords) {
                            return prev + 1;
                        } else {
                            // انتهت كلمات هذه الجملة، الانتقال للجملة التالية
                            clearInterval(timer);
                            if (currentSentenceIndex < LECTURE_SUBTITLES_27.length - 1) {
                                setCurrentSentenceIndex(prevIndex => prevIndex + 1);
                                return 0;
                            } else {
                                setIsPlaying(false);
                                return prev;
                            }
                        }
                    });
                }, stepIntervalMs);

                return () => clearInterval(timer);
            }, [isPlaying, currentSentenceIndex, currentDuration, totalWords]);

            // التحكم في تشغيل وإيقاف مشغل يوتيوب عبر postMessage
            const togglePlayPause = () => {
                const iframe = document.getElementById('cinema-youtube-iframe');
                if (!isPlaying) {
                    setIsPlaying(true);
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                    }
                } else {
                    setIsPlaying(false);
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo' }), '*');
                    }
                }
            };

            const handleRestart = () => {
                setCurrentSentenceIndex(0);
                setVisibleWordsCount(0);
                setIsPlaying(true);
                const iframe = document.getElementById('cinema-youtube-iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [0, true] }), '*');
                    iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo' }), '*');
                }
            };

            const handlePrevSentence = () => {
                if (currentSentenceIndex > 0) {
                    setCurrentSentenceIndex(prev => prev - 1);
                    setVisibleWordsCount(0);
                }
            };

            const handleNextSentence = () => {
                if (currentSentenceIndex < LECTURE_SUBTITLES_27.length - 1) {
                    setCurrentSentenceIndex(prev => prev + 1);
                    setVisibleWordsCount(0);
                }
            };

            // حساب الأوقات الإجمالية للعرض
            const totalDurationSec = LECTURE_SUBTITLES_27.reduce((acc, s) => acc + s.duration, 0);
            const elapsedBeforeCurrent = LECTURE_SUBTITLES_27.slice(0, currentSentenceIndex).reduce((acc, s) => acc + s.duration, 0);
            const progressPercent = Math.min(100, Math.round((elapsedBeforeCurrent / totalDurationSec) * 100));

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = Math.floor(secs % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const visibleWords = wordsList.slice(0, visibleWordsCount);
            const isRtl = (typeof RTL_LANG_CODES !== 'undefined' && PLATFORM_LANG_CODES && RTL_LANG_CODES.has(PLATFORM_LANG_CODES[currentLanguage])) || currentLanguage === 'العربية' || currentLanguage === 'الأردية' || currentLanguage === 'الفارسية';

            return (
                <MaqamDialogFrame data-ui-owner="LiveTranslationModal" className="fixed inset-0 z-[85000] notranslate mq-bg flex flex-col justify-between overflow-hidden select-none mq-ink mq-dialog-backdrop mq-owner" translate="no" dir="rtl">
        {/* 1. مشغل اليوتيوب بالخلفية بملء الشاشة الكاملة (Full Screen Video Backdrop) */}
        <div className="absolute inset-0 z-0 mq-bg overflow-hidden pointer-events-none">
        {youtubeId ? (
        <iframe
        id="cinema-youtube-iframe"
        src={`https://www.youtube.com/embed/${youtubeId}?enablejsapi=1&autoplay=0&controls=0&rel=0&modestbranding=1&loop=1&playlist=${youtubeId}`}
        title="بث المحاضرة"
        className="w-full h-full object-cover scale-105 opacity-80"
        allow="autoplay; encrypted-media"
        ></iframe>
        ) : (
        <div className="w-full h-full flex flex-col items-center justify-center text-center p-6 select-none opacity-80">
        <div className="w-16 h-16 rounded-lg mq-surface-2 border mq-border flex items-center justify-center text-2xl mq-accent mb-3">
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </div>
        <span className="text-sm font-bold mq-muted font-['Amiri']">لا يوجد رابط فيديو حالياً — يمكنك لصق رابط يوتيوب من زر «رابط الفيديو» أعلى الشاشة في أي وقت</span>
        <span className="text-[11px] mq-muted font-mono mt-1">CINEMA SUBTITLES BACKDROP READY</span>
        </div>
        )}
        {/* طبقة تظليل سينمائية خفيفة لضمان وضوح الترجمة */}
        <div className="absolute inset-0 pointer-events-none"></div>
        </div>

        {/* 2. الشريط العلوي: شعار، اختيار لغة الترجمة من 173 لغة، زر فتح القائمة الجانبية، وزر الإغلاق */}
        <header className="relative z-20 flex items-center justify-between p-4 sm:p-6 mq-surface-2 border-b mq-border gap-3">
        <div className="flex items-center gap-3">
        <LogoMaqam mode="white" className="h-10 sm:h-12" />
        <div className="hidden md:flex flex-col text-right">
        <span className="text-xs font-bold mq-accent font-['Amiri']">مسرح الترجمة الفورية السينمائي</span>
        <span className="text-[10px] mq-muted font-mono">173 LINGUISTIC LIVE THEATER</span>
        </div>
        </div>

        {/* زر اختيار لغة الترجمة من 173 لغة في أعلى الشاشة */}
        <div className="flex items-center gap-2">
        <button
        onClick={() => setShow173Modal(true)}
        className="px-4 py-2 rounded-lg mq-ink font-extrabold text-xs sm:text-sm flex items-center gap-2 border mq-border transition-all transform active:scale-95"
        title="اختر من بين 173 لغة عالمية"
        >
        <Icons.Globe />
        <span>لغة الترجمة: <strong className="mq-accent font-black">{currentLanguage}</strong></span>
        <span className="mq-surface-2 text-[10px] px-2 py-0.5 rounded-full border mq-border">173 لغة ▾</span>
        </button>

        {isFetchingTranslation && (
        <span className="hidden sm:inline-flex items-center gap-1.5 text-[11px] mq-ink mq-surface px-2.5 py-1 rounded-full border mq-border">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        جاري جلب الترجمة...
        </span>
        )}
        </div>

        {/* أزرار القائمة الجانبية والإغلاق */}
        <div className="flex items-center gap-2">
        <button
        onClick={() => setIsDrawerOpen(prev => !prev)}
        className={` px-3.5 py-2 rounded-lg font-bold text-xs flex items-center gap-2 border transition-all ${
        isDrawerOpen 
        ? 'mq-surface-2 mq-accent mq-border' 
        : 'mq-surface-2 mq-hover mq-ink mq-border'
        }  `}
        title="إعدادات الفيديو ورابط اليوتيوب"
        >
        <Icons.Layers />
        <span className="hidden sm:inline">رابط الفيديو</span>
        </button>

        <button data-ui-close="true" aria-label="إغلاق"
        onClick={onClose}
        className="w-10 h-10 rounded-lg mq-surface-2 mq-hover mq-ink border mq-border flex items-center justify-center transition-all"
        title="خروج من شاشة العرض"
        >
        ✕
        </button>
        </div>
        </header>

        {/* 3. القائمة الجانبية اليمنى المخفية (Slide-out Drawer) لإدخال رابط اليوتيوب وتغييره */}
        <div 
        className={` fixed top-0 right-0 h-full w-80 sm:w-96 mq-surface border-l mq-border z-40 transform transition-transform ease-in-out flex flex-col justify-between p-6 ${
        isDrawerOpen ? 'translate-x-0' : 'translate-x-full'
        }  `}
        >
        <div>
        <div className="flex items-center justify-between pb-4 border-b mq-border mb-6">
        <div className="flex items-center gap-2">
        <div className="w-8 h-8 rounded-xl mq-surface-2 mq-accent flex items-center justify-center font-bold">
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </div>
        <h3 className="font-bold text-sm mq-ink font-['Amiri']">إعدادات مقطع اليوتيوب</h3>
        </div>
        <button
        onClick={() => setIsDrawerOpen(false)}
        className="mq-muted p-1 rounded-lg mq-hover"
        >
        ✕
        </button>
        </div>

        <div className="space-y-4 text-right">
        <div>
        <label className="block text-xs font-semibold mq-muted mb-2">
        رابط مقطع اليوتيوب (YouTube URL):
        </label>
        <input
        type="text"
        value={youtubeUrlInput}
        onChange={(e) => setYoutubeUrlInput(e.target.value)}
        placeholder="https://www.youtube.com/watch?v=..."
        className="w-full mq-surface-2 border mq-border rounded-xl px-3 py-2.5 text-xs mq-ink focus:outline-none font-mono"
        dir="ltr"
        />
        </div>

        <button
        onClick={applyYoutubeUrl}
        className="w-full py-2.5 px-4 rounded-xl mq-ink font-extrabold text-xs transition-all"
        >
        تطبيق وتحديث المقطع ✓
        </button>

        <div className="p-3.5 rounded-xl mq-surface-2 border mq-border text-[11px] mq-muted leading-relaxed">
        <div className="mq-accent font-bold mb-1">ملاحظة هامة:</div>
        تغيير الرابط أو إغلاق هذه القائمة لن يبدأ التشغيل تلقائياً. التشغيل يبدأ فقط عند الضغط على زر <strong className="mq-ink">تشغيل (<svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>)</strong> بالأسفل خارج هذه القائمة.
        </div>

        <div className="pt-2">
        <span className="text-[11px] mq-muted block mb-2 font-bold">مقاطع مقترحة سريعة:</span>
        <div className="space-y-1.5">
        <button
        onClick={() => { setYoutubeUrlInput('https://www.youtube.com/watch?v=kJQP7kiw5Fk'); setYoutubeId('kJQP7kiw5Fk'); setIsDrawerOpen(false); }}
        className="w-full text-right p-2 rounded-lg mq-surface-2 mq-hover text-[11px] mq-muted border mq-border truncate block"
        >
        درس الحرم المكي الشريف (نموذج 1)
        </button>
        <button
        onClick={() => { setYoutubeUrlInput('https://www.youtube.com/watch?v=jfKfPfyJRdk'); setYoutubeId('jfKfPfyJRdk'); setIsDrawerOpen(false); }}
        className="w-full text-right p-2 rounded-lg mq-surface-2 mq-hover text-[11px] mq-muted border mq-border truncate block"
        >
        بث مباشر من المسجد الحرام (نموذج 2)
        </button>
        </div>
        </div>
        </div>
        </div>

        <div className="pt-4 border-t mq-border text-center">
        <button
        onClick={() => setIsDrawerOpen(false)}
        className="w-full py-2 text-xs mq-muted"
        >
        إغلاق القائمة
        </button>
        </div>
        </div>

        {/* 4. منطقة الترجمة السينمائية السفلية والتحكم الخارجي (فقط مربع الكلمات حبة حبة، وبدون أي نص عربي بالوسط) */}
        <main className="relative z-20 flex-1 flex flex-col justify-end items-center px-4 pb-2 sm:pb-4 pointer-events-none">
        
        {/* مربع الترجمة السينمائي الاحترافي (حبة حبة / Word-by-Word) */}
        <div className="w-full max-w-4xl pointer-events-auto transition-all mb-3">
        <div className="relative rounded-lg mq-surface-2 border mq-border p-5 sm:p-7 text-center overflow-hidden">
        
        {/* خلفية توهج خفيفة للمربع */}
        <div className="absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-24 mq-surface-2 pointer-events-none"></div>

        {/* شريط علوي صغير داخل صندوق الترجمة: رقم الجملة، المدة الزمنية، واسم الشيخ */}
        <div className="flex items-center justify-between text-[11px] mq-muted border-b mq-border pb-2.5 mb-4">
        <div className="flex items-center gap-2">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        <span className="font-bold mq-ink">{sheikhName}</span>
        </div>
        <div className="flex items-center gap-3 font-mono">
        <span className="mq-accent font-bold">مدة الجملة: {currentDuration}s</span>
        <span>جملة: {currentSentenceIndex + 1} / {LECTURE_SUBTITLES_27.length}</span>
        </div>
        </div>

        {/* الكلمات تظهر حبة حبة (Word-by-Word Streaming) */}
        <div 
        className={` min-h-[70px] sm:min-h-[85px] flex flex-wrap items-center justify-center gap-x-2 sm:gap-x-3 gap-y-1.5 text-xl sm:text-2xl md:text-3xl font-extrabold leading-relaxed ${
        isRtl ? "font-['Amiri']" : "font-sans"
        }  `}
        dir={isRtl ? 'rtl' : 'ltr'}
        >
        {visibleWords.length === 0 ? (
        <span className="mq-muted text-sm sm:text-base font-normal italic">
        {isPlaying ? 'جاري بث الكلمات فورياً...' : 'اضغط على زر التشغيل بالأسفل لبدء العرض والترجمة'}
        </span>
        ) : (
        visibleWords.map((word, idx) => {
        const isLastWord = idx === visibleWords.length - 1;
        return (
        <span data-ui-owner="LiveTranslationModal"
        key={idx}
        className={` mq-owner  transition-all inline-block ${
        isLastWord 
        ? 'mq-accent scale-110 font-black' 
        : 'mq-ink'
        }  `}
        >
        {word}
        </span>
        );
        })
        )}
        </div>

        {/* إشارة اللغة الحالية */}
        <div className="mt-3 pt-2 border-t mq-border flex items-center justify-between text-[10px] mq-muted">
        <span>مسرح الترجمة الفورية • مقام الذكية</span>
        <span className="mq-accent font-mono">اللغة المعروضة: {currentLanguage}</span>
        </div>
        </div>
        </div>
        </main>

        {/* 5. شريط التحكم الخارجي بالأسفل (خارج القائمة تماماً: زر التشغيل/الإيقاف، تقديم، تأخير، وشريط التقدم) */}
        <footer className="relative z-30 p-4 sm:p-5 mq-surface-2 border-t mq-border flex flex-col gap-3 max-w-4xl mx-auto w-full rounded-t-3xl">
        
        {/* خط التقدم الإجمالي للمحاضرة والترجمة */}
        <div className="w-full flex items-center gap-3 text-xs font-mono mq-muted">
        <span>{formatTime(elapsedBeforeCurrent)}</span>
        <div className="flex-1 h-2 mq-surface-2 rounded-full overflow-hidden relative cursor-pointer">
        <div 
        className="h-full rounded-full transition-all"
        style={{ width: `${progressPercent}%` }}
        ></div>
        </div>
        <span>{formatTime(totalDurationSec)}</span>
        </div>

        {/* أزرار التحكم الرئيسية */}
        <div className="flex items-center justify-between gap-2">
        
        {/* معلومات سريعة */}
        <div className="text-[11px] mq-muted hidden sm:flex items-center gap-2">
        <span className={` w-2.5 h-2.5 rounded-full ${isPlaying ? 'mq-selected' : 'mq-surface'}  `}></span>
        <span>{isPlaying ? 'البث والترجمة جارية' : 'متوقف مؤقتاً'}</span>
        </div>

        {/* الأزرار المركزية: سابق، تشغيل/إيقاف، تالي، إعادة */}
        <div className="flex items-center gap-3 mx-auto sm:mx-0">
        <button
        onClick={handlePrevSentence}
        disabled={currentSentenceIndex === 0}
        className="w-10 h-10 rounded-lg mq-surface-2 mq-hover disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center mq-ink transition-all active:scale-95"
        title="الجملة السابقة"
        >
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>

        {/* الزر الرئيسي للتشغيل والإيقاف (برّا القائمة بالأسفل) */}
        <button
        onClick={togglePlayPause}
        className={` px-7 py-3 rounded-lg font-black text-sm flex items-center gap-3 transition-all transform active:scale-95 ${
        isPlaying 
        ? 'mq-ink' 
        : 'mq-ink'
        }  `}
        title={isPlaying ? 'إيقاف مؤقت' : 'بدء العرض والترجمة'}
        >
        <span className="text-base">{MaqamDisplayText(isPlaying ? '❚❚' : '▶')}</span>
        <span>{isPlaying ? 'إيقاف مؤقت' : 'تشغيل العرض والترجمة'}</span>
        </button>

        <button
        onClick={handleNextSentence}
