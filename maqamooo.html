        ? 'mq-surface-2 mq-danger border mq-border' 
        : 'mq-surface-2 mq-hover mq-muted border mq-border'
        }  `}
        >
        <span>{MaqamDisplayText(msg.reported ? '✓ تم التبليغ' : '🚩 إبلاغ عن ملحوظة')}</span>
        </button>
        </div>
        </div>
        </div>
        ))}
        </div>
        ))}

        {isBotThinking && (
        <div className="flex items-center gap-3 p-4 mq-surface-2 border mq-border rounded-lg max-w-sm">
        <div className="w-4 h-4 rounded-full mq-selected"></div>
        <div className="space-y-1">
        <p className="text-xs mq-ink font-bold">جاري استدعاء Dify Agent ومراجعة الفتاوى المعتمدة...</p>
        <div className="w-32 h-1.5 mq-surface-2 rounded-full overflow-hidden">
        <div className="h-full w-3/4"></div>
        </div>
        </div>
        </div>
        )}
        </div>

        {/* شريط الإدخال والاقتراحات */}
        <div className="p-6 border-t mq-border mq-surface-2 space-y-3">
        <div className="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <span className="mq-muted whitespace-nowrap text-[11px]">اقتراحات سريعة:</span>
        {[
        "هل تلخص لي درس اليوم؟",
        "أسوي لك اختبار فقهي تفاعلي؟",
        "أحدث المحاضرات والدروس المباشرة",
        "ما حكم الشك في أشواط الطواف؟",
        "مواقيت الإحرام لمن قدم جواً"
        ].map((chip, idx) => (
        <button
        key={idx}
        onClick={() => handleSendChatMessage(chip)}
        className="px-3 py-1.5 rounded-full mq-surface-2 mq-hover mq-hover-accent mq-muted border mq-border whitespace-nowrap transition-all text-xs"
        >
        {chip}
        </button>
        ))}
        </div>

        <div className="relative flex items-center mq-surface-2 border mq-border rounded-lg p-2 transition-all">
        <input 
        type="text"
        placeholder="اسأل معجم الحرمين عن أي مسألة فقهية، حديث، أو تلخيص محاضرة..."
        value={chatInput}
        onChange={(e) => setChatInput(e.target.value)}
        onKeyDown={(e) => e.key === 'Enter' && handleSendChatMessage()}
        className="w-full px-4 py-3 bg-transparent text-sm mq-ink outline-none font-medium"
        />
        <button 
        onClick={() => handleSendChatMessage()}
        disabled={!chatInput.trim() || isBotThinking}
        className="px-6 py-3 rounded-xl hover:opacity-90 disabled:opacity-40 mq-ink font-bold text-xs transition-all flex items-center gap-2"
        >
        <Icons.Send />
        <span>إرسال</span>
        </button>
        </div>
        </div>
        </div>
        </div>
        </div>
        )}

        {/* 3. تبويب ومضات هداية */}
        {activeTab === 'wamadat' && (
        <div className="space-y-6">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
        <h3 className="text-xl font-bold mq-ink font-['Amiri']">ومضات هداية وفتاوى مرئية سريعة</h3>
        <p className="text-xs mq-muted">إجابات مركزة على أبرز الأسئلة المتكررة لقاصدي الحرمين</p>
        </div>

        <div className="w-full sm:w-72 relative">
        <input 
        type="text"
        placeholder="ابحث في فتاوى الومضات..."
        value={wamdaSearch}
        onChange={(e) => setWamdaSearch(e.target.value)}
        className="w-full px-4 py-2.5 rounded-xl mq-surface-2 border mq-border text-xs mq-ink outline-none"
        />
        </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mq-lecture-list">
        {filteredWamadat.map(w => (
        <div 
        key={w.id}
        className="glass-card rounded-lg p-4 border mq-border mq-hover-accent transition-all space-y-3 text-right"
        >
        <div className="flex items-center justify-between text-[11px] mq-muted">
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 border mq-border mq-accent font-bold">
        {w.fatwaTopic}
        </span>
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> {w.duration}</span>
        </div>

        <h4 className="font-bold text-sm mq-ink leading-relaxed">
        {MaqamDisplayText(w.title)}
        </h4>
        <p className="text-xs mq-muted">{w.sheikh}</p>

        <button 
        onClick={() => setSelectedVideo({ ...lectures[0], title: w.title, sheikh: w.sheikh })}
        className="w-full py-2 rounded-xl mq-surface-2 mq-hover text-xs font-bold transition-all flex items-center justify-center gap-2"
        >
        <Icons.Play />
        <span>مشاهدة الومضة</span>
        </button>
        </div>
        ))}
        </div>
        </div>
        )}

        {/* 4. تبويب جدول الدروس والتنبيهات */}
        {activeTab === 'schedule' && (
        <HijriCalendarSchedule 
        onOpenMap={(loc, sh) => setMapModalData({ isOpen: true, location: loc, sheikh: sh })}
        onOpenLecture={(lec) => setSelectedVideo(lec)}
        />
        )}

        {/* 5. تبويب كبار علماء الحرمين الـ 6 المعتمدين */}
        {activeTab === 'sheikhs' && (
        <div className="space-y-6">
        <div className="text-center max-w-2xl mx-auto space-y-2">
        <h3 className="text-2xl font-extrabold mq-ink font-['Amiri']">كبار علماء ومدرسي الحرمين الشريفين المعتمدين</h3>
        <p className="text-xs mq-muted">نخبة أهل العلم المكلفين بإلقاء الدروس والفتوى بالمسجد الحرام</p>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {APPROVED_SHEIKHS.map(sh => (
        <div 
        key={sh.id}
        className="glass-card rounded-lg overflow-hidden border mq-border mq-hover-accent transition-all flex flex-col items-center p-6 text-center space-y-4 group"
        >
        <div className="w-28 h-28 rounded-full overflow-hidden border-2 mq-border transition-all">
        <img src={sh.image} alt={sh.name} className="w-full h-full object-cover" />
        </div>

        <div className="space-y-1">
        <h4 className="font-extrabold text-base mq-ink font-['Amiri']">{sh.name}</h4>
        <p className="text-xs mq-accent font-bold">{MaqamDisplayText(sh.title)}</p>
        <p className="text-[11px] mq-muted">{sh.role}</p>
        </div>

        <div className="w-full pt-3 border-t mq-border flex items-center justify-between text-xs mq-muted">
        <span>كرسي التدريس:</span>
        <span className="mq-ink font-medium">{sh.location}</span>
        </div>

        <button 
        onClick={() => {
        setActiveTab('home');
        setSearchQuery(sh.name.split(' ')[0]);
        }}
        className="w-full py-2.5 rounded-xl mq-surface-2 mq-hover text-xs font-bold transition-all"
        ><MaqamNavGlyph name="home"/>
        عرض دروس الشيخ ←
        </button>
        </div>
        ))}
        </div>
        </div>
        )}

        {/* 6. تبويب المكتبة العلمية */}
        {activeTab === 'library' && (
        <div className="space-y-6">
        <div className="glass-card rounded-lg p-8 border mq-border text-center max-w-3xl mx-auto space-y-4 mq-library-intro">
        <LogoMaqam mode="white" className="h-16 md:h-20 cursor-pointer notranslate" translate="no" className="h-16 mx-auto mb-2" />
        <h2 className="text-3xl font-extrabold mq-ink font-['Amiri']">المكتبة الرقمية والمخطوطات</h2>
        <p className="mq-muted text-sm">أكثر من 15,000 مجلد ومخطوطة نادرة من نفائس مكتبة الحرم المكي الشريف متاحة بصيغ رقمية</p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mq-library-list">
        {lectures.map(l => (
        <div key={l.id} className="p-4 rounded-lg mq-surface-2 border mq-border flex items-center justify-between">
        <div>
        <h4 className="font-bold text-sm mq-ink">{MaqamDisplayText(l.title)}</h4>
        <p className="text-xs mq-muted mt-0.5">{l.sheikh}</p>
        </div>
        <button 
        onClick={() => alert('جاري تجهيز رابط تحميل تفريغ المحاضرة بصيغة PDF')}
        className="px-4 py-2 rounded-xl mq-surface-2 mq-hover text-xs font-bold transition-all"
        >
        تحميل المذكرة PDF
        </button>
        </div>
        ))}
        </div>
        </div>
        )}
        </main>

        {/* المشغل المرئي للمحاضرات */}
        {selectedVideo && (
        <ModernVideoPlayer 
        video={selectedVideo} 
        onClose={() => setSelectedVideo(null)} 
        onOpenLiveTranslation={() => setShowLiveTranslation(true)}
        onMinimize={(vid) => {
        if (onMinimizeAudio) onMinimizeAudio(vid);
        setSelectedVideo(null);
        }}
        />
        )}

        {/* الخريطة التفاعلية لكراسي تدريس الحرم */}
        {mapModalData.isOpen && (
        <HaramInteractiveMapModal 
        isOpen={mapModalData.isOpen}
        onClose={() => setMapModalData({ isOpen: false, location: '', sheikh: '' })}
        targetLocation={mapModalData.location}
        sheikhName={mapModalData.sheikh}
        />
        )}

        {/* نافذة الترجمة الفورية بالذكاء الاصطناعي لـ 3 لغات */}
        {showLiveTranslation && (
        <LiveTranslationModal 
        sheikhName="معالي الشيخ د. عبدالرحمن بن عبدالعزيز السديس"
        onClose={() => setShowLiveTranslation(false)}
        />
        )}

        {/* نافذة اختبار الفهم الفقهي التفاعلي */}
        {showQuizModal && (
        <MaqamDialogFrame className="fixed inset-0 z-50 mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop">
        <div className="glass-card rounded-lg border mq-border max-w-xl w-full p-6 sm:p-8 space-y-6 relative text-right">
        <button data-ui-close="true" aria-label="إغلاق" 
        onClick={() => { setShowQuizModal(false); setQuizSubmitted(false); }}
        className="absolute top-6 left-6 w-9 h-9 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center transition-all"
        >
        <Icons.Close />
        </button>

        <div className="text-center space-y-2">
        <div className="w-14 h-14 mx-auto rounded-lg mq-surface-2 mq-accent flex items-center justify-center">
        <Icons.Sparkles />
        </div>
        <h3 className="text-2xl font-bold font-['Amiri'] mq-ink">اختبر فهمك الفقهي لدرس اليوم</h3>
        <p className="text-xs mq-muted">قياس الاستيعاب الفوري في فقه المناسك والعبادات</p>
        </div>

        <div className="space-y-4">
        <div className="p-4 rounded-lg mq-surface-2 border mq-border space-y-2">
        <p className="text-sm font-bold mq-ink">س1: ما هو الركن الأعظم في حديث "إنما الأعمال بالنيات"؟</p>
        <div className="space-y-1.5 text-xs">
        {["إخلاص القصد لله وموافقة هدي النبي ﷺ", "كثرة العمل دون شرط النية", "التلفظ بالنية جهراً في كل موضع"].map((opt, i) => (
        <label key={i} className="flex items-center gap-2 p-2 rounded-lg mq-surface-2 mq-hover cursor-pointer">
        <input 
        type="radio" 
        name="q1" 
        checked={quizAnswers['q1'] === i}
        onChange={() => setQuizAnswers({...quizAnswers, q1: i})}
        />
        <span>{opt}</span>
        </label>
        ))}
        </div>
        </div>

        <div className="p-4 rounded-lg mq-surface-2 border mq-border space-y-2">
        <p className="text-sm font-bold mq-ink">س2: ما حكم طواف الإفاضة في الحج؟</p>
        <div className="space-y-1.5 text-xs">
        {["ركن من أركان الحج لا يتم الحج إلا به", "سنة مؤكدة يجزئ عنها دم", "واجب يسقط بالنسيان"].map((opt, i) => (
        <label key={i} className="flex items-center gap-2 p-2 rounded-lg mq-surface-2 mq-hover cursor-pointer">
        <input 
        type="radio" 
        name="q2" 
        checked={quizAnswers['q2'] === i}
        onChange={() => setQuizAnswers({...quizAnswers, q2: i})}
        />
        <span>{opt}</span>
        </label>
        ))}
        </div>
        </div>
        </div>

        {!quizSubmitted ? (
        <button 
        onClick={() => setQuizSubmitted(true)}
        className="w-full py-3.5 rounded-xl mq-primary mq-hover mq-ink font-extrabold text-sm"
        >
        اعتماد الإجابات ورؤية النتيجة <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        ) : (
        <div className="p-4 rounded-lg mq-surface-2 border mq-border text-center space-y-2">
        <h4 className="mq-success font-bold text-lg">أحسنت! إجاباتك الشرعية صحيحة 100% <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></h4>
        <p className="text-xs mq-muted">تم تسجيل نقاط إنجازك في ملف الزائر المتعلم بنجاح.</p>
        </div>
        )}
        </div>
        </MaqamDialogFrame>
        )}

        {/* =======================================================
        البوب أب العائم لنموذج معاجم الذكي في الزاوية يمين تحت
        (Floating Chatbot Launcher & Popup Window)
        ======================================================= */}
        <div data-ui="floating-chat" className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3 text-right">
        
        {/* نافذة المحادثة العائمة (Popup Window) */}
        {isFloatingChatOpen && (
        <div className={` w-[390px] sm:w-[440px] max-w-[94vw] ${isFloatingMinimized ? 'h-16' : 'h-[600px] max-h-[82vh]'} rounded-lg mq-bg border mq-border flex flex-col overflow-hidden transition-all `}>
        
        {/* ترويسة البوب أب */}
        <div className="px-5 py-3.5 border-b mq-border flex items-center justify-between shrink-0">
        <div className="flex items-center gap-2.5">
        <div className="w-8 h-8 rounded-xl flex items-center justify-center mq-ink">
        <Icons.Sparkles />
        </div>
        <div>
        <div className="flex items-center gap-1.5">
        <h4 className="font-extrabold text-sm mq-ink font-['Amiri']">معجم الحرمين (Dify AI)</h4>
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        </div>
        <p className="text-[10px] mq-ink">متصل بالخادم الآمن</p>
        </div>
        </div>

        <div className="flex items-center gap-1.5">
        <button
        onClick={handleNewChat}
        className="px-2 py-1 rounded-lg mq-surface-2 mq-hover mq-muted text-[10px] font-bold transition-all border mq-border"
        title="محادثة جديدة"
        >
        جديدة +
        </button>
        <button
        onClick={() => setShowHistoryDrawer(!showHistoryDrawer)}
        className="px-2 py-1 rounded-lg mq-surface-2 mq-hover mq-muted text-[10px] font-bold transition-all border mq-border"
        title="السجل"
        >
        السجل <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        <button
        onClick={() => setIsFloatingMinimized(!isFloatingMinimized)}
        className="w-7 h-7 rounded-lg mq-surface-2 mq-hover mq-muted flex items-center justify-center text-xs transition-all"
        title={isFloatingMinimized ? "تكبير" : "تصغير"}
        >
        {isFloatingMinimized ? '□' : '_'}
        </button>
        <button
        onClick={() => setIsFloatingChatOpen(false)}
        className="w-7 h-7 rounded-lg mq-surface-2 mq-hover mq-muted flex items-center justify-center text-xs transition-all"
        title="إغلاق"
        >
        ✕
        </button>
        </div>
        </div>

        {!isFloatingMinimized && (
        <>
        {/* درج السجل المنبثق داخل البوب أب */}
        {showHistoryDrawer && (
        <div className="p-3 mq-surface-2 border-b mq-border space-y-2 max-h-44 overflow-y-auto custom-scrollbar text-xs">
        <div className="flex items-center justify-between text-[11px] mq-muted">
        <span>الدردشات السابقة:</span>
        <button onClick={() => setShowHistoryDrawer(false)} className="mq-ink">إخفاء ✕</button>
        </div>
        {savedConversations.map(c => (
        <button type="button"
        key={c.id}
        onClick={() => {
        if (c.lastQuery) handleSendChatMessage(c.lastQuery);
        setShowHistoryDrawer(false);
        }}
        className="p-2 rounded-xl mq-surface-2 mq-hover cursor-pointer transition-all flex items-center justify-between"
        >
        <span className="truncate max-w-[240px] mq-ink">{MaqamDisplayText(c.title)}</span>
        <span className="text-[9px] mq-muted">{c.date}</span>
        </button>
        ))}
        </div>
        )}

        {/* سجل الرسائل في البوب أب */}
        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 text-xs">
        {chatMessages.map(msg => (
        <div key={msg.id} className={` flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}  `}>
        {msg.sender === 'user' ? (
        <div className="max-w-[85%] mq-ink p-3 rounded-lg rounded-bl-sm leading-relaxed">
        {msg.text}
        </div>
        ) : (
        <div className="max-w-[92%] space-y-1.5">
        <div className="flex items-center gap-1.5 text-[10px] mq-muted">
        <span className="mq-ink">✦</span>
        <span className="font-bold font-['Amiri']">معجم الحرمين</span>
        </div>
        <div className="p-3.5 rounded-lg rounded-tr-sm mq-surface-2 border mq-border mq-ink space-y-2 leading-relaxed">
        {renderFormattedText(msg.text)}

        {msg.sources && msg.sources.length > 0 && (
        <div className="pt-2 border-t mq-border flex flex-wrap gap-1 text-[9px] mq-muted">
        <span className="mq-ink">المراجع:</span>
        {msg.sources.map((s, idx) => (
        <span key={idx} className="mq-surface-2 px-2 py-0.5 rounded-full">{s}</span>
        ))}
        </div>
        )}
        </div>
        </div>
        )}
        </div>
        ))}

        {isBotThinking && (
        <div className="flex items-center gap-2 p-3 mq-surface-2 rounded-xl border mq-border text-xs mq-ink">
        <span className="w-2 h-2 rounded-full mq-selected"></span>
        <span>جاري الاستدعاء من Dify Agent...</span>
        </div>
        )}
        </div>

        {/* شريط الإدخال في البوب أب */}
        <div className="p-3 border-t mq-border mq-surface-2 space-y-2">
        {/* اقتراحات سريعة */}
        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-[10px]">
        {["هل تلخص لي درس اليوم؟", "سوي لي اختبار فقهي", "أحدث الدروس"].map((chip, idx) => (
        <button
        key={idx}
        onClick={() => handleSendChatMessage(chip)}
        className="px-2.5 py-1 rounded-full mq-surface-2 mq-hover mq-muted border mq-border whitespace-nowrap transition-all"
        >
        {chip}
        </button>
        ))}
        </div>

        <div className="flex items-center gap-2 mq-surface-2 border mq-border rounded-xl p-1.5">
        <input
        type="text"
        placeholder="اسأل معجم الحرمين..."
        value={chatInput}
        onChange={(e) => setChatInput(e.target.value)}
        onKeyDown={(e) => e.key === 'Enter' && handleSendChatMessage()}
        className="w-full px-3 py-1.5 bg-transparent text-xs mq-ink outline-none"
        />
        <button
        onClick={() => handleSendChatMessage()}
        disabled={!chatInput.trim() || isBotThinking}
        className="p-2 rounded-lg hover:opacity-90 disabled:opacity-40 mq-ink transition-all shrink-0"
        >
        <Icons.Send />
        </button>
        </div>
        </div>
        </>
        )}
        </div>
        )}

        {/* الزر العائم في الزاوية يمين تحت (Floating Action Button) */}
        <button
        onClick={() => setIsFloatingChatOpen(!isFloatingChatOpen)}
        className="relative group flex items-center gap-3 px-5 py-3.5 rounded-full mq-ink font-bold transition-all border mq-border"
        >
        <span className="relative flex h-3 w-3">
        <span className="absolute inline-flex h-full w-full rounded-full mq-selected opacity-75"></span>
        <span className="relative inline-flex rounded-full h-3 w-3 mq-surface"></span>
        </span>
        <div className="flex items-center gap-2">
        <Icons.Sparkles />
        <span className="text-xs sm:text-sm font-['Amiri'] tracking-wide">نموذج معاجم الذكي (Dify AI)</span>
        </div>
        {isFloatingChatOpen ? (
        <span className="w-5 h-5 rounded-full mq-surface-2 flex items-center justify-center text-[11px]">✕</span>
        ) : (
        <span className="px-2 py-0.5 rounded-full mq-surface-2 text-[10px] mq-ink border mq-border">تحدث الآن</span>
        )}
        </button>
        </div>
        </MaqamShell></div>
            );
        };


        const TeamsVirtualClass = ({ role = 'student', onClose, sheikhName = "فضيلة الشيخ د. حسن بخاري", lessonTitle = "شرح الورقات في أصول الفقه" }) => {

            const [isCamOn, setIsCamOn] = useState(true);
            const [isSharingScreen, setIsSharingScreen] = useState(false);

            const [activeSideTab, setActiveSideTab] = useState('questions');

                { id: 1, student: "سليمان الغامدي", text: "يا شيخنا، هل يدخل في حكم العام ما خرج مخرج الغالب؟", time: "الآن", votes: 8, answered: false },
                { id: 2, student: "عمر الهوساوي", text: "ما الفرق الدقيق بين المجمل والمبين في صلاة الكسوف؟", time: "منذ دقيقة", votes: 14, answered: true },
                { id: 3, student: "أحمد المحمدي", text: "هل يجوز تخصيص عموم السنة بالقياس الجلي؟", time: "منذ 3 دقائق", votes: 19, answered: false }
            ]);

            // رسائل الدردشة المباشرة

                { user: "عبدالرحمن العتيبي", text: "السلام عليكم ورحمة الله، الصوت والصورة واضحان جداً", time: "05:15" },
                { user: "إبراهيم الحربي", text: "جزاكم الله خيراً يا شيخنا، متن الورقات غاية في الإحكام", time: "05:16" },
                { user: "يوسف الشريف", text: "كتب الله أجركم ونفع بكم", time: "05:18" }
            ]);
            const [chatInput, setChatInput] = useState('');

            // محاكاة ورود سؤال طالب جديد في البث كل 12 ثانية
            useEffect(() => {
                const timer = setInterval(() => {
                    const sampleQuestions = [
                        { student: "عاصم الباكستاني", text: "شيخنا، هل الأمر بعد الحظر يفيد الإباحة دائماً؟" },
                        { student: "طارق الأندلسي", text: "ما ضابط العلة القاصرة في القياس؟" },
                        { student: "بلال المغربي", text: "أحسن الله إليكم، هل يحمل المطلق على المقيد في اختلاف السبب والحكم؟" }
                    ];
                    const randomQ = sampleQuestions[Math.floor(Math.random() * sampleQuestions.length)];
                    setLiveQuestions(prev => [
                        { id: Date.now(), student: randomQ.student, text: randomQ.text, time: "الآن", votes: 1, answered: false },
                        ...prev.slice(0, 6)
                    ]);
                }, 14000);
                return () => clearInterval(timer);
            }, []);

            const handleSendQuestion = () => {
                if (!newQuestionText.trim()) return;
                setLiveQuestions([
                    { id: Date.now(), student: role === 'teacher' ? "المحاضر" : "أحمد المحمدي (أنت)", text: newQuestionText, time: "الآن", votes: 1, answered: false },
                    ...liveQuestions

                setNewQuestionText('');
            };

            const handleSendChat = () => {
                if (!chatInput.trim()) return;
                setChatMessages([
                    ...chatMessages,
                    { user: role === 'teacher' ? sheikhName : "أحمد المحمدي (أنت)", text: chatInput, time: "الآن" }

            };

            const toggleVote = (id) => {
                setLiveQuestions(prev => prev.map(q => q.id === id ? { ...q, votes: q.votes + 1 } : q));
            };

            const markAnswered = (id) => {
                setLiveQuestions(prev => prev.map(q => q.id === id ? { ...q, answered: true } : q));
            };

            return (
                <div data-ui-owner="TeamsVirtualClass" className="fixed inset-0 z-50 mq-surface mq-ink flex flex-col justify-between overflow-hidden select-none mq-owner">
        {/* ترويسة تيمز العلوية */}

        <div className="flex items-center gap-3">
        <div className="w-8 h-8 rounded-lg mq-surface flex items-center justify-center font-bold mq-ink">
        T
        </div>
        <div>

        <span className="w-1.5 h-1.5 rounded-full mq-surface"></span>
        بث مباشر
        </span>
        </div>
        <p className="text-[10px] mq-muted">{sheikhName} • قاعة الإمام البخاري الرقمية</p>
        </div>
        </div>

        {/* مؤقت الجلسة وزر الإنهاء */}
        <div className="flex items-center gap-3">
        <span className="text-xs font-mono mq-muted hidden sm:inline mq-surface-2 px-2.5 py-1 rounded-md border mq-border">

        </button>

        {isSharingScreen ? (
        <div className="w-full h-full mq-surface p-6 flex flex-col justify-between text-right">
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <span className="text-xs mq-surface-2 mq-ink px-3 py-1 rounded-md font-bold">
        مشاركة شاشة: عرض متن الورقات في أصول الفقه (PDF)
        </span>
        <span className="text-xs mq-muted">الصفحة 14 من 48</span>
        </div>
        <div className="max-w-2xl mx-auto space-y-4 my-auto p-6 mq-surface-2 rounded-lg border mq-border">

        </h4>

        </p>
        </div>
        <div className="text-xs mq-muted text-left font-mono">

        </div>

        <span className="text-xs font-bold mq-ink">{sheikhName}</span>

        <p className="text-sm font-bold mq-ink">{sheikhName}</p>
        <p className="text-xs mq-muted">الكاميرا متوقفة مؤقتاً</p>
        </div>

        </div>

        </div>

        {liveQuestions.map(q => (
        <div 
        key={q.id}

        ? 'mq-surface-2 mq-border opacity-75' 
        : 'mq-surface-2 mq-border mq-hover-accent'
        }  `}

        <span className="font-bold mq-ink flex items-center gap-1.5">
        <span className="w-2 h-2 rounded-full mq-surface"></span>

        </span>
        <span className="text-[10px] mq-muted">{q.time}</span>
        </div>

        {role === 'teacher' ? (
        <button 
        onClick={() => markAnswered(q.id)}
        className={` text-[10px] px-2 py-0.5 rounded ${q.answered ? 'mq-selected mq-ink' : 'mq-selected mq-ink mq-hover'}  `}
        >
        {q.answered ? 'تمت الإجابة ✓' : 'إجابة السؤال'}
        </button>
        ) : (
        q.answered && <span className="text-[10px] mq-success">✓ أجاب الشيخ</span>
        )}
        </div>
        </div>
        ))}
        </div>
        )}

        {/* 2. الدردشة */}
        {activeSideTab === 'chat' && (
        <div className="space-y-2.5">
        {chatMessages.map((c, i) => (
        <div key={i} className="p-2.5 rounded-xl mq-surface-2 border mq-border text-right space-y-1">
        <div className="flex items-center justify-between text-[11px]">
        <span className="font-bold mq-ink">{c.user}</span>
        <span className="text-[10px] mq-muted font-mono">{c.time}</span>
        </div>
        <p className="text-xs mq-ink">{c.text}</p>
        </div>
        ))}
        </div>
        )}

        {/* 3. الحضور */}
        {activeSideTab === 'people' && (
        <div className="space-y-2">
        <div className="p-2.5 rounded-xl mq-surface-2 flex items-center justify-between text-xs">
        <span className="font-bold mq-accent">{sheikhName} (المحاضر)</span>
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> نشط</span>
        </div>
        {["أحمد المحمدي (أنت)", "عبدالرحمن العتيبي", "سليمان الغامدي", "عمر الهوساوي", "إبراهيم الحربي", "يوسف الشريف"].map((st, idx) => (
        <div key={idx} className="p-2 rounded-xl mq-surface-2 flex items-center justify-between text-xs mq-muted">
        <span>{st}</span>
        <span className="text-[10px] mq-muted">طالب حاضر</span>
        </div>
        ))}
        </div>
        )}
        </div>

        {/* حقل الإدخال السفلي للوحة الجانبية */}
        <div className="p-3 border-t mq-border mq-surface">
        {activeSideTab === 'questions' ? (
        <div className="flex gap-2">
        <input 
        type="text"
        placeholder="اطرح سؤالك للشيخ الآن..."
        value={newQuestionText}
        onChange={(e) => setNewQuestionText(e.target.value)}
        onKeyDown={(e) => e.key === 'Enter' && handleSendQuestion()}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-2 text-xs mq-ink outline-none"
        />
        <button 
        onClick={handleSendQuestion}
        className="px-3 py-2 rounded-xl mq-surface mq-hover mq-ink text-xs font-bold transition-all"
        >
        طرح
        </button>
        </div>
        ) : activeSideTab === 'chat' ? (
        <div className="flex gap-2">
        <input 
        type="text"
        placeholder="أرسل رسالة في المحادثة..."
        value={chatInput}
        onChange={(e) => setChatInput(e.target.value)}
        onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-2 text-xs mq-ink outline-none"
        />
        <button 
        onClick={handleSendChat}
        className="px-3 py-2 rounded-xl mq-surface mq-hover mq-ink text-xs font-bold transition-all"
        >
        إرسال
        </button>
        </div>
        ) : null}
        </div>
        </div>
        </div>

        {/* شريط التحكم السفلي المعتمد في تيمز */}
        <div className="h-16 mq-surface border-t mq-border px-6 flex items-center justify-between z-20">
        <div className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full mq-selected"></span>
        <span className="text-xs mq-muted font-medium hidden sm:inline">اتصال مشفر عالي الجودة (HD)</span>
        </div>

        {/* أزرار التحكم الرئيسية */}
        <div className="flex items-center gap-3">
        <button 
        onClick={() => setIsCamOn(!isCamOn)}

        }  `}
        title={isCamOn ? "إيقاف الكاميرا" : "تشغيل الكاميرا"}
        >
        <Icons.Cam />
        </button>

        <button 
        onClick={() => setIsMicOn(!isMicOn)}
        className={` w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
        isMicOn ? 'mq-surface mq-hover mq-ink' : 'mq-surface-2 mq-danger border mq-border'
        }  `}
        title={isMicOn ? "كتم الصوت" : "تشغيل المايك"}
        >
        {isMicOn ? <Icons.Mic /> : <Icons.MicOff />}
        </button>

        {role === 'teacher' && (
        <button 
        onClick={() => setIsSharingScreen(!isSharingScreen)}
        className={` px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs font-bold transition-all ${
        isSharingScreen ? 'mq-selected mq-ink' : 'mq-surface mq-hover mq-ink'
        }  `}
        >
        <Icons.ScreenShare />
        <span className="hidden sm:inline">{isSharingScreen ? "إيقاف المشاركة" : "مشاركة الشاشة"}</span>
        </button>
        )}

        {role === 'student' && (
        <>
        <button 
        onClick={() => setShowTeamsSign(!showTeamsSign)}
        className={` p-3 rounded-xl transition-all flex items-center gap-2 text-xs font-bold ${
        showTeamsSign 
        ? 'mq-surface-2 mq-accent border mq-border' 
        : 'mq-surface-2 mq-hover mq-muted'
        }  `}
        title="مترجم لغة الإشارة الذكي"
        >
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span className="hidden sm:inline">لغة الإشارة</span>
        </button>

        <button 
        onClick={() => setIsHandRaised(!isHandRaised)}
        className={` px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs font-bold transition-all ${
        isHandRaised ? 'mq-primary mq-ink font-extrabold' : 'mq-surface mq-hover mq-ink'

        <Icons.Hand />

        </button>

        <div className="flex items-center gap-2">
        <span className="text-xs mq-muted font-mono hidden md:inline">Teams Web v2.4</span>
        </div>
        </div>
        
        {/* نافذة لغة الإشارة المنبثقة داخل قاعة تيمز */}
        {showTeamsSign && (
        <div className="absolute top-20 right-6 z-40 w-60 mq-surface-2 rounded-lg border-2 mq-border p-3 space-y-2 text-right">

        </span>

        <div className="h-28 rounded-xl mq-surface-2 border mq-border flex flex-col items-center justify-center p-2">

        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>الواجبات والتكليفات الأكاديمية</span>
        </h3>
        </div>

        <div className="space-y-3">
        {currentAssignments.map(asgn => (
        <div key={asgn.id} className="p-4 rounded-lg mq-surface-2 border mq-border mq-hover-accent transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div className="text-right space-y-1">
        <div className="flex items-center gap-2">
        <span className="px-2 py-0.5 rounded-md mq-surface-2 mq-accent text-[10px] font-bold">{asgn.subject}</span>
        <h4 className="text-sm font-bold mq-ink font-['Amiri']">{MaqamDisplayText(asgn.title)}</h4>
        </div>
        <div className="text-[11px] mq-muted">
        {asgn.sheikh} • الاستحقاق: <span className="mq-success font-bold">{asgn.deadline}</span> • التقييم: {asgn.grade}
        </div>
        </div>

        <button 
        onClick={() => {
        if (asgn.subject === 'عمدة الأحكام') {
        setIsUmdatHomeworkOpen(true);
        } else {
        setActiveTab('maajem_hub');
        }
        }}
        className="px-4 py-2 rounded-xl mq-primary mq-ink font-bold text-xs hover:brightness-110 transition-all shrink-0"
        ><MaqamNavGlyph name="maajem_hub"/>
        حل الواجب الآن
        </button>
        </div>
        ))}
        </div>
        </div>

        {/* أحدث التنبيهات من المشايخ والمعهد */}
        <div className="p-6 rounded-lg mq-bg border mq-border space-y-4">
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <span className="text-xs mq-muted">تحديث لحظي</span>
        <h3 className="text-base font-bold mq-ink font-['Amiri'] flex items-center gap-2">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>أحدث تنبيهات وتوجيهات الشيوخ</span>
        </h3>
        </div>

        <div className="space-y-3">
        {currentAnnouncements.map(ann => (
        <div key={ann.id} className="p-4 rounded-lg mq-surface-2 border mq-border space-y-1.5 text-right">
        <div className="flex items-center justify-between text-xs">
        <span className="mq-muted text-[10px]">{ann.time}</span>
        <div className="flex items-center gap-2">
        <span className="mq-accent font-bold font-['Amiri']">{ann.sheikh}</span>
        <span className="font-bold mq-ink">{MaqamDisplayText(ann.title)}</span>
        </div>
        </div>
        <p className="text-xs mq-muted leading-relaxed">{ann.text}</p>
        </div>
        ))}
        </div>
        </div>

        </div>

        {/* الجانب الأيسر (5 أعمدة): بطاقة جدول محاضرات اليوم المخصصة (07:30 - 12:00) */}
        <div data-ui="daily-agenda" className="lg:col-span-5 space-y-4">
        <div className="p-6 rounded-lg mq-bg border mq-border space-y-4 relative">
        
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <div className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full mq-selected"></span>
        <span className="text-[11px] mq-success font-bold">اليوم: الخميس (4 ربيع الثاني 1448 هـ)</span>
        </div>
        <h3 className="text-base font-bold mq-ink font-['Amiri'] flex items-center gap-2">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>محاضرات اليوم (5 حصص)</span>
        </h3>
        </div>

        <p className="text-xs mq-muted text-right">
        جدول المحاضرات برحاب المسجد الحرام من الساعة 7:30 صباحاً حتى 12:00 ظهراً.
        </p>

        {/* قائمة الحصص الخمس المنسقة */}
        <div className="space-y-2.5">
        {dailyLectures.map(lec => {
        if (lec.isBreak) {
        return (
        <div data-ui-owner="StudentDashboard" key={lec.id} className="py-2 px-4 rounded-xl mq-surface-2 border mq-border text-center text-xs mq-accent font-bold flex items-center justify-center gap-2 mq-owner">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>{lec.subject} ({lec.time})</span>
        </div>
        );
        }
        return (
        <div data-ui-owner="StudentDashboard" 
        key={lec.id}
        className={` mq-owner  p-3.5 rounded-lg border transition-all text-right space-y-2 ${
        lec.isLive 
        ? 'mq-surface-2 mq-border' 
        : 'mq-surface-2 mq-border mq-hover-accent'
        }  `}
        >
        <div className="flex items-center justify-between">
        {lec.isLive ? (
        <span className="px-2 py-0.5 rounded-full mq-selected mq-ink font-bold text-[10px] flex items-center gap-1">
        <span className="w-1.5 h-1.5 rounded-full mq-surface"></span>
        <span>مباشر الآن</span>
        </span>
        ) : (
        <span className="text-[11px] mq-muted font-mono">{lec.time}</span>
        )}
        <div className="flex items-center gap-2">
        <span className="text-xs font-bold mq-ink font-['Amiri']">{lec.subject}</span>
        <span className="text-base">{MaqamDisplayText(lec.icon)}</span>
        </div>
        </div>

        <div className="flex items-center justify-between text-[11px] mq-muted pt-1 border-t mq-border">
        <div className="flex gap-2">
        <button 
        className="px-2.5 py-1 rounded-lg mq-surface-2 mq-hover mq-ink text-[10px] font-bold border mq-border transition-all"
        >
        دخول البث
        </button>
        <button 
        className="px-2.5 py-1 rounded-lg mq-surface-2 mq-hover mq-muted text-[10px] font-bold transition-all"
        >
        المذكرة
        </button>
        </div>
        <span className="mq-muted font-medium">{lec.sheikh} • <span className="mq-muted">{lec.room}</span></span>
        </div>
        </div>
        );
        })}
        </div>

        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border text-center text-xs mq-muted">
        جميع الحصص تسجل وتترجم وتدبلج تلقائياً بـ 173 لغة عبر نموذج معاجم فور انتهاء المجلس.
        </div>
        </div>
        </div>

        </div>
        )}

        {/* 2. مركز معاجم الذكي الموحد (استخراج نص صورة الكراسة وتلوين الخطأ بالأحمر) */}
        {activeTab === 'maajem_hub' && (
        <div className="max-w-4xl mx-auto space-y-6 text-right">
        <div className="p-6 sm:p-8 rounded-lg mq-bg border mq-border space-y-6">
        
        <div className="text-center space-y-2">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full mq-surface-2 mq-success border mq-border text-xs font-bold">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>نموذج معاجم الذكي • المساعد الأكاديمي الصوتي والرؤيوي</span>
        </div>
        <h3 className="text-2xl font-black mq-ink font-['Amiri']">
        المساعد المباشر لمقررات معهد المسجد الحرام
        </h3>
        <p className="text-xs mq-muted max-w-xl mx-auto leading-relaxed">
        تسميع صوتي مباشر عبر المايك، أو مسح الكراسة واستخراج النص عبر الكاميرا والتدقيق الفقهي لمناسك الحج والعبادات.
        </p>
        </div>

        {/* شريط الاقتراحات السريع */}
        <div className="flex flex-wrap items-center justify-center gap-2 pt-1">
        {[
        { label: "🎙️ تسميع حديث الوضوء", prompt: "عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: إذا توضأ أحدكم فليجعل في أنفه ماء ثم ليستنثر" },
        { label: "📖 تسميع المنهج", prompt: "سمّع لي باب شروط الصلاة وأركانها المقررة في منهج السالكين" },
        { label: "💡 شرح مسألة", prompt: "اشرح لي مسألة دم الجبران في الحج ومتى تجب الفدية على الحاج" },
        { label: "📝 تصحيح كراستي", prompt: "دقق في كراستي الفقهية واستخرج مواضع التحرير الفقهي في مناسك الحج" },
        { label: "🌐 ترجمة المقطع", prompt: "ترجم لي شرح الشيخ د. حسن بخاري إلى لغتي الأم فورياً" }
        ].map((sug, idx) => (
        <button
        key={idx}
        onClick={() => {
        setMaajemInputText(sug.prompt);
        handleProcessMaajem(sug.prompt);
        }}
        className="px-3.5 py-1.5 rounded-xl mq-surface-2 mq-hover border mq-border mq-hover-accent text-xs mq-muted transition-all"
        >
        {MaqamDisplayText(sug.label)}
        </button>
        ))}
        </div>

        {/* منطقة التفاعل: المايك في المنتصف، والكاميرا على يساره */}
        <div className="p-6 rounded-lg mq-surface-2 border mq-border text-center space-y-4">
        <div className="flex items-center justify-center gap-6">
        
        {/* زر الكاميرا على يسار المايك */}
        <button
        onClick={handleCameraUpload}
        disabled={isScanningImage}
        className="w-16 h-16 rounded-lg mq-surface-2 mq-hover border mq-border mq-ink text-2xl flex items-center justify-center transition-all transform disabled:opacity-50"
        title="إرفاق صورة كراسة واستخراج النص وتدقيقه (Vision OCR)"
        >
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>

        {/* زر المايكروفون الصوتي المباشر بالمنتصف */}
        <button
        onClick={handleToggleRealMic}
        className={` w-20 h-20 rounded-full flex items-center justify-center text-3xl transition-all transform ${
        isRealMicRecording 
        ? 'mq-selected mq-ink scale-110' 
        : 'mq-ink'
        }  `}
        title="اضغط للتسميع بصوتك المباشر"
        >
        {MaqamDisplayText(isRealMicRecording ? '⏹️' : '🎙️')}
        </button>
        </div>

        <div className="text-xs font-bold mq-muted">
        {isRealMicRecording ? (
        <span className="mq-danger font-mono">المايك يستمع لصوتك الآن.. تحدث بالتسميع أو السؤال</span>
        ) : (
        <span>اضغط المايك للتسميع، أو الكاميرا <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> على يساره لقراءة كراستك ومسحها ضوئياً</span>
        )}
        </div>

        {/* حالة المسح الضوئي الأنيقة والمخفية برمجياً بدون إظهار عداد الـ 4 ثوانٍ */}
        {isScanningImage && (
        <div className="p-5 rounded-lg mq-bg border mq-border text-center space-y-2">
        <div className="text-2xl inline-block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        <div className="text-sm font-bold mq-ink font-['Amiri']">
        جاري قراءة خط اليد وتدقيق المسائل الفقهية عبر نموذج معاجم...
        </div>
        <p className="text-[11px] mq-muted">
        مطابقة المتن مع شروح مشايخ الحرم المكي الشريف وتحديد مواضع التحرير الفقهي
        </p>
        </div>
        )}

        {/* حقل النص التفاعلي */}
        <div className="text-right space-y-2">
        <textarea
        rows="4"
        value={maajemInputText}
        onChange={e => setMaajemInputText(e.target.value)}
        placeholder="سيظهر ما تقوله بصوتك هنا كلمة بكلمة، أو النص المستخرج من صورتك..."
        className="w-full p-4 rounded-lg mq-surface-2 border mq-border mq-ink font-['Amiri'] text-base focus:outline-none transition-all leading-relaxed"
        ></textarea>
        </div>

        <div className="flex justify-center gap-3">
        <button
        onClick={() => handleProcessMaajem()}
        disabled={isMaajemProcessing || !maajemInputText.trim()}
        className="px-8 py-3 rounded-lg mq-ink font-extrabold text-xs hover:brightness-110 disabled:opacity-50 transition-all"
        >
        {MaqamDisplayText(isMaajemProcessing ? 'جاري الفحص والمعالجة...' : 'إرسال وتحليل لمعاجم AI فورياً 🚀')}
        </button>
        </div>
        </div>

        {/* نتيجة تحليل صورة الكراسة المرفقة: النص المكتوب بدقة والتحديد الأحمر وسط النص وبدون أي ترجمة إندونيسية */}
        {imageResult && (
        <div className="p-6 rounded-lg mq-bg border-2 mq-border space-y-4 text-xs">
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <span className="px-3 py-1 rounded-full mq-surface-2 mq-danger border mq-border font-bold text-[11px]">
        {imageResult.verdict}
        </span>
        <div className="flex items-center gap-2 mq-ink font-bold font-['Amiri'] text-sm">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> النص المستخرج من صورة الكراسة مع التدقيق والتحرير الفقهي:</span>
        </div>
        </div>

        {/* النص المستخرج بالكامل مع التحديد الأحمر في وسط النص */}
        <div className="p-5 rounded-lg mq-surface-2 border mq-border text-sm sm:text-base font-['Amiri'] leading-loose mq-ink text-right whitespace-pre-line">
        {imageResult.titleText}
        {imageResult.point1Text}
        {imageResult.beforeError}
        <span className="mq-surface-2 mq-danger border mq-border px-2 py-0.5 rounded-lg font-bold underline decoration-wavy decoration-red-500 mx-1">
        {imageResult.errorChunk}
        </span>
        {imageResult.afterError}
        {imageResult.remainingPoints}
        </div>

        {/* بطاقة مقارنة الخطأ والتصحيح المعتمد */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-right">
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border space-y-1">
        <span className="text-[10px] mq-danger font-bold block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> الموضع غير الدقيق المستخرج من كراستك:</span>
        <p className="mq-ink font-['Amiri'] text-sm">{imageResult.errorChunk}</p>
        </div>
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border space-y-1">
        <span className="text-[10px] mq-success font-bold block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> التحرير الفقهي المعتمد في المنهج:</span>
        <p className="mq-ink font-['Amiri'] text-sm">{imageResult.correctChunk}</p>
        </div>
        </div>

        {/* توجيه الشيخ بالحرم */}
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border mq-accent space-y-1">
        <span className="text-[10px] mq-accent font-bold block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> توجيه فضيلة الشيخ المدرس بالحرم:</span>
        <p className="leading-relaxed">{imageResult.sheikhNote}</p>
        </div>

        <div className="flex gap-2 justify-end pt-1">
        <button 
        className="px-4 py-2 rounded-xl mq-selected mq-ink font-bold text-xs mq-hover"
        >
        اعتماد وتصحيح الكراسة ✓
        </button>
        <button 
        className="px-4 py-2 rounded-xl mq-surface-2 mq-ink font-bold text-xs mq-hover"
        >
        استماع للفتوى بصوت الشيخ <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        </div>
        </div>
        )}

        {/* تقرير معاجم بعد الفحص الصوتي أو النصي */}
        {maajemAnalysisResult && (
        <div className={` p-5 rounded-lg border space-y-2 text-xs ${
        maajemAnalysisResult.status === 'warning' ? 'mq-surface-2 mq-border mq-danger' :
        maajemAnalysisResult.status === 'success' ? 'mq-surface-2 mq-border mq-success' :
        'mq-surface-2 mq-border mq-ink'
        }  `}>
        <div className="flex items-center justify-between font-bold text-sm">
        <span>{MaqamDisplayText(maajemAnalysisResult.title)}</span>
        {maajemAnalysisResult.score && <span className="font-mono">{maajemAnalysisResult.score}%</span>}
        </div>
        <p className="leading-relaxed mq-ink whitespace-pre-line font-['Amiri'] text-sm sm:text-base">{maajemAnalysisResult.details}</p>
        <div className="p-2.5 rounded-xl mq-surface-2 border mq-border mq-accent font-bold">
        {maajemAnalysisResult.sheikhTip}
        </div>
        </div>
        )}

        </div>
        </div>
        )}

        {/* 3. قسم الدروس (28 درساً شرعياً متنوعاً > 25 مع التصفية والبحث) */}
        {activeTab === 'lessons' && (
        <div className="space-y-6 text-right">
        
        <div className="p-6 rounded-lg mq-bg border mq-border flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div className="space-y-1">
        <div className="flex items-center gap-2">
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 mq-ink text-xs font-bold">مكتبة الدروس المعتمدة</span>
        <h2 className="text-xl font-black mq-ink font-['Amiri']">الدروس</h2>
        </div>
        <p className="text-xs mq-muted">
        جميع مجالس ومحاضرات مشايخ معهد الحرم المكي الشريف، مترجمة ومدبلجة ومفرغة نصياً بـ 173 لغة.
        </p>
        </div>

        {/* حقل البحث السريع */}
        <div className="w-full md:w-80">
        <input 
        type="text" 
        value={lessonSearchQuery}
        onChange={e => setLessonSearchQuery(e.target.value)}
        placeholder="ابحث عن درس، شيخ، مادة، متن..."
        className="w-full p-2.5 rounded-xl mq-surface-2 border mq-border mq-ink text-xs focus:outline-none"
        />
        </div>
        </div>

        {/* أزرار تصفية المواد الشرعية */}
        <div className="flex flex-wrap items-center gap-2 pb-2">
        {[
        { id: 'all', label: `الكل (${allInstituteLessons.length})` },
        { id: 'الفقه', label: 'الفقه الميسر' },
        { id: 'الحديث', label: 'الحديث الشريف' },
        { id: 'العقيدة', label: 'العقيدة والتوحيد' },
        { id: 'التفسير', label: 'التفسير وعلوم القرآن' },
        { id: 'أصول الفقه', label: 'أصول الفقه' },
        { id: 'اللغة العربية', label: 'اللغة والنحو' },
        { id: 'الفرائض', label: 'الفرائض' },
        { id: 'السيرة', label: 'السيرة النبوية' }
        ].map(sub => (
        <button
        key={sub.id}
        onClick={() => setSelectedSubjectFilter(sub.id)}
        className={` px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
        selectedSubjectFilter === sub.id 
        ? 'mq-selected mq-ink' 
        : 'mq-surface-2 mq-muted mq-hover'
        }  `}
        >
        {MaqamDisplayText(sub.label)}
        </button>
        ))}
        </div>

        {/* شبكة كروت الدروس (أكثر من 25 درساً) */}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mq-institute-lessons">
        {filteredLessons.map(les => (
        <div 
        key={les.id}
        className="p-5 rounded-lg mq-bg border mq-border mq-hover-accent transition-all flex flex-col justify-between space-y-4 group relative overflow-hidden"
        >
        <div className="space-y-3 text-right">
        <div className="flex items-center justify-between">
        <span className="text-[10px] mq-muted font-mono flex items-center gap-1">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>{les.duration}</span>
        </span>
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 mq-ink border mq-border text-[10px] font-bold">

        {/* تفصيل المواد التي ينقص فيها الطلاب وتوصيات التحسين */}

        {/* المواد التي ينقص فيها الطلاب */}

        <div className="p-4 rounded-lg mq-bg border mq-border space-y-3">

        <h4>خطة التحسين والتوصيات الأكاديمية لمعاجم AI:</h4>

        <span><strong>معالجة غياب الخميس (14%):</strong> اقتراح إدراج مسابقات ترتيل وإحسان التفاعلية وجوائز الحضور يوم الخميس لرفع نسبة الالتزام إلى 96%.</span>
        </div>
        <div className="p-2 rounded-xl mq-surface-2 border mq-border flex items-start gap-2">
        <span className="mq-success font-bold">✓</span>
        <span><strong>حصة تقوية في الفرائض:</strong> جدولة مجلس مراجعة إضافي مع الشيخ د. حمزة الفعر عبر Microsoft Teams.</span>
        </div>
        <div className="p-2 rounded-xl mq-surface-2 border mq-border flex items-start gap-2">
        <span className="mq-success font-bold">✓</span>
        <span><strong>توسيع مسارات الدبلجة:</strong> إطلاق تفريغ درس كتاب التوحيد باللغة التركية والأردية لرفع مؤشر الفهم.</span>
        </div>
        </div>

        <button
        onClick={() => triggerToast('تم اعتماد التوصيات الأسبوعية وإرسالها لعمادة معهد المسجد الحرام.')}
        className="w-full py-2.5 rounded-xl hover:brightness-110 mq-ink font-extrabold text-xs transition-all"
        >
        اعتماد وتطبيق خطة التحسين فوراً <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>

            );
        };

        // =======================================================
        // تعيين التوافق البرمجي لجميع التسميات السابقة
        // =======================================================
        const ShariaStudentDashboard = StudentDashboard;
        const TeacherDashboard = SheikhDashboard;
        const EmployeeDashboard = OrganizersDashboard;

        // =======================================================
        const App = () => {
            const [route, setRoute] = useState('main');
            const [showSplash, setShowSplash] = useState(true);
            const [splashFade, setSplashFade] = useState(false);

            // حالة اللغة العالمية للمنصة
            const [currentLanguage, setCurrentLanguage] = useState(() => {
                try { return localStorage.getItem('maqam_active_lang') || 'العربية'; } catch(e) { return 'العربية'; }
            });
            const [showLangModal, setShowLangModal] = useState(false);

            // حالة مركز التيسير وسهولة الوصول لذوي الإعاقة
            const [showAccessModal, setShowAccessModal] = useState(false);

            // حالة المشغل الصوتي المصغر العائم
            const [minimizedAudio, setMinimizedAudio] = useState(null);
            const [isMiniPlaying, setIsMiniPlaying] = useState(true);

            // حالة المساعد الصوتي الذكي (Voice HUD)
            const [showVoiceHUD, setShowVoiceHUD] = useState(false);
            const [isVoiceListening, setIsVoiceListening] = useState(false);
            const [voiceTranscript, setVoiceTranscript] = useState('');

            // معالج الأوامر الصوتية الذكية (عربي + إنجليزي) مع الحظر الأمني لقسم الموظف
            const executeVoiceCommand = (rawText) => {
                const text = (rawText || '').trim().toLowerCase();
                setVoiceTranscript(rawText);

                // 1. فحص الحظر الأمني لقسم الموظف (Security Lock)
                if (text.includes('موظف') || text.includes('الموظف') || text.includes('عمليات') || text.includes('employee') || text.includes('staff')) {
                    showToast('🔒 تنبيه أمني: الوصول لبوابة الموظفين والعمليات محظور عبر الأوامر الصوتية.');
                    try {
                        const utterance = new SpeechSynthesisUtterance('عذراً، الوصول لبوابة الموظفين محظور صوتياً لأسباب أمنية.');
                        utterance.lang = 'ar-SA';
                        window.speechSynthesis.speak(utterance);
                    } catch(e) {}
                    return;
                }

                // 2. أمر معاجم / Chatbot
                if (text.includes('معاجم') || text.includes('بوت') || text.includes('شات') || text.includes('ذكاء') || text.includes('maajem') || text.includes('bot') || text.includes('chat')) {
                    showToast('🎙️ جاري نقلك إلى مُعجم معاجم الذكي (Dify AI)...');
                    navigateTo('visitor_dash');
                    setTimeout(() => {
                        const difyBtn = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('معاجم') || b.innerText.includes('Dify'));
                        if (difyBtn) difyBtn.click();
                    }, 400);
                    setShowVoiceHUD(false);
                    return;
                }

                // 3. أمر المحاضرات / Lectures
                if (text.includes('محاضرات') || text.includes('المحاضرات') || text.includes('محاضرة') || text.includes('lectures') || text.includes('lecture')) {
                    showToast('🎙️ جاري نقلك إلى المحاضرات والدروس المعتمدة...');
                    navigateTo('visitor_dash');
                    setTimeout(() => {
                        const homeTab = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('الرئيسية') || b.innerText.includes('البث'));
                        if (homeTab) homeTab.click();
                        const lecSection = document.querySelector('h3, h4');
                        if (lecSection) lecSection.scrollIntoView({ behavior: 'smooth' });
                    }, 400);
                    setShowVoiceHUD(false);
                    return;
                }

                // 4. أمر الدروس / البث المباشر / Lessons
                if (text.includes('دروس') || text.includes('الدروس') || text.includes('بث') || text.includes('البث') || text.includes('lessons') || text.includes('live')) {
                    showToast('🎙️ جاري نقلك إلى البث المباشر لدروس المسجد الحرام...');
                    navigateTo('visitor_dash');
                    setTimeout(() => {
                        const homeTab = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('الرئيسية') || b.innerText.includes('البث'));
                        if (homeTab) homeTab.click();
                    }, 400);
                    setShowVoiceHUD(false);
                    return;
                }

                // 5. أمر قسم الطالب / Student
                if (text.includes('طالب') || text.includes('الطالب') || text.includes('student')) {
                    showToast('🎙️ جاري نقلك لبوابة الطالب والحلقات القرآنية...');
                    navigateTo('student_dash');
                    setShowVoiceHUD(false);
                    return;
                }

                // 6. أمر قسم المعلم / Teacher
                if (text.includes('معلم') || text.includes('المعلم') || text.includes('مدرس') || text.includes('teacher') || text.includes('شريعة') || text.includes('الشريعة') || text.includes('مصحح')) {
                    showToast('🎙️ جاري نقلك لبوابة المعلم وكادر التدريس...');
                    navigateTo('teacher_dash');
                    setShowVoiceHUD(false);
                    return;
                }

                // 7. أمر المحاضرة المباشرة / Live Lecture
                if (text.includes('مباشرة') || text.includes('المحاضرة المباشرة') || text.includes('افتح المحاضرة') || text.includes('شغل المحاضرة') || text.includes('live lecture')) {
                    showToast('🎙️ جاري تشغيل المحاضرة المباشرة الآن...');
                    navigateTo('visitor_dash');
                    setTimeout(() => {
                        const playBtn = document.querySelector('button[title*="تشغيل"], .aspect-video button, button');
                        if (playBtn) playBtn.click();
                    }, 500);
                    setShowVoiceHUD(false);
                    return;
                }

                // 8. أمر الاختبار اليومي / Daily Quiz
                if (text.includes('اختبار') || text.includes('الاختبار') || text.includes('اختبرني') || text.includes('quiz') || text.includes('test')) {
                    showToast('🎙️ جاري فتح نافذة اختبر فهمك الفقهي...');
                    navigateTo('visitor_dash');
                    setTimeout(() => {
                        const quizBtn = Array.from(document.querySelectorAll('button')).find(b => b.innerText.includes('اختبر فهمك') || b.innerText.includes('اختبر'));
                        if (quizBtn) quizBtn.click();
                    }, 500);
                    setShowVoiceHUD(false);
                    return;
                }

                showToast(`تم التقاط الصوت: "${rawText}" (قل مثلاً: معاجم، المحاضرات، قسم الطالب)`);
            };

            const handleToggleVoiceHUD = () => {
                setShowVoiceHUD(true);
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    showToast('التعرف الصوتي غير مدعوم في هذا المتصفح، يمكنك النقر على الأوامر يدوياً.');
                    return;
                }

                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ar-SA';
                    recognition.continuous = false;
                    recognition.interimResults = false;

                    recognition.onstart = () => setIsVoiceListening(true);
                    recognition.onend = () => setIsVoiceListening(false);
                    recognition.onerror = () => setIsVoiceListening(false);

                    recognition.onresult = (e) => {
                        const spokenText = e.results[0][0].transcript;
                        executeVoiceCommand(spokenText);
                    };

                    recognition.start();
                } catch(e) {
                    setIsVoiceListening(false);
                }
            };
            const [toastMessage, setToastMessage] = useState('');
            const [accessSettings, setAccessSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('maqam_access_settings');
                    return saved ? JSON.parse(saved) : {
                        dyslexiaFont: false,
                        reduceMotion: false,
                        motionSicknessDots: false,
                        colorBlindness: 'normal',
                        signLanguageActive: false
                    };
                } catch(e) {
                    return {
                        dyslexiaFont: false,
                        reduceMotion: false,
                        motionSicknessDots: false,
                        colorBlindness: 'normal',
                        signLanguageActive: false
                    };
                }
            });

            // حفظ إعدادات سهولة الوصول تلقائياً
            useEffect(() => {
                try {
                    localStorage.setItem('maqam_access_settings', JSON.stringify(accessSettings));
                } catch(e) {}
            }, [accessSettings]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            };

            const handleSelectLanguage = (lang) => {
                setCurrentLanguage(lang);
                try { localStorage.setItem('maqam_active_lang', lang); } catch(e) {}
                applyPlatformLanguage(lang);
                if (lang === 'العربية') {
                    showToast('تمت استعادة لغة المنصة الأصلية: العربية');
                } else {
                    showToast(`جاري ترجمة كامل نصوص ومحتويات المنصة فورياً إلى: ${lang} ✨`);
                }
            };

            // تطبيق الترجمة التلقائية إذا كانت هناك لغة مختارة مسبقاً
            useEffect(() => {
                if (currentLanguage && currentLanguage !== 'العربية') {
                    setTimeout(() => applyPlatformLanguage(currentLanguage), 600);
                }
            }, []);

            // دالة تطبيق مرشح عمى الألوان الفعلي
            const getColorFilterStyle = () => {
                switch (accessSettings.colorBlindness) {
                    case 'invert':
                        return 'invert(100%) hue-rotate(180deg)';
                    case 'protanopia':
                        return 'url(#protanopia-filter) sepia(20%)';
                    case 'deuteranopia':
                        return 'url(#deuteranopia-filter) sepia(20%)';
                    case 'tritanopia':
                        return 'url(#tritanopia-filter) sepia(30%)';
                    case 'grayscale':
                        return 'grayscale(100%) contrast(110%)';
                    default:
                        return 'none';
                }
            };

            // توقيت شاشة البداية الملكية: تظهر خلفية كحلية وشعار مقام مع الوهج الأزرق والذهبي ثم تتلاشى ليظهر بهو الموقع
            useEffect(() => {
                const fadeTimer = setTimeout(() => {
                    setSplashFade(true);
                }, 1200);

                const removeTimer = setTimeout(() => {
                    setShowSplash(false);
                }, 1700);

                return () => {
                    clearTimeout(fadeTimer);
                    clearTimeout(removeTimer);
                };
            }, []);

            // قائمة الواجبات المشتركة بين المعلم والطالب
            const [sharedAnnouncements, setSharedAnnouncements] = useState([]);
            const [sharedQuizzes, setSharedQuizzes] = useState([]);
            const [assignments, setAssignments] = useState([
                {
                    id: 1,
                    title: "تلخيص المسائل الفقهية في كتاب التوحيد (باب الرقى والتمائم)",
                    subject: "كتاب التوحيد",
                    sheikh: "فضيلة الشيخ د. حسن بخاري",
                    dueDate: "الأربعاء القادم",
                    instructions: "قم بتلخيص الشروط الشرعية لجواز الرقية والفرق بينها وبين التمائم الشركية مع ذكر دليلين من السنة.",
                    studentSubmitted: false,
                    studentAnswerText: ""
                },
                {
                    id: 2,
                    title: "استنباط خمس قواعد أصولية من أحكام سجود السهو",
                    subject: "شرح الورقات في أصول الفقه",
                    sheikh: "فضيلة الشيخ د. حسن بخاري",
                    dueDate: "الخميس القادم",
                    instructions: "بين كيف يتم إعمال قاعدة 'اليقين لا يزول بالشك' في حالات البناء على الأقل أثناء الطواف والصلاة.",
                    studentSubmitted: true,
                    studentAnswerText: "تم البناء على الأقل لأنه اليقين وما زاد عنه مشكوك فيه."
                }
            ]);

            // قائمة المحاضرات الإضافية المرفوعة من المدرس
            const [uploadedLectures, setUploadedLectures] = useState([
                { id: 1, title: "المجلس التمهيدي في مدارسة متن نخبة الفكر", subject: "علوم الحديث", duration: "38 دقيقة", date: "أمس" }
            ]);

            const navigateTo = (newRoute) => {
                setRoute(newRoute);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            window.__navigateTo = navigateTo;

            return (
                <div data-ui-owner="App" 
        id="app-root-container"
        style={{ filter: getColorFilterStyle() }}
        className={` mq-owner  min-h-screen mq-bg mq-owner relative transition-all ${
        accessSettings.dyslexiaFont ? 'dyslexia-mode' : ''
        }  `}
        >
        {/* تضمين مرشحات SVG الطبية لعمى الألوان */}
        <svg id="maqam-svg-filters" style={{ display: 'none', position: 'absolute', width: 0, height: 0 }}>
        <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0, 0, 0  0.558, 0.442, 0, 0, 0  0, 0.242, 0.758, 0, 0  0, 0, 0, 1, 0"/>
        </filter>
        <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0, 0, 0  0.7, 0.3, 0, 0, 0  0, 0.3, 0.7, 0, 0  0, 0, 0, 1, 0"/>
        </filter>
        <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="0.95, 0.05, 0, 0, 0  0, 0.433, 0.567, 0, 0  0, 0.475, 0.525, 0, 0  0, 0, 0, 1, 0"/>
        </filter>
        </svg>

        {/* نمط تثبيت الحركات والأنيميشنات لمرضى تشتت الحركة (ADHD) */}
        {accessSettings.reduceMotion && (
        <style dangerouslySetInnerHTML={{ __html: `
                            *, *::before, *::after {
                                animation: none !important;
                                transition: none !important;
                                scroll-behavior: auto !important;
                            }
                        `}} />
        )}

        {/* نمط عسر القراءة المريح */}
        {accessSettings.dyslexiaFont && (
        <style dangerouslySetInnerHTML={{ __html: `
                            .dyslexia-mode, .dyslexia-mode * {
                                letter-spacing: 0.06em !important;
                                word-spacing: 0.16em !important;
                                line-height: 2.1 !important;
                            }
                        `}} />
        )}

        {/* التوست التفاعلي العالمي */}
        {toastMessage && (
        <div className="fixed top-6 inset-x-0 z-[100000] flex justify-center pointer-events-none">
        <div className="px-6 py-3 rounded-lg mq-ink text-xs sm:text-sm font-bold flex items-center gap-2 border mq-border pointer-events-auto">
        <Icons.Sparkles />
        <span>{toastMessage}</span>
        </div>
        </div>
        )}

        {/* دوار المركبة: نقاط الأفق البصري المتحركة على أطراف الشاشة */}
        {accessSettings.motionSicknessDots && <MotionSicknessStabilizer />}

        {/* مترجم لغة الإشارة المعتمد العائم في الزاوية */}
        <SignLanguageFloatingPIP 
        isOpen={accessSettings.signLanguageActive}
        onClose={() => setAccessSettings({ ...accessSettings, signLanguageActive: false })}
        />

        {/* نافذة تحديد اللغات المنبثقة */}
        {/* زر المايك العائم التفاعلي مع هالة الذبذبات الصوتية في الزاوية اليسرى */}
        <button
        type="button"
        onClick={handleToggleVoiceHUD}
        className="fixed bottom-6 right-6 z-[80000] notranslate w-14 h-14 rounded-full mq-ink flex items-center justify-center border-2 mq-border active:scale-95 transition-all group mq-global-voice"
        title="المساعد الصوتي الذكي (قل: معاجم، المحاضرات، قسم الطالب، المحاضرة المباشرة...)"
        translate="no"
        >
        <span className="text-2xl transition-transform"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0ZM5 10v1a7 7 0 0014 0v-1M12 18v4M8 22h8"/></svg></span>
        <span className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full mq-selected border-2 mq-border"></span>
        <span className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full mq-selected border-2 mq-border"></span>
        </button>

        {/* المشغل الصوتي المصغر العائم بالأسفل */}
        {minimizedAudio && (
        <MiniFloatingAudioPlayer 
        isPlaying={isMiniPlaying}
        onTogglePlay={() => setIsMiniPlaying(!isMiniPlaying)}
        onExpand={() => {
        setMinimizedAudio(null);
        navigateTo('visitor_dash');
        }}
        onClose={() => setMinimizedAudio(null)}
        lectureTitle={minimizedAudio.title}
        sheikhName={minimizedAudio.sheikh}
        videoThumb={minimizedAudio.thumbnail}
        />
        )}

        {/* نافذة المساعد الصوتي المتفاعلة (Voice HUD) */}
        <VoiceHUD 
        isOpen={showVoiceHUD}
        onClose={() => setShowVoiceHUD(false)}
        isListening={isVoiceListening}
        transcript={voiceTranscript}
        onExecuteCommand={(cmd) => executeVoiceCommand(cmd)}
        />

        <LanguageSelectorModal 
        isOpen={showLangModal}
        onClose={() => setShowLangModal(false)}
        currentLanguage={currentLanguage}
        onSelectLanguage={handleSelectLanguage}
        />

        {/* نافذة مركز التيسير وسهولة الوصول لذوي الإعاقة */}
        <AccessibilityModal 
        isOpen={showAccessModal}
        onClose={() => setShowAccessModal(false)}
        accessSettings={accessSettings}
        setAccessSettings={setAccessSettings}
        onNavigate={navigateTo}
        showToast={showToast}
        />
        {/* شاشة البداية الملكية الترحيبية: خلفية كحلية سادة، شعار مقام الأبيض، وهج أزرق وذهبي خفيف */}
        {showSplash && (
        <div 
        onClick={() => setShowSplash(false)}
        className={` fixed inset-0 z-50 flex flex-col items-center justify-center mq-bg select-none transition-opacity cursor-pointer ${
        splashFade ? 'opacity-0 pointer-events-none' : 'opacity-100'
        }  `}
        title="انقر للتخطي المباشر"
        >
        <div className="relative flex flex-col items-center justify-center p-8">
        {/* الوهج الأزرق والذهبي الخفيف من تحت الشعار */}
        <div className="absolute -bottom-10 w-72 h-36 rounded-full pointer-events-none"></div>

        {/* شعار مقام الأبيض الملكي */}
        <div className="relative z-10 flex flex-col items-center">
        <LogoMaqam mode="white" className="h-16 md:h-20 cursor-pointer notranslate" translate="no" className="h-28 sm:h-36" alt="شعار منصة مقام" />
        <div className="mt-5 flex items-center gap-2">
        <span className="w-1.5 h-1.5 rounded-full mq-surface"></span>
        <span className="text-xs mq-muted tracking-widest mq-owner font-semibold">مَنَصَّةُ مَقَام • رِئَاسَةُ الشُّؤُونِ الدِّينِيَّة</span>
        <span className="w-1.5 h-1.5 rounded-full mq-selected"></span>
        </div>
        </div>
        </div>
        </div>
        )}

        {route === 'main' && <MainScreen onNavigate={navigateTo} onOpenLanguage={() => setShowLangModal(true)} onOpenAccessibility={() => setShowAccessModal(true)} currentLanguage={currentLanguage} />}
        {route === 'ts_select' && <StudentDashboard onNavigate={navigateTo} onOpenLanguage={() => setShowLangModal(true)} onOpenAccessibility={() => setShowAccessModal(true)} currentLanguage={currentLanguage} />}

        {route === 'visitor_login' && (
        <SplitAuthScreen 
        title="دخول بوابة الزوار وعموم المسلمين"
        subtitle="البث المباشر، الفتاوى، ومضات الهداية، والتفريغ الفوري"
        targetRoute="visitor_dash"
        onNavigate={navigateTo}
        demoUser="زائر الحرم المكي"
        />
        )}

        {route === 'student_login' && (
        <SplitAuthScreen 
        title="دخول بوابة الطلاب (عربي وأعجمي)"
        subtitle="الفصول الافتراضية، التسجيلات المترجمة، التسميع الصوتي عبر معاجم"
        targetRoute="student_dash"
        onNavigate={navigateTo}
        demoUser="طالب علم - أكاديمي"
        />
        )}

        {route === 'teacher_login' && (
        <SplitAuthScreen 
        title="دخول بوابة الشيوخ وكادر التدريس"
        subtitle="إطلاق البث المباشر لكرسي الحرم، اعتماد الدبلجة والترجمة الفورية"
        targetRoute="teacher_dash"
        onNavigate={navigateTo}
        demoUser="فضيلة الشيخ د. حسن بخاري"
        />
        )}

        {route === 'employee_login' && (
        <SplitAuthScreen 
        title="دخول المنظمين للداشبوردات والإدارة الأكاديمية"
        subtitle="شاشات المراقبة الشاملة، المؤشرات Q1-Q19، ومصفوفة المتجهات"
        targetRoute="employee_dash"
        onNavigate={navigateTo}
        demoUser="مدير مركز القيادة والتحكم"
        />
        )}

        {/* المنصات الداخلية */}
        {route === 'visitor_dash' && <VisitorDashboard onNavigate={navigateTo} onOpenLanguage={() => setShowLangModal(true)} onOpenAccessibility={() => setShowAccessModal(true)} currentLanguage={currentLanguage} onMinimizeAudio={(vid) => setMinimizedAudio(vid)} />}
        {route === 'student_dash' && (
        <StudentDashboard 
        sharedAnnouncements={sharedAnnouncements}
        setSharedAnnouncements={setSharedAnnouncements}
        sharedQuizzes={sharedQuizzes}
        setSharedQuizzes={setSharedQuizzes}
        onNavigate={navigateTo} 
        assignments={assignments} 
        setAssignments={setAssignments}
        uploadedLectures={uploadedLectures}
        onOpenLanguage={() => setShowLangModal(true)}
        onOpenAccessibility={() => setShowAccessModal(true)}
        currentLanguage={currentLanguage}
        />
        )}
        {route === 'teacher_dash' && (
        <TeacherDashboard 
        sharedAnnouncements={sharedAnnouncements}
        setSharedAnnouncements={setSharedAnnouncements}
        sharedQuizzes={sharedQuizzes}
        setSharedQuizzes={setSharedQuizzes}
        onNavigate={navigateTo} 
        assignments={assignments} 
        setAssignments={setAssignments}
        uploadedLectures={uploadedLectures}
        setUploadedLectures={setUploadedLectures}
        onOpenLanguage={() => setShowLangModal(true)}
        onOpenAccessibility={() => setShowAccessModal(true)}
        currentLanguage={currentLanguage}
        />
        )}
        {route === 'employee_dash' && <EmployeeDashboard onNavigate={navigateTo} onOpenLanguage={() => setShowLangModal(true)} currentLanguage={currentLanguage} />}
        </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PresentationProvider><App /></PresentationProvider>);
    </script>

    <!-- محرك الترجمة الفوري السريع لجميع اللغات (173 لغة) -->
    <div id="google_translate_element" style="display:none"></div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ar',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
</body>
</html>
