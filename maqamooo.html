        const TeamsVirtualClass = ({ role = 'student', onClose, sheikhName = "فضيلة الشيخ د. حسن بخاري", lessonTitle = "شرح الورقات في أصول الفقه" }) => {
            const [isMicOn, setIsMicOn] = useState(role === 'teacher');
            const [isCamOn, setIsCamOn] = useState(true);
            const [isSharingScreen, setIsSharingScreen] = useState(false);
            const [isHandRaised, setIsHandRaised] = useState(false);
            const [activeSideTab, setActiveSideTab] = useState('questions');
            const [showTeamsSign, setShowTeamsSign] = useState(false); // 'questions', 'chat', 'people'
            
            // أسئلة الطلاب المباشرة المنبثقة على الجانب (TikTok / Live Floating Style)
            const [liveQuestions, setLiveQuestions] = useState([
                { id: 1, student: "فهد القحطاني", text: "يا شيخنا، هل يدخل في حكم العام ما خرج مخرج الغالب؟", time: "الآن", votes: 8, answered: false },
                { id: 2, student: "سلطان الحربي", text: "ما الفرق الدقيق بين المجمل والمبين في صلاة الكسوف؟", time: "منذ دقيقة", votes: 14, answered: true },
                { id: 3, student: "تركي الدوسري", text: "هل يجوز تخصيص عموم السنة بالقياس الجلي؟", time: "منذ 3 دقائق", votes: 19, answered: false }
            ]);
            const [newQuestionText, setNewQuestionText] = useState('');

                { user: "عبدالرحمن العتيبي", text: "السلام عليكم ورحمة الله، الصوت والصورة واضحان جداً", time: "05:15" },
                { user: "إبراهيم الحربي", text: "جزاكم الله خيراً يا شيخنا، متن الورقات غاية في الإحكام", time: "05:16" },
                { user: "يوسف الشريف", text: "كتب الله أجركم ونفع بكم", time: "05:18" }
            ]);
            const [chatInput, setChatInput] = useState('');

            // محاكاة ورود سؤال طالب جديد في البث كل 12 ثانية
            useEffect(() => {
                const timer = setInterval(() => {
                    const sampleQuestions = [
                        { student: "خالد الغامدي", text: "شيخنا، هل الأمر بعد الحظر يفيد الإباحة دائماً؟" },
                        { student: "سعود الزهراني", text: "ما ضابط العلة القاصرة في القياس؟" },
                        { student: "ريان الشهري", text: "أحسن الله إليكم، هل يحمل المطلق على المقيد في اختلاف السبب والحكم؟" }
                    ];
                    const randomQ = sampleQuestions[Math.floor(Math.random() * sampleQuestions.length)];
                    setLiveQuestions(prev => [
                        { id: Date.now(), student: randomQ.student, text: randomQ.text, time: "الآن", votes: 1, answered: false },
                        ...prev.slice(0, 6)
                    ]);
                }, 14000);
                return () => clearInterval(timer);
            }, []);

            const handleSendQuestion = () => {
                if (!newQuestionText.trim()) return;
                setLiveQuestions([
                    { id: Date.now(), student: role === 'teacher' ? "المحاضر" : "تركي الدوسري (أنت)", text: newQuestionText, time: "الآن", votes: 1, answered: false },
                    ...liveQuestions
                ]);
                setNewQuestionText('');
            };

            const handleSendChat = () => {
                if (!chatInput.trim()) return;
                setChatMessages([
                    ...chatMessages,
                    { user: role === 'teacher' ? sheikhName : "تركي الدوسري (أنت)", text: chatInput, time: "الآن" }
                ]);
                setChatInput('');
            };

            const toggleVote = (id) => {
                setLiveQuestions(prev => prev.map(q => q.id === id ? { ...q, votes: q.votes + 1 } : q));
            };

            const markAnswered = (id) => {
                setLiveQuestions(prev => prev.map(q => q.id === id ? { ...q, answered: true } : q));
            };

            return (
                <div data-ui-owner="TeamsVirtualClass" className="fixed inset-0 z-50 mq-surface mq-ink flex flex-col justify-between overflow-hidden select-none mq-owner">
        {/* ترويسة تيمز العلوية */}

        {isSharingScreen ? (

        <div className="flex items-center justify-between border-b mq-border pb-3">
        <span className="text-xs mq-surface-2 mq-ink px-3 py-1 rounded-md font-bold">
        مشاركة شاشة: عرض متن الورقات في أصول الفقه (PDF)
        </span>
        <span className="text-xs mq-muted">الصفحة 14 من 48</span>

        </p>
        </div>
        <div className="text-xs mq-muted text-left font-mono">

        </div>
        </div>
        ) : isCamOn ? (
        <div className="relative w-full h-full">
        <img 
        src={SHEIKH_IMG_SUDAIS} 
        alt={sheikhName}

        </div>

        <div 
        key={q.id} 
        className={` p-3.5 rounded-lg border transition-all text-right space-y-2 ${

        : 'mq-surface-2 mq-border mq-hover-accent'
        }  `}
        >
        <div className="flex items-center justify-between text-xs">
        <span className="font-bold mq-ink flex items-center gap-1.5">
        <span className="w-2 h-2 rounded-full mq-surface"></span>

        {role === 'teacher' ? (
        <button

        <div className="p-2.5 rounded-xl mq-surface-2 flex items-center justify-between text-xs">
        <span className="font-bold mq-accent">{sheikhName} (المحاضر)</span>
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> نشط</span>
        </div>
        {["تركي الدوسري (أنت)", "عبدالرحمن العتيبي", "فهد القحطاني", "سلطان الحربي", "إبراهيم الحربي", "يوسف الشريف"].map((st, idx) => (
        <div key={idx} className="p-2 rounded-xl mq-surface-2 flex items-center justify-between text-xs mq-muted">
        <span>{st}</span>
        <span className="text-[10px] mq-muted">طالب حاضر</span>
        </div>
        ))}
        </div>
        )}
        </div>

        {/* حقل الإدخال السفلي للوحة الجانبية */}
        <div className="p-3 border-t mq-border mq-surface">
        {activeSideTab === 'questions' ? (
        <div className="flex gap-2">
        <input 
        type="text"
        placeholder="اطرح سؤالك للشيخ الآن..."
        value={newQuestionText}

        onKeyDown={(e) => e.key === 'Enter' && handleSendQuestion()}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-2 text-xs mq-ink outline-none"
        />
        <button 
        onClick={handleSendQuestion}
        className="px-3 py-2 rounded-xl mq-surface mq-hover mq-ink text-xs font-bold transition-all"
        >
        طرح
        </button>
        </div>
        ) : activeSideTab === 'chat' ? (
        <div className="flex gap-2">
        <input 
        type="text"
        placeholder="أرسل رسالة في المحادثة..."
        value={chatInput}
        onChange={(e) => setChatInput(e.target.value)}
        onKeyDown={(e) => e.key === 'Enter' && handleSendChat()}
        className="w-full mq-surface border mq-border rounded-xl px-3 py-2 text-xs mq-ink outline-none"
        />
        <button 
        onClick={handleSendChat}
        className="px-3 py-2 rounded-xl mq-surface mq-hover mq-ink text-xs font-bold transition-all"
        >
        إرسال
        </button>
        </div>
        ) : null}
        </div>
        </div>
        </div>

        {/* شريط التحكم السفلي المعتمد في تيمز */}
        <div className="h-16 mq-surface border-t mq-border px-6 flex items-center justify-between z-20">
        <div className="flex items-center gap-2">
        <span className="w-2.5 h-2.5 rounded-full mq-selected"></span>

        </div>

        {/* أزرار التحكم الرئيسية */}
        <div className="flex items-center gap-3">
        <button 
        onClick={() => setIsCamOn(!isCamOn)}
        className={` w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
        isCamOn ? 'mq-surface mq-hover mq-ink' : 'mq-surface-2 mq-danger border mq-border'
        }  `}
        title={isCamOn ? "إيقاف الكاميرا" : "تشغيل الكاميرا"}
        >
        <Icons.Cam />
        </button>

        <button 
        onClick={() => setIsMicOn(!isMicOn)}
        className={` w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
        isMicOn ? 'mq-surface mq-hover mq-ink' : 'mq-surface-2 mq-danger border mq-border'
        }  `}
        title={isMicOn ? "كتم الصوت" : "تشغيل المايك"}
        >
        {isMicOn ? <Icons.Mic /> : <Icons.MicOff />}
        </button>

        {role === 'teacher' && (
        <button 
        onClick={() => setIsSharingScreen(!isSharingScreen)}
        className={` px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs font-bold transition-all ${
        isSharingScreen ? 'mq-selected mq-ink' : 'mq-surface mq-hover mq-ink'
        }  `}
        >
        <Icons.ScreenShare />
        <span className="hidden sm:inline">{isSharingScreen ? "إيقاف المشاركة" : "مشاركة الشاشة"}</span>
        </button>
        )}

        {role === 'student' && (
        <>
        <button 
        onClick={() => setShowTeamsSign(!showTeamsSign)}
        className={` p-3 rounded-xl transition-all flex items-center gap-2 text-xs font-bold ${
        showTeamsSign 
        ? 'mq-surface-2 mq-accent border mq-border' 
        : 'mq-surface-2 mq-hover mq-muted'
        }  `}
        title="مترجم لغة الإشارة الذكي"
        >
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span className="hidden sm:inline">لغة الإشارة</span>
        </button>

        <button 
        onClick={() => setIsHandRaised(!isHandRaised)}
        className={` px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs font-bold transition-all ${
        isHandRaised ? 'mq-primary mq-ink font-extrabold' : 'mq-surface mq-hover mq-ink'
        }  `}
        >
        <Icons.Hand />
        <span>{MaqamDisplayText(isHandRaised ? "أنزِل يدك ✋" : "ارفع يدك ✋")}</span>
        </button>
        </>
        )}
        </div>

        <div className="flex items-center gap-2">
        <span className="text-xs mq-muted font-mono hidden md:inline">Teams Web v2.4</span>
        </div>
        </div>
        
        {/* نافذة لغة الإشارة المنبثقة داخل قاعة تيمز */}
        {showTeamsSign && (
        <div className="absolute top-20 right-6 z-40 w-60 mq-surface-2 rounded-lg border-2 mq-border p-3 space-y-2 text-right">
        <div className="flex items-center justify-between border-b mq-border pb-1.5 text-xs mq-accent font-bold">
        <span className="flex items-center gap-1.5">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>مترجم لغة الإشارة</span>
        </span>

        <div className="text-3xl mb-1"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        <div className="text-xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        </div>
        <p className="text-[9px] mq-muted text-center">ترجمة إشارية متزامنة مع المحاضرة المباشرة</p>
        </div>
        )}
        </div>
            );
        };

        // =======================================================
        // 8. بوابة الطالب الموسعة والتفاعلية (Student Dashboard)
        // مع قسم الواجبات الحية المنزلة من المعلم والمحاضرات المرفوعة
        // =======================================================
        // =======================================================
        // 8. رواق طالب الشريعة والمصحح الشرعي الذكي (Sharia Student Portal)
        // تدوين وتصوير الملاحظات + فحص واستخراج الخط بالذكاء الاصطناعي (OCR)
        // المصحح الشرعي بمثال عملي (كلام مغلوط عن الشيخ وتصحيحه من الدرس المعتمد)
        // دمج روبوت معاجم الذكي (Dify AI) + تعزيز ترتيل وإحسان + المحاضرات والجدول
        // =======================================================
        // 8. القسم الأول: بوابة الطلاب (عربي وأعجمي في منصة واحدة)
        // الفصول الافتراضية، التسجيلات المترجمة والمدبلجة، التسميع الصوتي المباشر عبر معاجم
        // الواجبات والدرجات، وتدوين الملاحظات الذكي والمصحح الشرعي
        // =======================================================
        // 1. نافذة تعديل الحساب والملف الأكاديمي لطالب العلم (StudentProfileModal)
        // =======================================================
        // نافذة تعديل الحساب والملف الأكاديمي لطالب العلم (StudentProfileModal)
        // =======================================================
        // نافذة تعديل الحساب والملف الأكاديمي لطالب العلم (StudentProfileModal)
        // =======================================================
        // مكوّن تعديل الملف الشخصي للطالب (StudentProfileModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        // مودال واجب عمدة الأحكام التفاعلي (UmdatHomeworkModal)
        // =======================================================
        const UmdatHomeworkModal = ({ isOpen, onClose, onComplete }) => {
            if (!isOpen) return null;
            const [homeworkText, setHomeworkText] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);

            const handleAutoFill = () => {
                setHomeworkText(
                    "حل الواجب المقرر:\n" +
                    "1. دلالة حديث أبي هريرة رضي الله عنه: وجوب النية لصحة الوضوء ورفع الحدث، ولا يصح عمل إلا بنية.\n" +
                    "2. صفة الاستنثار: هو إخراج الماء من الأنف بدفعه بالنَفَس مستعيناً بيده اليسرى بعد استنشاقه بيمينه.\n" +
                    "3. سنن الوضوء في حديث عثمان رضي الله عنه: التسمية، وغسل الكفين ثلاثاً قبل إدخالهما الإناء، وتخليل الأصابع، والمبالغة لغير الصائم."
                );
            };

            const handleSubmit = () => {
                if (!homeworkText.trim()) return;
                setIsSubmitted(true);
                if (onComplete) onComplete();
            };

            return (
                <MaqamDialogFrame data-ui-owner="UmdatHomeworkModal" className="fixed inset-0 z-[100000] notranslate mq-surface-2 flex items-center justify-center p-4 mq-dialog-backdrop mq-owner">
        <div className="mq-bg border-2 mq-border rounded-lg p-6 sm:p-8 max-w-xl w-full text-right space-y-4">
        <div className="flex items-center justify-between border-b mq-border pb-3">
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="w-8 h-8 rounded-full mq-surface-2 mq-hover mq-ink flex items-center justify-center">✕</button>
        <div>
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 mq-success text-[10px] font-bold">مقرر عمدة الأحكام</span>
        <h3 className="text-base font-bold mq-ink font-['Amiri'] mt-0.5">حل واجب كتاب الطهارة والوضوء</h3>
        </div>
        </div>

        {isSubmitted ? (
        <div className="p-6 rounded-lg mq-surface-2 border mq-border text-center space-y-3">
        <div className="text-4xl"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        <h4 className="text-lg font-bold mq-success font-['Amiri']">تم تسليم الواجب بنجاح واحتساب الدرجة!</h4>
        <p className="text-xs mq-ink">الدرجة المرصودة: 20 / 20 (درجة كاملة مستحقة)</p>
        <div className="text-[11px] mq-success">ملاحظة الشيخ د. حسن بخاري: أحسنت التحرير والضبط الفقهي لصفة الاستنثار بارك الله فيك.</div>
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="px-6 py-2 rounded-xl mq-selected mq-ink font-bold text-xs mq-hover">
        إغلاق
        </button>
        </div>
        ) : (
        <div className="space-y-3 text-xs">
        <div className="p-3 rounded-xl mq-surface-2 border mq-border mq-muted space-y-1">
        <div className="mq-accent font-bold">الأسئلة المقررة من الشيخ د. حسن بخاري:</div>
        <ol className="list-decimal list-inside space-y-1 text-[11px] mq-muted">
        <li>ما دلالة حديث أبي هريرة رضي الله عنه على وجوب النية في الطهارة؟</li>
        <li>ما هي صفة الاستنثار النبوي الصحيحة وما اليد المستعملة فيه؟</li>
        <li>اذكر سنن الوضوء المؤكدة في حديث عثمان رضي الله عنه.</li>
        </ol>
        </div>

        <div>
        <div className="flex justify-between items-center mb-1">
        <button 
        type="button" 
        onClick={handleAutoFill}
        className="text-[10px] mq-ink hover:underline font-bold"
        >
        + إدراج الإجابة النموذجية لكراستي
        </button>
        <label className="mq-muted">اكتب إجابتك أو مذكرتك هنا:</label>
        </div>
        <textarea
        rows="5"
        value={homeworkText}
        onChange={e => setHomeworkText(e.target.value)}
        placeholder="اكتب حل المسائل الفقهية هنا بتفصيل..."
        className="w-full p-3 rounded-xl mq-surface-2 border mq-border mq-ink font-['Amiri'] text-sm focus:outline-none"
        ></textarea>
        </div>

        <div className="flex gap-2 pt-1">
        <button 
        onClick={handleSubmit}
        disabled={!homeworkText.trim()}
        className="flex-1 py-2.5 rounded-xl mq-selected mq-hover disabled:opacity-50 mq-ink font-bold text-xs transition-all"
        >
        تسليم الواجب واعتماده <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        <button data-ui-close="true" aria-label="إغلاق" onClick={onClose} className="px-4 py-2.5 rounded-xl mq-surface-2 mq-muted text-xs mq-hover">
        إلغاء
        </button>
        </div>
        </div>
        )}
        </div>
        </MaqamDialogFrame>
            );
        };

        // =======================================================
        // مودال كويز عمدة الأحكام التفاعلي (UmdatQuizModal)
        // =======================================================
        const UmdatQuizModal = ({ isOpen, onClose, onComplete }) => {
            if (!isOpen) return null;
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [quizResult, setQuizResult] = useState(null);

            const questions = [
                {
                    id: 1,
                    text: "صفة الاستنثار في الوضوء تكون بـ:",
                    options: [
                        { key: "A", text: "إخراج الماء بالنَفَس مستعيناً باليد اليسرى", isCorrect: true },
                        { key: "B", text: "جذب الماء باليد اليمنى فقط" },
                        { key: "C", text: "غسل الرأس والأذنين معاً" }
                    ]
                },
                {
                    id: 2,
                    text: "حكم النية في الوضوء وفق عمدة الأحكام:",
                    options: [

        // =======================================================
        // بوابة الطالب الموحدة (StudentDashboard v5)

        const StudentDashboard = ({ onNavigate, assignments, setAssignments, uploadedLectures, setUploadedLectures, sharedAnnouncements, setSharedAnnouncements, sharedQuizzes, setSharedQuizzes, onOpenLanguage, onOpenAccessibility, currentLanguage }) => {
const feedback=useFeedback();

            // تنبيهات المشايخ
            const defaultAnnouncements = [

                { id: 2, title: "مذكرة شروط الصلاة ومناسك الحج", text: "تم رفع مذكرة تلخيص الشروط في قسم المحاضرات للمراجعة.", sheikh: "الشيخ أ.د. سامي الصقير", time: "منذ 4 ساعات" }
            ];
            const currentAnnouncements = sharedAnnouncements || [];

            // ========================================================
            // ميزات صفحة معاجم الذكية الموحدة (مايك + كاميرا مع استخراج نص الصورة الحقيقية)
            // ========================================================
            const [maajemInputText, setMaajemInputText] = useState('');
            const [isRealMicRecording, setIsRealMicRecording] = useState(false);
            const [isMaajemProcessing, setIsMaajemProcessing] = useState(false);
            const [maajemAnalysisResult, setMaajemAnalysisResult] = useState(null);
            const [difyConversationId, setDifyConversationId] = useState('');
            
            // حالة تحليل الصورة المخفية برمجياً
            const [isScanningImage, setIsScanningImage] = useState(false);
            const [imageResult, setImageResult] = useState(null);

            // تشغيل المايك الفعلي
            const handleToggleRealMic = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) return;

                if (isRealMicRecording) {
                    try { if (window._maqamAudioRec) window._maqamAudioRec.stop(); } catch(e) {}
                    setIsRealMicRecording(false);
                    return;
                }

                try {
                    const rec = new SpeechRec();
                    rec.lang = 'ar-SA';
                    rec.continuous = true;
                    rec.interimResults = true;

                    rec.onstart = () => {
                        setIsRealMicRecording(true);
                        setMaajemInputText('');
                    };

                    rec.onresult = (e) => {
                        let text = '';
                        for (let i = 0; i < e.results.length; i++) {
                            text += e.results[i][0].transcript + ' ';
                        }
                        setMaajemInputText(text.trim());
                    };

                    rec.onerror = () => setIsRealMicRecording(false);
                    rec.onend = () => setIsRealMicRecording(false);

                    window._maqamAudioRec = rec;
                    rec.start();
                } catch(err) {
                    setIsRealMicRecording(false);
                }
            };

            // رفع الصورة ومعالجتها برمجياً بدقة واستخراج النص المطابق لصورة الكراسة
            const handleCameraUpload = () => {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    startImageAnalysisFlow(file);
                };
                fileInput.click();
            };

            const startImageAnalysisFlow = (file) => {
                setIsScanningImage(true);
                setImageResult(null);

                // تأخير برمجي مخفي بدون عرض عداد الـ 4 ثوانٍ على الشاشة
                setTimeout(() => {
                    setIsScanningImage(false);

                    // استخراج النص الحقيقي من صورة الكراسة المرفقة
                    const extractedTitle = "ملاحظات من درس الحرم الشريف – فتاوى الحج (الشيخ)\nرؤوس أقلام – مناسك الحج وفتاوى عاجلة\n\n";
                    const point1 = "- دم الجبران (الفدية) : متى تجب؟ (إذا ترك واجب من الواجبات مثل الرمي أو المبيت) .\n";
                    const point2Before = "- طواف الإفاضة : ركن لا يسقط ، ";
                    const point2Error = "وقته يبدأ من ليلة النحر ( يوم العيد )";
                    const point2After = " .\n";
                    const point3 = "- طواف الوداع : واجب على غير أهل مكة ، يسقط عن الحائض والنفساء.\n";
                    const point4 = "- محظورات الإحرام : لبس المخيط للرجال ، تغطية الرأس ، التطيب.\n";
                    const point5 = "- النيابة في الرمي : تجوز للضعفاء والنساء والمرضى عند الزحام الشديد.\n";
                    const point6 = "- التحلل الأول والتحلل الثاني : ما الذي يباح في كل منهما؟ ( الأول بعد رمي جمرة العقبة والحلق أو التقصير، يباح كل شيء إلا النساء ).\n";
                    const point7 = "- المبيت بمنى : واجب ليالي التشريق ( 11 ، 12 ، 13 ) أو ليلتين للمتعجل.";

                    const fullText = extractedTitle + point1 + point2Before + point2Error + point2After + point3 + point4 + point5 + point6 + point7;
                    setMaajemInputText(fullText);

                    setImageResult({
                        status: "warning",
                        verdict: "تم فحص الكراسة: رصد مسألة فقهية تحتاج إلى ضبط واستدراك ⚠️",
                        titleText: extractedTitle,
                        point1Text: point1,
                        beforeError: point2Before,
                        errorChunk: point2Error,
                        afterError: point2After,
                        remainingPoints: point3 + point4 + point5 + point6 + point7,
                        correctChunk: "يبدأ للأقوياء بعد طلوع فجر يوم النحر، ورُخّص للضعفاء والنساء بعد منتصف ليلة النحر بعد الدفع من مزدلفة",
                        sheikhNote: "توجيه الشيخ بالحرم: إطلاق عبارة (يبدأ من ليلة النحر) فيه إجمال؛ فالقادر لا يصح طوافه إلا بعد طلوع فجر يوم العيد، وإنما رُخّص في ليلة النحر بعد نصف الليل للمعذورين والنساء لشدة الزحام، فينبغي تقييد ذلك في الكراسة."
                    });
                }, 4000);
            };

            // تحليل ومعالجة ما أرسله الطالب
            const handleProcessMaajem = async (customText) => {
                const text = (customText !== undefined && customText !== null) ? customText : maajemInputText;
                if (!text || !text.trim()) return;

                // إيقاف المايك إذا كان يسجل
                if (window._maqamAudioRec) {
                    try { window._maqamAudioRec.stop(); } catch(e) {}
                }
                setIsRealMicRecording(false);
                setIsMaajemProcessing(true);
                setMaajemAnalysisResult(null);

                let finalAnswer = '';
                let newConvId = difyConversationId;

                try {
                    // المحاولة الأولى: عبر خادم المقام المحلي (Proxy)
                    try {
                        const res = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: text.trim(),
                                user: getAnonymousUserId('student'),
                                conversation_id: difyConversationId || ''
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.answer) {
                                finalAnswer = data.answer;
                                if (data.conversation_id) newConvId = data.conversation_id;
                            }
                        }
                    } catch (e) {
                        console.warn('Chat request could not reach the server.');
                    }

                    if (newConvId) setDifyConversationId(newConvId);

                    if (finalAnswer) {
                        setMaajemAnalysisResult({
                            type: 'dify_live',
                            status: 'success',

        </div>
        </div>

        </h3>
        </div>

        return (
        <div data-ui-owner="StudentDashboard" key={lec.id} className="py-2 px-4 rounded-xl mq-surface-2 border mq-border text-center text-xs mq-accent font-bold flex items-center justify-center gap-2 mq-owner">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>{lec.subject} ({lec.time})</span>
        </div>
        );
        }
        return (
        <div data-ui-owner="StudentDashboard" 
        key={lec.id}
        className={` mq-owner  p-3.5 rounded-lg border transition-all text-right space-y-2 ${
        lec.isLive 
        ? 'mq-surface-2 mq-border' 
        : 'mq-surface-2 mq-border mq-hover-accent'

        <span className="px-2 py-0.5 rounded-full mq-selected mq-ink font-bold text-[10px] flex items-center gap-1">
        <span className="w-1.5 h-1.5 rounded-full mq-surface"></span>
        <span>مباشر الآن</span>
        </span>
        ) : (
        <span className="text-[11px] mq-muted font-mono">{lec.time}</span>
        )}
        <div className="flex items-center gap-2">
        <span className="text-xs font-bold mq-ink font-['Amiri']">{lec.subject}</span>
        <span className="text-base">{MaqamDisplayText(lec.icon)}</span>
        </div>
        </div>

        <div className="flex items-center justify-between text-[11px] mq-muted pt-1 border-t mq-border">
        <div className="flex gap-2">
        <button 
        onClick={()=>feedback.open('live')} className="px-2.5 py-1 rounded-lg mq-surface-2 mq-hover mq-ink text-[10px] font-bold border mq-border transition-all"
        >
        دخول البث
        </button>
        <FeedbackNotificationsButton/>
        </div>
        <span className="mq-muted font-medium">{lec.sheikh} • <span className="mq-muted">{lec.room}</span></span>
        </div>
        </div>
        );
        })}

        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border text-center text-xs mq-muted">

        </div>
        </div>
        </div>

        </div>
        )}

        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full mq-surface-2 mq-success border mq-border text-xs font-bold">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>

        </div>
        <h3 className="text-2xl font-black mq-ink font-['Amiri']">

        { label: "📖 تسميع المنهج", prompt: "سمّع لي باب شروط الصلاة وأركانها المقررة في منهج السالكين" },
        { label: "💡 شرح مسألة", prompt: "اشرح لي مسألة دم الجبران في الحج ومتى تجب الفدية على الحاج" },
        { label: "📝 تصحيح كراستي", prompt: "دقق في كراستي الفقهية واستخرج مواضع التحرير الفقهي في مناسك الحج" },
        { label: "🌐 ترجمة المقطع", prompt: "ترجم لي شرح الشيخ د. حسن بخاري إلى لغتي الأم فورياً" }
        ].map((sug, idx) => (
        <button
        key={idx}
        onClick={() => {
        setMaajemInputText(sug.prompt);
        handleProcessMaajem(sug.prompt);
        }}
        className="px-3.5 py-1.5 rounded-xl mq-surface-2 mq-hover border mq-border mq-hover-accent text-xs mq-muted transition-all"
        >
        {MaqamDisplayText(sug.label)}
        </button>
        ))}
        </div>

        >
        <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>

        {/* زر المايكروفون الصوتي المباشر بالمنتصف */}
        <button
        onClick={handleToggleRealMic}
        className={` w-20 h-20 rounded-full flex items-center justify-center text-3xl transition-all transform ${
        isRealMicRecording 
        ? 'mq-selected mq-ink scale-110' 
        : 'mq-ink'
        }  `}
        title="اضغط للتسميع بصوتك المباشر"

        {MaqamDisplayText(isRealMicRecording ? '⏹️' : '🎙️')}
        </button>
        </div>

        <div className="text-xs font-bold mq-muted">

        <span className="mq-danger font-mono">المايك يستمع لصوتك الآن.. تحدث بالتسميع أو السؤال</span>

        )}
        </div>

        {/* حالة المسح الضوئي الأنيقة والمخفية برمجياً بدون إظهار عداد الـ 4 ثوانٍ */}

        <div className="p-5 rounded-lg mq-bg border mq-border text-center space-y-2">
        <div className="text-2xl inline-block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></div>
        <div className="text-sm font-bold mq-ink font-['Amiri']">
        جاري قراءة خط اليد وتدقيق المسائل الفقهية عبر نموذج معاجم...
        </div>
        <p className="text-[11px] mq-muted">
        مطابقة المتن مع شروح مشايخ الحرم المكي الشريف وتحديد مواضع التحرير الفقهي
        </p>
        </div>
        )}

        rows="4"
        value={maajemInputText}

        ></textarea>
        </div>

        <div className="flex justify-center gap-3">
        <button
        onClick={() => handleProcessMaajem()}
        disabled={isMaajemProcessing || !maajemInputText.trim()}

        {MaqamDisplayText(isMaajemProcessing ? 'جاري الفحص والمعالجة...' : 'إرسال وتحليل لمعاجم AI فورياً 🚀')}

        </div>
        </div>

        {/* نتيجة تحليل صورة الكراسة المرفقة: النص المكتوب بدقة والتحديد الأحمر وسط النص وبدون أي ترجمة إندونيسية */}

        {imageResult.verdict}
        </span>
        <div className="flex items-center gap-2 mq-ink font-bold font-['Amiri'] text-sm">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> النص المستخرج من صورة الكراسة مع التدقيق والتحرير الفقهي:</span>
        </div>
        </div>

        {imageResult.beforeError}
        <span className="mq-surface-2 mq-danger border mq-border px-2 py-0.5 rounded-lg font-bold underline decoration-wavy decoration-red-500 mx-1">
        {imageResult.errorChunk}
        </span>
        {imageResult.afterError}
        {imageResult.remainingPoints}
        </div>

        {/* بطاقة مقارنة الخطأ والتصحيح المعتمد */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-right">
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border space-y-1">

        <p className="mq-ink font-['Amiri'] text-sm">{imageResult.errorChunk}</p>
        </div>
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border space-y-1">
        <span className="text-[10px] mq-success font-bold block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> التحرير الفقهي المعتمد في المنهج:</span>
        <p className="mq-ink font-['Amiri'] text-sm">{imageResult.correctChunk}</p>
        </div>
        </div>

        {/* توجيه الشيخ بالحرم */}
        <div className="p-3.5 rounded-lg mq-surface-2 border mq-border mq-accent space-y-1">
        <span className="text-[10px] mq-accent font-bold block"><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> توجيه فضيلة الشيخ المدرس بالحرم:</span>
        <p className="leading-relaxed">{imageResult.sheikhNote}</p>
        </div>

        <div className="flex gap-2 justify-end pt-1">
        <button 
        className="px-4 py-2 rounded-xl mq-selected mq-ink font-bold text-xs mq-hover"
        >
        اعتماد وتصحيح الكراسة ✓
        </button>
        <button 
        className="px-4 py-2 rounded-xl mq-surface-2 mq-ink font-bold text-xs mq-hover"
        >
        استماع للفتوى بصوت الشيخ <svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg>
        </button>
        </div>
        </div>
        )}

        {/* تقرير معاجم بعد الفحص الصوتي أو النصي */}
        {maajemAnalysisResult && (
        <div className={` p-5 rounded-lg border space-y-2 text-xs ${
        maajemAnalysisResult.status === 'warning' ? 'mq-surface-2 mq-border mq-danger' :
        maajemAnalysisResult.status === 'success' ? 'mq-surface-2 mq-border mq-success' :
        'mq-surface-2 mq-border mq-ink'
        }  `}>
        <div className="flex items-center justify-between font-bold text-sm">
        <span>{MaqamDisplayText(maajemAnalysisResult.title)}</span>
        {maajemAnalysisResult.score && <span className="font-mono">{maajemAnalysisResult.score}%</span>}
        </div>
        <p className="leading-relaxed mq-ink whitespace-pre-line font-['Amiri'] text-sm sm:text-base">{maajemAnalysisResult.details}</p>
        <div className="p-2.5 rounded-xl mq-surface-2 border mq-border mq-accent font-bold">
        {maajemAnalysisResult.sheikhTip}
        </div>
        </div>
        )}

        </div>
        </div>
        )}

        <div className="space-y-6 text-right">
        
        <div className="p-6 rounded-lg mq-bg border mq-border flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div className="space-y-1">
        <div className="flex items-center gap-2">
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 mq-ink text-xs font-bold">مكتبة الدروس المعتمدة</span>

        </div>
        
        </div>

        {/* حقل البحث السريع */}
        <div className="w-full md:w-80">
        <input 
        type="text" 
        value={lessonSearchQuery}
        onChange={e => setLessonSearchQuery(e.target.value)}
        placeholder="ابحث عن درس، شيخ، مادة، متن..."
        className="w-full p-2.5 rounded-xl mq-surface-2 border mq-border mq-ink text-xs focus:outline-none"
        />
        </div>
        </div>

        {/* أزرار تصفية المواد الشرعية */}
        <details className="fb-panel"><summary className="fb-button">التصفية ({(selectedSubjectFilter!=='all'?1:0)+(lessonSearchQuery.trim()?1:0)})</summary><div className="flex flex-wrap items-center gap-2 py-3">
        {[
        { id: 'all', label: `الكل (${allInstituteLessons.length})` },
        { id: 'الفقه', label: 'الفقه الميسر' },
        { id: 'الحديث', label: 'الحديث الشريف' },
        { id: 'العقيدة', label: 'العقيدة والتوحيد' },
        { id: 'التفسير', label: 'التفسير وعلوم القرآن' },
        { id: 'أصول الفقه', label: 'أصول الفقه' },
        { id: 'اللغة العربية', label: 'اللغة والنحو' },
        { id: 'الفرائض', label: 'الفرائض' },
        { id: 'السيرة', label: 'السيرة النبوية' }
        ].map(sub => (
        <button
        key={sub.id}
        onClick={() => setSelectedSubjectFilter(sub.id)}
        className={` px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${
        selectedSubjectFilter === sub.id 
        ? 'mq-selected mq-ink' 
        : 'mq-surface-2 mq-muted mq-hover'
        }  `}
        >
        {MaqamDisplayText(sub.label)}
        </button>
        ))}
        </div>
<FeedbackButton onClick={()=>{setSelectedSubjectFilter('all');setLessonSearchQuery('');}}>مسح الكل</FeedbackButton></details>

        {/* شبكة كروت الدروس (أكثر من 25 درساً) */}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mq-institute-lessons">
        {filteredLessons.map(les => (
        <div 
        key={les.id}
        className="p-5 rounded-lg mq-bg border mq-border mq-hover-accent transition-all flex flex-col justify-between space-y-4 group relative overflow-hidden"
        >
        <div className="space-y-3 text-right">
        <div className="flex items-center justify-between">
        <span className="text-[10px] mq-muted font-mono flex items-center gap-1">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        <span>{les.duration}</span>
        </span>
        <span className="px-2.5 py-0.5 rounded-full mq-surface-2 mq-ink border mq-border text-[10px] font-bold">
        {les.subject}
        </span>
        </div>

        {MaqamDisplayText(les.title)}
        </h4>

        <div className="text-[11px] mq-muted space-y-0.5">
        <div className="notranslate mq-muted font-medium" translate="no">{les.sheikh}</div>
        <div className="text-[10px] mq-muted">{les.series||les.subject}</div>
        </div>
        </div>

        <div className="pt-3 border-t mq-border space-y-2"><Round3Reminder lecture={les}/><Round3PlaylistButton lecture={les}/>
        <div className="flex items-center justify-between text-[10px] mq-success">
        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg> {les.primary?'الملخص والاختبار قيد الإعداد':'ملخص وأسئلة من المواد المرفقة'}</span>
        <span>{les.transcript?'التفريغ متاح':''}</span>
        </div>
        <button
        onClick={() => setActivePlayingLesson(les)}

        <span><svg className="mq-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h6M8 16h4"/></svg></span>
        </button>
        </div>
        </div>
        ))}
        </div>
        </div>
        )}

        {/* 4. قسم جدولي (تقويم هجري مع تحديد اليوم الحالي بالأخضر والحصص الخمس) */}
        {activeTab === 'my_schedule' && (
        <FeedbackSchedule/>
        )}

function fbRiyadhInputToISO(date, time) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || !/^\d{2}:\d{2}$/.test(time || '')) return null;
    const [year, month, day] = date.split('-').map(Number), [hour, minute] = time.split(':').map(Number);

}

const round3I18n=(()=>{
 let code='ar',generation=0,running=0,queue=[],pending=0,failed=false,blocked=false,flushTimer=0,cacheTimer=0;const tasks=new Map(),cache=new Map();

 const drain=()=>{clearTimeout(flushTimer);if(blocked){while(queue.length){const t=queue.shift();pending--;tasks.delete(t.key);t.reject(Error('translation-unavailable'));}status();return;}while(running<2&&queue.length){const batch=[];let length=0;while(queue.length&&batch.length<15&&length+queue[0].text.length<3000){const item=queue.shift();batch.push(item);length+=item.text.length+12;}if(!batch.length)batch.push(queue.shift());running++;const epoch=generation,target=code;const source=batch.map((x,i)=>'⟦'+i+'⟧'+x.text).join('\n');MaqamTranslation.requestTranslation(source,target).then(result=>{if(epoch!==generation)throw Error('superseded');const values=round3I18nRules.unpack(result,batch.length);batch.forEach((t,i)=>{cache.set(t.key,values[i]);t.resolve(values[i]);});persist();}).catch(e=>{if(epoch===generation){failed=true;blocked=true;}batch.forEach(t=>t.reject(e));}).finally(()=>{running--;if(epoch===generation){batch.forEach(t=>{tasks.delete(t.key);pending=Math.max(0,pending-1);});status();}drain();});}};

function useRound3Text(source,protectedSource=false){const [language,setLanguage]=useState(round3I18n.code),[text,setText]=useState(source);useEffect(()=>{const change=e=>setLanguage(e.detail);window.addEventListener('fb:i18n-language',change);return()=>window.removeEventListener('fb:i18n-language',change);},[]);useEffect(()=>{let dead=false;setText(source);if(!protectedSource&&window.MAQAM_UI_STRINGS?.includes(source.trim().replace(/\s+/g,' ')))round3I18n.text(source,language).then(value=>{if(!dead)setText(value);}).catch(()=>{});return()=>{dead=true;};},[source,language,protectedSource]);return text;}
